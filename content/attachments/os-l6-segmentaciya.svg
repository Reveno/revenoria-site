<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="980" height="550"><rect width="980" height="550" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сегментація: погляд програміста замість погляду апаратури</text><text x="145.0" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Як бачить програміст</text><rect x="50" y="88" width="190" height="62" rx="3" fill="#eaf0f8" stroke="#2b5c99" stroke-width="1.5"/><text x="145.0" y="124.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b5c99" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Код  (сегмент 0)</text><rect x="50" y="160" width="190" height="44" rx="3" fill="#f0f6f1" stroke="#2f6b40" stroke-width="1.5"/><text x="145.0" y="187.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дані  (сегмент 1)</text><rect x="50" y="214" width="190" height="76" rx="3" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="145.0" y="257.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Купа  (сегмент 2)</text><rect x="50" y="300" width="190" height="40" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.5"/><text x="145.0" y="325.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стек  (сегмент 3)</text><text x="145.0" y="366" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у кожного своя довжина</text><text x="425.0" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиця сегментів</text><rect x="300" y="88" width="250" height="30" rx="0" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.3"/><text x="332" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сегмент</text><text x="394" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">база</text><text x="456" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">межа</text><text x="518" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">права</text><rect x="300" y="118" width="250" height="34" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="332" y="140" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5c99" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="394" y="140" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1400</text><text x="456" y="140" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">620</text><text x="518" y="140" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">r-x</text><rect x="300" y="152" width="250" height="34" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="332" y="174" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="394" y="174" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6300</text><text x="456" y="174" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">440</text><text x="518" y="174" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">rw-</text><rect x="300" y="186" width="250" height="34" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="332" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="394" y="208" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4300</text><text x="456" y="208" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">760</text><text x="518" y="208" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">rw-</text><rect x="300" y="220" width="250" height="34" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="332" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="394" y="242" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3200</text><text x="456" y="242" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">400</text><text x="518" y="242" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">rw-</text><text x="425.0" y="288" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">база + межа для кожного окремо</text><text x="720.0" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фізична пам'ять</text><rect x="620" y="88" width="200" height="26" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="720.0" y="105.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно</text><rect x="620" y="114" width="200" height="34" rx="0" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="720.0" y="135.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стек</text><rect x="620" y="148" width="200" height="20" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="720.0" y="162.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно</text><rect x="620" y="168" width="200" height="58" rx="0" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><text x="720.0" y="201.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Купа</text><rect x="620" y="226" width="200" height="30" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="720.0" y="245.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно</text><rect x="620" y="256" width="200" height="50" rx="0" fill="#eaf0f8" stroke="#2b5c99" stroke-width="1.4"/><text x="720.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b5c99" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Код</text><rect x="620" y="306" width="200" height="24" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="720.0" y="322.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно</text><rect x="620" y="330" width="200" height="38" rx="0" fill="#f0f6f1" stroke="#2f6b40" stroke-width="1.4"/><text x="720.0" y="353.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дані</text><rect x="620" y="368" width="200" height="22" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="720.0" y="383.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно</text><text x="720.0" y="408" text-anchor="middle" font-size="11" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">шматки різної довжини — дірки повертаються</text><rect x="30" y="424" width="920" height="106" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="450" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що сегментація дала і що забрала:</text><text x="52" y="474" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дала — розбиття, яке збігається зі змістом програми, і природне місце для прав доступу: код можна зробити тільки</text><text x="52" y="494" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виконуваним, дані — незапускними. Забрала — суцільність кожного сегмента, а з нею повернулася зовнішня фрагментація.</text><text x="52" y="518" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тому сучасні системи взяли від сегментації права доступу, а розміщення віддали сторінкам.</text></svg>