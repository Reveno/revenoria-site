e="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">11</text><text x="170" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у каталозі: початок 4, довжина 4</text><rect x="40" y="240" width="260" height="60" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="52" y="260" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Найшвидше читання підряд,</text><text x="52" y="278" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    довільний доступ — одна арифметика.</text><rect x="40" y="308" width="260" height="96" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="52" y="330" text-anchor="start" font-size="10.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Зовнішня фрагментація.</text><text x="52" y="352" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     Розмір треба знати наперед.</text><text x="52" y="374" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     Виріс файл — нема куди рости.</text><rect x="340" y="60" width="300" height="352" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="60" width="300" height="38" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="90" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="490" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Зв'язне</text><text x="490" y="126" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">диск, 12 блоків</text><rect x="362" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="371.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><rect x="383" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="392.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="404" y="136" width="19" height="44" rx="2" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="413.5" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→11</text><text x="413.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><rect x="425" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="434.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="446" y="136" width="19" height="44" rx="2" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="455.5" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→9</text><text x="455.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="467" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="476.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><rect x="488" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="497.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6</text><rect x="509" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="518.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="530" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="539.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8</text><rect x="551" y="136" width="19" height="44" rx="2" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="560.5" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→2</text><text x="560.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">9</text><rect x="572" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="581.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">10</text><rect x="593" y="136" width="19" height="44" rx="2" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="602.5" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кін</text><text x="602.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">11</text><text x="490" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у каталозі: перший блок 4</text><rect x="360" y="240" width="260" height="60" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="372" y="260" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Фрагментації немає зовсім,</text><text x="372" y="278" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    файл росте як завгодно.</text><rect x="360" y="308" width="260" height="96" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="372" y="330" text-anchor="start" font-size="10.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Довільний доступ жахливий:</text><text x="372" y="352" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     щоб дійти до кінця — читати все.</text><text x="372" y="374" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     Загубився покажчик — зник хвіст.</text><rect x="660" y="60" width="300" height="352" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="60" width="300" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="90" width="300" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="810" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Індексне</text><text x="810" y="126" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">диск, 12 блоків</text><rect x="682" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="691.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><rect x="703" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="712.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="724" y="136" width="19" height="44" rx="2" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="733.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><rect x="745" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="754.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="766" y="136" width="19" height="44" rx="2" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="775.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="787" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="796.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><rect x="808" y="136" width="19" height="44" rx="2" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="817.5" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інд</text><text x="817.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6</text><rect x="829" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="838.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="850" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="859.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8</text><rect x="871" y="136" width="19" height="44" rx="2" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="880.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">9</text><rect x="892" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="901.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">10</text><rect x="913" y="136" width="19" height="44" rx="2" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="922.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">11</text><text x="810" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок 6 — індекс: 4, 9, 2, 11</text><rect x="680" y="240" width="260" height="60" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="692" y="260" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Довільний доступ швидкий,</text><text x="692" y="278" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    фрагментації немає.</text><rect x="680" y="308" width="260" height="96" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="692" y="330" text-anchor="start" font-size="10.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Індексний блок займає місце.</text><text x="692" y="352" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     Для дрібних файлів це помітні</text><text x="692" y="374" text-anchor="start" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">     накладні витрати.</text><rect x="20" y="430" width="940" height="52" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="42" y="454" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Перемогло індексне: воно єдине дає і швидкий довільний доступ, і вільне зростання. FAT — це зв'язне, у якому всі</text><text x="42" y="474" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">покажчики зібрано в одну таблицю; ext4, NTFS і APFS — індексне з різними способами описувати індекс.</text></svg>