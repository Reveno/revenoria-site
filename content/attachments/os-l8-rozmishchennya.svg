<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500"><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три способи покласти файл на диск</text><rect x="20" y="60" width="300" height="352" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.6"/><rect x="20" y="60" width="300" height="38" rx="6" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><rect x="20" y="90" width="300" height="8" rx="0" fill="#eaf0f8" stroke="none" stroke-width="0"/><text x="170" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Суцільне</text><text x="170" y="126" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">диск, 12 блоків</text><rect x="42" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="51.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><rect x="63" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="72.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="84" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="93.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><rect x="105" y="136" width="19" height="44" rx="2" fill="#fafafa" stroke="#d5d5d5" stroke-width="1"/><text x="114.5" y="194" text-anchor="middle" font-size="8.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</tex