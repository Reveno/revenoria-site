xt x="735.0" y="478" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">порядок довільний, шматки де завгодно</text><rect x="30" y="492" width="920" height="62" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="52" y="516" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Зовнішня фрагментація зникає повністю: будь-який вільний фрейм годиться для будь-якої сторінки, бо всі вони однакові.</text><text x="52" y="538" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Внутрішня лишається, але мізерна — тільки в останній сторінці процесу, у середньому пів сторінки, тобто 2 КБ.</text></svg>