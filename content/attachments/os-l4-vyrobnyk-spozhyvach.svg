-family="DejaVu Sans, Segoe UI, Arial, sans-serif">—</text><rect x="361.0" y="214.0" width="48" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><text x="385.0" y="237.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">—</text><rect x="391.8" y="139.8" width="48" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><text x="415.8" y="162.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">—</text><text x="490" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кільцевий буфер</text><text x="490" y="245" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8 комірок, зайнято 3</text><rect x="40" y="194" width="168" height="76" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><text x="124.0" y="227.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВИРОБНИК</text><text x="124.0" y="245.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">формує дані</text><line x1="216" y1="232" x2="377.5" y2="298.8" stroke="#2f6b40" stroke-width="2.2"/><path d="M385.8 302.2 L375.6 303.4 L379.4 294.1 Z" fill="#2f6b40"/><text x="300" y="224" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кладе у вільну комірку</text><rect x="772" y="194" width="168" height="76" rx="4" fill="#fdf4f3" stroke="#96302f" stroke-width="1.6"/><text x="856.0" y="227.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">СПОЖИВАЧ</text><text x="856.0" y="245.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">обробляє дані</text><line x1="625.0" y1="232.0" x2="755.0" y2="232.0" stroke="#96302f" stroke-width="2.2"/><path d="M764.0 232.0 L755.0 237.0 L755.0 227.0 Z" fill="#96302f"/><text x="706" y="214" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">забирає найстарішу</text><text x="384.6" y="342.4" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">in</text><text x="629.0" y="258.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">out</text><rect x="40" y="380" width="900" height="100" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="62" y="406" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три об'єкти, і кожен відповідає за своє:</text><text x="62" y="430" text-anchor="start" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">mutex = 1</text><text x="162" y="430" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— не дає двом потокам одночасно правити покажчики in та out</text><text x="62" y="449" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">empty = 5</text><text x="162" y="449" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— рахує вільні комірки; коли 0 — виробник засинає</text><text x="62" y="468" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">full = 3</text><text x="162" y="468" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— рахує зайняті комірки; коли 0 — споживач засинає</text></svg>