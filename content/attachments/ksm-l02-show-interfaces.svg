<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Як читати show ip interface brief</text><rect x="30" y="55" width="700" height="255" fill="#1f1d1c" stroke="#1f1d1c" stroke-width="1" rx="8"/><text x="48" y="82" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">SW-LAB# show ip interface brief</text><text x="48" y="110" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#ffffff" text-anchor="start" font-weight="normal" xml:space="preserve">Interface          IP-Address      OK? Method Status                Protocol</text><text x="48" y="138" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">FastEthernet0/1    unassigned      YES unset  up                    up</text><text x="48" y="166" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">FastEthernet0/2    unassigned      YES unset  up                    up</text><text x="48" y="194" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">FastEthernet0/3    unassigned      YES unset  up                    up</text><text x="48" y="222" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">FastEthernet0/4    unassigned      YES unset  down                  down</text><text x="48" y="250" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">FastEthernet0/5    unassigned      YES unset  administratively down down</text><text x="48" y="278" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Vlan1              192.168.10.254  YES manual up                    up</text><line x1="735" y1="134" x2="752" y2="134" stroke="#2e7d4f" stroke-width="1.5"/><text x="758" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">кабель є, ПК підключений</text><line x1="735" y1="218" x2="752" y2="218" stroke="#6b6763" stroke-width="1.5"/><text x="758" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="bold" xml:space="preserve">кабелю немає: down / down</text><line x1="735" y1="246" x2="752" y2="246" stroke="#a83232" stroke-width="1.5"/><text x="758" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="start" font-weight="bold" xml:space="preserve">вимкнено командою shutdown</text><line x1="735" y1="274" x2="752" y2="274" stroke="#2e7d4f" stroke-width="1.5"/><text x="758" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">SVI піднято: no shutdown</text><text x="40" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="normal" xml:space="preserve">Status – чи ввімкнено порт адміністративно й чи є сигнал на кабелі.</text><text x="40" y="368" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="normal" xml:space="preserve">Protocol – чи піднявся протокол канального рівня поверх порту.</text><text x="40" y="398" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="normal" xml:space="preserve">administratively down – порт вимкнено вручну; down/down – фізичної лінії немає; up/up – порт працює.</text><text x="40" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a83232" text-anchor="start" font-weight="bold" xml:space="preserve">На комутаторі порти доступу ввімкнені за замовчуванням, а віртуальний інтерфейс Vlan1 – вимкнений.</text></svg>