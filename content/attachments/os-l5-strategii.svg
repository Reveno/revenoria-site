<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510"><rect width="980" height="510" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чотири стратегії щодо глухих кутів — і чому найпоширеніша з них найпростіша</text><rect x="30" y="62" width="920" height="34" rx="4" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.3"/><text x="44" y="84" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стратегія</text><line x1="210" y1="62" x2="210" y2="96" stroke="#cfcfcf" stroke-width="1"/><text x="224" y="84" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Суть</text><line x1="510" y1="62" x2="510" y2="96" stroke="#cfcfcf" stroke-width="1"/><text x="524" y="84" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ціна</text><line x1="700" y1="62" x2="700" y2="96" stroke="#cfcfcf" stroke-width="1"/><text x="714" y="84" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Де застосовують</text><rect x="30" y="96" width="920" height="84" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="30" y="96" width="5" height="84" rx="0" fill="#555555" stroke="none" stroke-width="0"/><text x="50" y="128" text-anchor="start" font-size="13.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ігнорувати</text><text x="50" y="147" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">«страусиний алгоритм»</text><line x1="210" y1="96" x2="210" y2="180" stroke="#e0e0e0" stroke-width="1"/><text x="224" y="126.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Не робити нічого. Якщо система</text><text x="224" y="142.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зависла — перезавантажити її</text><text x="224" y="158.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">або зняти процес вручну.</text><line x1="510" y1="96" x2="510" y2="180" stroke="#e0e0e0" stroke-width="1"/><text x="524" y="126.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Нуль під час роботи.</text><text x="524" y="142.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Рідкісні зависання лягають</text><text x="524" y="158.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на користувача.</text><line x1="700" y1="96" x2="700" y2="180" stroke="#e0e0e0" stroke-width="1"/><text x="714" y="126.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Windows, Linux, macOS —</text><text x="714" y="142.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">для переважної більшості</text><text x="714" y="158.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ресурсів саме так.</text><rect x="30" y="180" width="920" height="84" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><rect x="30" y="180" width="5" height="84" rx="0" fill="#204a80" stroke="none" stroke-width="0"/><text x="50" y="212" text-anchor="start" font-size="13.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Запобігати</text><text x="50" y="231" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">prevention</text><line x1="210" y1="180" x2="210" y2="264" stroke="#e0e0e0" stroke-width="1"/><text x="224" y="210.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Спроєктувати систему так, щоб</text><text x="224" y="226.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">одна з чотирьох умов узагалі</text><text x="224" y="242.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не могла виконатися.</text><line x1="510" y1="180" x2="510" y2="264" stroke="#e0e0e0" stroke-width="1"/><text x="524" y="218.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обмежує гнучкість,</text><text x="524" y="234.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інколи знижує паралелізм.</text><line x1="700" y1="180" x2="700" y2="264" stroke="#e0e0e0" stroke-width="1"/><text x="714" y="210.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Єдиний порядок захоплення</text><text x="714" y="226.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">замків — у ядрі й у будь-якому</text><text x="714" y="242.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">прикладному коді.</text><rect x="30" y="264" width="920" height="84" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><rect x="30" y="264" width="5" height="84" rx="0" fill="#9a6a12" stroke="none" stroke-width="0"/><text x="50" y="296" text-anchor="start" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обходити</text><text x="50" y="315" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">avoidance</text><line x1="210" y1="264" x2="210" y2="348" stroke="#e0e0e0" stroke-width="1"/><text x="224" y="294.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Перед кожною видачею ресурсу</text><text x="224" y="310.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">перевіряти, чи стан системи</text><text x="224" y="326.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">залишиться безпечним.</text><line x1="510" y1="264" x2="510" y2="348" stroke="#e0e0e0" stroke-width="1"/><text x="524" y="294.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Треба знати максимальні</text><text x="524" y="310.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреби наперед. Перевірка</text><text x="524" y="326.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на кожному запиті — дорого.</text><line x1="700" y1="264" x2="700" y2="348" stroke="#e0e0e0" stroke-width="1"/><text x="714" y="294.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Майже ніде. Алгоритм банкіра</text><text x="714" y="310.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лишився навчальним</text><text x="714" y="326.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">прикладом.</text><rect x="30" y="348" width="920" height="84" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><rect x="30" y="348" width="5" height="84" rx="0" fill="#2f6b40" stroke="none" stroke-width="0"/><text x="50" y="380" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Виявляти</text><text x="50" y="399" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й відновлювати</text><line x1="210" y1="348" x2="210" y2="432" stroke="#e0e0e0" stroke-width="1"/><text x="224" y="378.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дозволити кутам виникати,</text><text x="224" y="394.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">періодично шукати цикли</text><text x="224" y="410.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й розривати їх.</text><line x1="510" y1="348" x2="510" y2="432" stroke="#e0e0e0" stroke-width="1"/><text x="524" y="378.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Вартість перевірок плюс</text><text x="524" y="394.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">втрачена робота жертви,</text><text x="524" y="410.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">яку доводиться відкочувати.</text><line x1="700" y1="348" x2="700" y2="432" stroke="#e0e0e0" stroke-width="1"/><text x="714" y="378.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Усі серйозні СУБД:</text><text x="714" y="394.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">PostgreSQL, MySQL/InnoDB,</text><text x="714" y="410.0" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Oracle, SQL Server.</text><rect x="30" y="444" width="920" height="40" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="490.0" y="469" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чим рідший глухий кут і чим дешевший перезапуск, тим вище в цій таблиці розумно зупинитися.</text></svg>