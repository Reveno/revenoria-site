<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460"><rect width="980" height="460" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Де що зберігається: ім'я окремо, метадані окремо, вміст окремо</text><rect x="40" y="76" width="250" height="150" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.8"/><rect x="40" y="76" width="250" height="36" rx="6" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><rect x="40" y="104" width="250" height="8" rx="0" fill="#eaf0f8" stroke="none" stroke-width="0"/><text x="165.0" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Запис у каталозі</text><rect x="60" y="128" width="210" height="40" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="165.0" y="145" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ім'я</text><text x="165.0" y="162" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><rect x="60" y="174" width="210" height="40" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="165.0" y="191" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">номер i-node</text><text x="165.0" y="208" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1247</text><text x="165.0" y="248" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">усього два поля — і більше нічого</text><rect x="358" y="76" width="280" height="244" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><rect x="358" y="76" width="280" height="36" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><rect x="358" y="104" width="280" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="498.0" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">i-node 1247 — метадані</text><text x="374" y="126" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тип</text><text x="622" y="126" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звичайний файл</text><text x="374" y="152" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">права</text><text x="622" y="152" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">rw-r--r--</text><text x="374" y="178" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">власник</text><text x="622" y="178" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">uid 1000, gid 1000</text><text x="374" y="204" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір</text><text x="622" y="204" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">18 432 байти</text><text x="374" y="230" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">часи</text><text x="622" y="230" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">створення, зміни, доступу</text><text x="374" y="256" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лічильник посилань</text><text x="622" y="256" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="374" y="282" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">покажчики</text><text x="622" y="282" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">12 прямих + непрямі</text><text x="498.0" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">імені файлу тут немає</text><rect x="700" y="76" width="240" height="200" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.8"/><rect x="700" y="76" width="240" height="36" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.8"/><rect x="700" y="104" width="240" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="820.0" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Блоки з даними</text><rect x="720" y="126" width="200" height="30" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="820.0" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок 3891</text><rect x="720" y="162" width="200" height="30" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="820.0" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок 3892</text><rect x="720" y="198" width="200" height="30" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="820.0" y="218" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок 4177</text><rect x="720" y="234" width="200" height="30" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="820.0" y="254" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок 4178</text><text x="820.0" y="298" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">власне вміст файлу</text><line x1="294" y1="194" x2="343.0" y2="194.0" stroke="#999999" stroke-width="2.2"/><path d="M352.0 194.0 L343.0 199.0 L343.0 189.0 Z" fill="#999999"/><line x1="642" y1="194" x2="685.0" y2="194.0" stroke="#999999" stroke-width="2.2"/><path d="M694.0 194.0 L685.0 199.0 L685.0 189.0 Z" fill="#999999"/><rect x="40" y="372" width="900" height="76" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="62" y="398" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найважливіше в цій схемі — те, чого в ній немає: ім'я файлу не зберігається разом із файлом. Воно живе тільки</text><text x="62" y="418" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">в каталозі, а каталог — це звичайний файл, у якому лежать пари «ім'я — номер i-node».</text><text x="62" y="440" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Саме з цього розділення випливає все, про що йтиметься далі: посилання, перейменування й видалення файлів.</text></svg>