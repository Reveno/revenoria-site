<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600"><rect width="980" height="600" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Інверсія пріоритетів і як її лікують успадкуванням</text><text x="30" y="64" text-anchor="start" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1.  Як ламається</text><text x="175" y="64" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— найважливіший потік застряг через потік, який до м'ютекса не має жодного стосунку</text><text x="164" y="95.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">В — високий</text><text x="164" y="110.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">критично важливий</text><rect x="178" y="80" width="162" height="34" rx="3" fill="#f7f7f7" stroke="#dddddd" stroke-width="1.3"/><text x="259.0" y="101.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ще не готовий</text><rect x="340" y="80" width="60" height="34" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="370.0" y="101.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock()</text><rect x="400" y="80" width="540" height="34" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="670.0" y="101.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ЧЕКАЄ І ЧЕКАЄ</text><text x="164" y="139.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">С — середній</text><text x="164" y="154.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">довгий обрахунок</text><rect x="178" y="124" width="322" height="34" rx="3" fill="#f7f7f7" stroke="#dddddd" stroke-width="1.3"/><text x="339.0" y="145.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ще не готовий</text><rect x="500" y="124" width="440" height="34" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="720.0" y="145.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">працює — витіснив Н</text><text x="164" y="183.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Н — низький</text><text x="164" y="198.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фонова задача</text><rect x="178" y="168" width="62" height="34" rx="3" fill="#eaf3ec" stroke="#2f6b40" stroke-width="1.3"/><text x="209.0" y="189.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">працює</text><rect x="240" y="168" width="260" height="34" rx="3" fill="#d8eade" stroke="#2f6b40" stroke-width="1.3"/><text x="370.0" y="189.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тримає м'ютекс</text><rect x="500" y="168" width="440" height="34" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="720.0" y="189.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">витіснений, до м'ютекса не дістається</text><line x1="240" y1="74" x2="240" y2="206" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="240" y="222" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Н захопив</text><text x="240" y="237" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">м'ютекс</text><line x1="400" y1="74" x2="400" y2="206" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="400" y="222" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">В просить —</text><text x="400" y="237" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайнято</text><line x1="500" y1="74" x2="500" y2="206" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="500" y="254" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">С витіснив Н</text><text x="30" y="276" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Наслідок: пріоритети перевернуто — високий чекає на середній, хоч спільного ресурсу між ними немає.</text><text x="30" y="330" text-anchor="start" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2.  Успадкування пріоритету</text><text x="306" y="330" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— власник м'ютекса тимчасово підіймається до пріоритету того, хто на нього чекає</text><text x="164" y="361.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">В — високий</text><text x="164" y="376.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">критично важливий</text><rect x="178" y="346" width="162" height="34" rx="3" fill="#f7f7f7" stroke="#dddddd" stroke-width="1.3"/><text x="259.0" y="367.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ще не готовий</text><rect x="340" y="346" width="60" height="34" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="370.0" y="367.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock()</text><rect x="400" y="346" width="120" height="34" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="460.0" y="367.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">чекає</text><rect x="520" y="346" width="420" height="34" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.3"/><text x="730.0" y="367.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">працює</text><text x="164" y="405.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">С — середній</text><text x="164" y="420.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">довгий обрахунок</text><rect x="178" y="390" width="262" height="34" rx="3" fill="#f7f7f7" stroke="#dddddd" stroke-width="1.3"/><text x="309.0" y="411.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ще не готовий</text><rect x="440" y="390" width="500" height="34" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="690.0" y="411.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">готовий, але пріоритет нижчий — чекає своєї черги</text><text x="164" y="449.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Н — низький</text><text x="164" y="464.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фонова задача</text><rect x="178" y="434" width="62" height="34" rx="3" fill="#eaf3ec" stroke="#2f6b40" stroke-width="1.3"/><text x="209.0" y="455.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">працює</text><rect x="240" y="434" width="160" height="34" rx="3" fill="#d8eade" stroke="#2f6b40" stroke-width="1.3"/><text x="320.0" y="455.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тримає м'ютекс</text><rect x="400" y="434" width="120" height="34" rx="3" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.3"/><text x="460.0" y="455.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">пріоритет В</text><rect x="520" y="434" width="420" height="34" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="730.0" y="455.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернувся до свого пріоритету</text><line x1="400" y1="340" x2="400" y2="472" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="400" y="488" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Н успадкував</text><text x="400" y="503" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">пріоритет В</text><line x1="520" y1="340" x2="520" y2="472" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="520" y="520" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">м'ютекс віддано —</text><text x="520" y="535" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">В працює</text><text x="30" y="574" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Саме це вмикали на Марсі: патч надіслали на Pathfinder по радіо, і перезавантаження припинилися.</text></svg>