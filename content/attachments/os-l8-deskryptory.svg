<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 516" width="980" height="516"><rect width="980" height="516" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три таблиці за одним дескриптором: чому позиція буває спільною</text><text x="140" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиці дескрипторів</text><rect x="30" y="80" width="220" height="96" rx="5" fill="#ffffff" stroke="#204a80" stroke-width="1.5"/><text x="140" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес А (батько)</text><rect x="44" y="116" width="192" height="22" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="140" y="132" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0, 1, 2 — консоль</text><rect x="44" y="142" width="192" height="22" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><text x="140" y="158" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3 → відкритий файл</text><rect x="30" y="192" width="220" height="96" rx="5" fill="#ffffff" stroke="#2f6b40" stroke-width="1.5"/><text x="140" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес Б (нащадок)</text><rect x="44" y="228" width="192" height="22" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="140" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0, 1, 2 — консоль</text><rect x="44" y="254" width="192" height="22" rx="3" fill="#eaf0f8" stroke="#2f6b40" stroke-width="1.2"/><text x="140" y="270" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3 → відкритий файл</text><rect x="30" y="304" width="220" height="96" rx="5" fill="#ffffff" stroke="#9a6a12" stroke-width="1.5"/><text x="140" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес В (окремий)</text><rect x="44" y="340" width="192" height="22" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="140" y="356" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0, 1, 2 — консоль</text><rect x="44" y="366" width="192" height="22" rx="3" fill="#eaf0f8" stroke="#9a6a12" stroke-width="1.2"/><text x="140" y="382" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3 → відкритий файл</text><text x="489.0" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Системна таблиця відкритих файлів</text><rect x="344" y="86" width="290" height="150" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.7"/><text x="489.0" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Запис №1</text><text x="489.0" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">позиція в файлі: 4096</text><text x="489.0" y="154" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">режим: читання й запис</text><rect x="364" y="168" width="250" height="52" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="489.0" y="188" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">спільний для А і Б</text><text x="489.0" y="208" text-anchor="middle" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">після fork нащадок успадкував запис</text><rect x="344" y="262" width="290" height="122" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.7"/><text x="489.0" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Запис №2</text><text x="489.0" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">позиція в файлі: 0</text><text x="489.0" y="330" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">режим: тільки читання</text><rect x="364" y="344" width="250" height="28" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.3"/><text x="489.0" y="363" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">власний, бо В зробив свій open()</text><text x="828.0" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиця i-node</text><rect x="706" y="150" width="244" height="170" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.7"/><text x="828.0" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">i-node 1247</text><text x="828.0" y="204" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><line x1="730" y1="216" x2="926" y2="216" stroke="#e0e0e0" stroke-width="1"/><text x="828.0" y="240" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір, права, часи,</text><text x="828.0" y="258" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">покажчики на блоки</text><rect x="730" y="272" width="196" height="32" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="828.0" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у пам'яті один-єдиний</text><line x1="254" y1="153" x2="329.0" y2="150.3" stroke="#204a80" stroke-width="1.8"/><path d="M338.0 150.0 L329.2 155.3 L328.8 145.3 Z" fill="#204a80"/><line x1="254" y1="265" x2="331.4" y2="192.2" stroke="#2f6b40" stroke-width="1.8"/><path d="M338.0 186.0 L334.9 195.8 L328.0 188.5 Z" fill="#2f6b40"/><line x1="254" y1="377" x2="330.5" y2="326.9" stroke="#9a6a12" stroke-width="1.8"/><path d="M338.0 322.0 L333.2 331.1 L327.7 322.7 Z" fill="#9a6a12"/><line x1="638" y1="160" x2="692.4" y2="195.1" stroke="#204a80" stroke-width="1.8"/><path d="M700.0 200.0 L689.7 199.3 L695.1 190.9 Z" fill="#204a80"/><line x1="638" y1="320" x2="694.0" y2="256.7" stroke="#9a6a12" stroke-width="1.8"/><path d="M700.0 250.0 L697.8 260.1 L690.3 253.4 Z" fill="#9a6a12"/><rect x="30" y="410" width="920" height="84" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="436" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Наслідок, який щодня рятує оболонку: батько й нащадок мають спільну позицію, тому їхні записи в один файл ідуть</text><text x="52" y="456" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">один за одним і не затирають одне одного — саме так працює перенаправлення виводу в конвеєрі.</text><text x="52" y="480" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">А два незалежні open() дають дві позиції: обидва процеси пишуть із нуля й псують роботу один одному.</text></svg>