<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232120"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Звідки комп'ютер бере IP за ім'ям</text><rect x="20" y="70" width="190" height="80" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="115.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">Програма</text><text x="115.0" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">ping, браузер, curl</text><rect x="300" y="70" width="250" height="80" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="425.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold">Кеш DNS-клієнта</text><text x="425.0" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">у нього вже завантажено</text><text x="425.0" y="134" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">і вміст файлу hosts</text><rect x="640" y="70" width="240" height="80" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="760.0" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">DNS-сервер</text><text x="760.0" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">адреса з ipconfig /all</text><line x1="212" y1="100" x2="298" y2="100" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><line x1="552" y1="100" x2="638" y2="100" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><text x="255" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">ім'я?</text><text x="595" y="90" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">немає в кеші</text><line x1="638" y1="135" x2="552" y2="135" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><text x="595" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="normal">відповідь + TTL</text><rect x="300" y="240" width="250" height="64" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="425.0" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold">nslookup</text><text x="425.0" y="284" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">іде одразу до сервера, повз кеш</text><line x1="552" y1="272" x2="750" y2="154" stroke="#b9631b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#ao)"/><text x="450" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Запис живе в кеші TTL секунд. Саме тому другий ping на той самий сайт не створює DNS-пакета</text></svg>