<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Кадр Ethernet і той самий кадр із тегом 802.1Q</text><text x="40" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold" xml:space="preserve">Звичайний кадр (порт доступу)</text><rect x="40" y="70" width="140" height="56" fill="#ffffff" stroke="#204a80" stroke-width="2" rx="0"/><text x="110.0" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">MAC призн.</text><rect x="180" y="70" width="140" height="56" fill="#ffffff" stroke="#204a80" stroke-width="2" rx="0"/><text x="250.0" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">MAC відпр.</text><rect x="320" y="70" width="80" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="360.0" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">Тип</text><rect x="400" y="70" width="360" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="580.0" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">Дані</text><rect x="760" y="70" width="80" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="800.0" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">FCS</text><text x="40" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold" xml:space="preserve">Кадр на транку: тег вставлено після MAC відправника</text><rect x="40" y="190" width="140" height="56" fill="#ffffff" stroke="#204a80" stroke-width="2" rx="0"/><text x="110.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">MAC призн.</text><rect x="180" y="190" width="140" height="56" fill="#ffffff" stroke="#204a80" stroke-width="2" rx="0"/><text x="250.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">MAC відпр.</text><rect x="320" y="190" width="160" height="56" fill="#ffffff" stroke="#a83232" stroke-width="2" rx="0"/><text x="400.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="middle" font-weight="bold" xml:space="preserve">Тег 802.1Q  4 байти</text><rect x="480" y="190" width="80" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="520.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">Тип</text><rect x="560" y="190" width="260" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="690.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">Дані</text><rect x="820" y="190" width="80" height="56" fill="#ffffff" stroke="#6b6763" stroke-width="2" rx="0"/><text x="860.0" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold" xml:space="preserve">FCS</text><line x1="430" y1="130" x2="430" y2="190" stroke="#a83232" stroke-width="2"/><polygon points="430,190 426.5,181.7 433.5,181.7" fill="#a83232"/><text x="500" y="285" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">Усередині тега: TPID (ознака тегованого кадру), пріоритет PCP і 12 біт номера VLAN.</text><text x="500" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">12 біт дають 4096 значень; номери 0 і 4095 зарезервовано, тому на транку доступно до 4094 VLAN.</text><text x="500" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a83232" text-anchor="middle" font-weight="bold" xml:space="preserve">Кадри нативної VLAN транк передає без тега, як на верхньому рядку.</text></svg>