<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460"><rect width="980" height="460" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">TLB — маленький кеш перекладів, без якого сторінки були б удвічі повільніші</text><rect x="30" y="130" width="140" height="80" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="100.0" y="164.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Логічна</text><text x="100.0" y="183.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">адреса</text><line x1="174" y1="170" x2="207.0" y2="170.0" stroke="#999999" stroke-width="2"/><path d="M216.0 170.0 L207.0 175.0 L207.0 165.0 Z" fill="#999999"/><rect x="220" y="96" width="220" height="148" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><rect x="220" y="96" width="220" height="32" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><rect x="220" y="120" width="220" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="330" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">TLB — 64–1024 записи</text><rect x="232" y="136" width="196" height="28" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="278" y="155" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінка 2</text><line x1="320" y1="150" x2="335.0" y2="150.0" stroke="#cccccc" stroke-width="1.3"/><path d="M344.0 150.0 L335.0 155.0 L335.0 145.0 Z" fill="#cccccc"/><text x="388" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 7</text><rect x="232" y="168" width="196" height="28" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="278" y="187" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінка 0</text><line x1="320" y1="182" x2="335.0" y2="182.0" stroke="#cccccc" stroke-width="1.3"/><path d="M344.0 182.0 L335.0 187.0 L335.0 177.0 Z" fill="#cccccc"/><text x="388" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 5</text><rect x="232" y="200" width="196" height="28" rx="3" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="278" y="219" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінка 9</text><line x1="320" y1="214" x2="335.0" y2="214.0" stroke="#cccccc" stroke-width="1.3"/><path d="M344.0 214.0 L335.0 219.0 L335.0 209.0 Z" fill="#cccccc"/><text x="388" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 1</text><text x="330" y="258" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">порівнює всі записи одночасно</text><line x1="446" y1="140" x2="531.2" y2="120.1" stroke="#2f6b40" stroke-width="2.2"/><path d="M540.0 118.0 L532.4 124.9 L530.1 115.2 Z" fill="#2f6b40"/><rect x="546" y="88" width="404" height="66" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><text x="566" y="112" text-anchor="start" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВЛУЧАННЯ — 98–99 % звернень</text><text x="566" y="134" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм відомий одразу; до пам'яті — одне звернення</text><line x1="446" y1="200" x2="531.6" y2="232.8" stroke="#96302f" stroke-width="2.2"/><path d="M540.0 236.0 L529.8 237.5 L533.4 228.1 Z" fill="#96302f"/><rect x="546" y="174" width="404" height="116" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><text x="566" y="198" text-anchor="start" font-size="13" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРОМАХ — 1–2 % звернень</text><text x="566" y="220" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">доводиться йти в пам'ять по рядок таблиці сторінок,</text><text x="566" y="240" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">а вже потім — по дані. Два звернення замість одного.</text><text x="566" y="264" text-anchor="start" font-size="11.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Переклад одразу кладуть у TLB — далі влучимо.</text><rect x="30" y="306" width="920" height="138" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="332" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Порахуймо, скільки це коштує:</text><text x="52" y="356" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Без TLB кожне звернення до пам'яті перетворюється на два — спершу по рядок таблиці, потім по дані. Тобто програма</text><text x="52" y="376" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сповільнюється рівно вдвічі, і це не приблизно, а точно.</text><text x="52" y="402" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">З TLB при 99 % влучань середня кількість звернень: 0,99 × 1 + 0,01 × 2 = 1,01.</text><text x="52" y="426" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сповільнення — один відсоток замість ста. Уся сторінкова організація тримається на цьому кеші.</text></svg>