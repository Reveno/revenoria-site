"240" text-anchor="middle" font-size="12" font-weight="bold" fill="#bbbbbb" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><rect x="332" y="220" width="30" height="30" rx="2" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="347" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="366" y="220" width="30" height="30" rx="2" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="381" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="400" y="220" width="30" height="30" rx="2" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="415" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="434" y="220" width="30" height="30" rx="2" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="449" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="265" y="282" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">один біт на блок:  1 — зайнято,  0 — вільно</text><text x="265" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">знайти вільний = знайти нуль</text><rect x="520" y="62" width="430" height="122" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="540" y="88" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Скільки коштує сама карта</text><text x="540" y="112" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Диск 1 ТБ, блок 4 КБ  →  2²⁸ блоків  →  2²⁸ бітів</text><text x="540" y="134" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">= 32 МБ на всю карту, тобто 0,003 % диска.</text><text x="540" y="160" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дешево — і саме тому так роблять усі.</text><rect x="520" y="198" width="430" height="122" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.4"/><text x="540" y="224" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Альтернатива: список вільних блоків</text><text x="540" y="248" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Вільні блоки пов'язують у ланцюжок і зберігають</text><text x="540" y="268" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у них самих — місця не витрачається зовсім.</text><text x="540" y="294" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Але знайти суцільну ділянку з десяти блоків</text><text x="540" y="312" text-anchor="start" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">за таким списком практично неможливо.</text><rect x="30" y="340" width="920" height="78" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="52" y="366" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Бітова карта виграє саме тим, що дозволяє шукати не просто вільний блок, а вільні блоки поспіль: у ній це</text><text x="52" y="386" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">пошук нулів підряд, який процесор робить дуже швидко. А класти файл суцільним шматком вигідно навіть при</text><text x="52" y="408" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">індексному розміщенні — читати підряд завжди швидше, ніж стрибати диском.</text></svg>