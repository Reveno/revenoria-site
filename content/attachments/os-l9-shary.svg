<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500"><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Шари підсистеми введення-виведення: кожен наступний знає більше подробиць</text><rect x="60" y="74" width="860" height="44" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="80" y="96" text-anchor="start" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Прикладна програма</text><text x="80" y="113" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">думає про рядки, записи й документи; про пристрій не знає нічого</text><line x1="40" y1="96.0" x2="40.0" y2="119.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 128.0 L35.0 119.0 L45.0 119.0 Z" fill="#bbbbbb"/><line x1="940" y1="128" x2="940.0" y2="105.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 96.0 L945.0 105.0 L935.0 105.0 Z" fill="#bbbbbb"/><rect x="60" y="124" width="860" height="44" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="80" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Бібліотека мови (stdio)</text><text x="80" y="163" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">буферизує, форматує, перетворює printf на один великий write</text><line x1="40" y1="146.0" x2="40.0" y2="169.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 178.0 L35.0 169.0 L45.0 169.0 Z" fill="#bbbbbb"/><line x1="940" y1="178" x2="940.0" y2="155.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 146.0 L945.0 155.0 L935.0 155.0 Z" fill="#bbbbbb"/><rect x="60" y="174" width="860" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="80" y="196" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Системні виклики</text><text x="80" y="213" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">open, read, write, close — межа між простором користувача та ядром</text><line x1="40" y1="196.0" x2="40.0" y2="219.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 228.0 L35.0 219.0 L45.0 219.0 Z" fill="#bbbbbb"/><line x1="940" y1="228" x2="940.0" y2="205.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 196.0 L945.0 205.0 L935.0 205.0 Z" fill="#bbbbbb"/><rect x="60" y="224" width="860" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="80" y="246" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Незалежний від пристроїв рівень ядра</text><text x="80" y="263" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">імена, права, кеш сторінок, черги запитів, спільний для всіх пристроїв інтерфейс</text><line x1="40" y1="246.0" x2="40.0" y2="269.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 278.0 L35.0 269.0 L45.0 269.0 Z" fill="#bbbbbb"/><line x1="940" y1="278" x2="940.0" y2="255.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 246.0 L945.0 255.0 L935.0 255.0 Z" fill="#bbbbbb"/><rect x="60" y="274" width="860" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="80" y="296" text-anchor="start" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Драйвер пристрою</text><text x="80" y="313" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">єдиний, хто знає регістри саме цього контролера й його протокол</text><line x1="40" y1="296.0" x2="40.0" y2="319.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 328.0 L35.0 319.0 L45.0 319.0 Z" fill="#bbbbbb"/><line x1="940" y1="328" x2="940.0" y2="305.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 296.0 L945.0 305.0 L935.0 305.0 Z" fill="#bbbbbb"/><rect x="60" y="324" width="860" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="80" y="346" text-anchor="start" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обробник переривань</text><text x="80" y="363" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">прокидається, коли контролер відповів, і будить того, хто чекав</text><line x1="40" y1="346.0" x2="40.0" y2="369.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M40.0 378.0 L35.0 369.0 L45.0 369.0 Z" fill="#bbbbbb"/><line x1="940" y1="378" x2="940.0" y2="355.0" stroke="#bbbbbb" stroke-width="1.6"/><path d="M940.0 346.0 L945.0 355.0 L935.0 355.0 Z" fill="#bbbbbb"/><rect x="60" y="374" width="860" height="44" rx="4" fill="#f2f4f7" stroke="#555555" stroke-width="1.5"/><text x="80" y="396" text-anchor="start" font-size="13" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Апаратура</text><text x="80" y="413" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">контролер і сам пристрій</text><text x="30" y="66" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запит</text><text x="950" y="66" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дані</text><rect x="60" y="438" width="860" height="50" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="490.0" y="460" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сенс поділу той самий, що й скрізь у цьому курсі: чим вище шар, тим менше подробиць він знає —</text><text x="490.0" y="480" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і тим більшу різноманітність пристроїв обслуговує однаково.</text></svg>