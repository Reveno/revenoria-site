<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 345' width='900' height='345'><rect width='900' height='345' fill='#ffffff'/><text x='450' y='28' font-size='17' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Канали 2,4 ГГц: лише 1, 6 і 11 не перекриваються (ширина 20 МГц)</text><line x1='60' y1='250' x2='840' y2='250' stroke='#111' stroke-width='2' stroke-linecap='round'/><path d='M74.62499999999999,250 Q181.875,100 289.125,250' fill='#1565c0' fill-opacity='0.15' stroke='#1565c0' stroke-width='2'/><text x='181.875' y='270' font-size='13' text-anchor='middle' fill='#1565c0' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>1</text><path d='M123.37499999999999,250 Q230.625,180 337.875,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='230.625' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>2</text><path d='M172.125,250 Q279.375,180 386.625,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='279.375' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>3</text><path d='M220.875,250 Q328.125,180 435.375,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='328.125' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>4</text><path d='M269.625,250 Q376.875,180 484.125,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='376.875' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>5</text><path d='M318.375,250 Q425.625,100 532.875,250' fill='#2e7d32' fill-opacity='0.15' stroke='#2e7d32' stroke-width='2'/><text x='425.625' y='270' font-size='13' text-anchor='middle' fill='#2e7d32' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>6</text><path d='M367.125,250 Q474.375,180 581.625,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='474.375' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>7</text><path d='M415.875,250 Q523.125,180 630.375,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='523.125' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>8</text><path d='M464.625,250 Q571.875,180 679.125,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='571.875' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>9</text><path d='M513.375,250 Q620.625,180 727.875,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='620.625' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>10</text><path d='M562.125,250 Q669.375,100 776.625,250' fill='#c62828' fill-opacity='0.15' stroke='#c62828' stroke-width='2'/><text x='669.375' y='270' font-size='13' text-anchor='middle' fill='#c62828' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>11</text><path d='M610.875,250 Q718.125,180 825.375,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='718.125' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>12</text><path d='M659.625,250 Q766.875,180 874.125,250' fill='#bbb' fill-opacity='0.0' stroke='#bbb' stroke-width='2'/><text x='766.875' y='270' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>13</text><text x='450' y='305' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Канали 1, 6 і 11 розташовані так, що їхні смуги не накладаються: сусідні точки доступу розносять саме за ними.</text><text x='450' y='325' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Канали 2-5 чи 7-10 перекриваються із сусідніми й створюють завади, тому в планах їх не використовують.</text></svg>