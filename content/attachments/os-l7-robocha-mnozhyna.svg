<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 450" width="980" height="450"><rect width="980" height="450" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Робоча множина: скільки сторінок процесові потрібно просто зараз</text><text x="490.0" y="56" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вікно Δ = 10 останніх звернень; робоча множина — набір різних сторінок усередині вікна</text><rect x="40" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="57.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><rect x="77" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="94.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6</text><rect x="114" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="131.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="151" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="168.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><rect x="188" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="205.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="225" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="242.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="262" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="279.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="299" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="316.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="336" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="353.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><rect x="373" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="390.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><rect x="410" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="427.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6</text><rect x="447" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="464.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><rect x="484" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="501.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="521" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="538.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="558" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="575.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="595" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="612.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="632" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="649.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="669" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="686.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="706" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="723.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="743" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="760.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><rect x="780" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="797.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="817" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="834.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="854" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="871.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="891" y="100" width="34" height="34" rx="0" fill="#ffffff" stroke="#d5d5d5" stroke-width="1"/><text x="908.0" y="123" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><line x1="40" y1="152" x2="915.0" y2="152.0" stroke="#999999" stroke-width="1.5"/><path d="M924.0 152.0 L915.0 157.0 L915.0 147.0 Z" fill="#999999"/><text x="924" y="170" text-anchor="end" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">час</text><rect x="110" y="92" width="375" height="50" rx="4" fill="none" stroke="#204a80" stroke-width="2"/><text x="297.5" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вікно в момент t₁</text><rect x="110" y="196" width="375" height="58" rx="5" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="297.5" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">робоча множина: {1, 2, 5, 6, 7}</text><text x="297.5" y="240" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір: 5 сторінок</text><rect x="554" y="92" width="375" height="50" rx="4" fill="none" stroke="#2f6b40" stroke-width="2"/><text x="741.5" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вікно в момент t₂</text><rect x="554" y="196" width="375" height="58" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="741.5" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">робоча множина: {3, 4}</text><text x="741.5" y="240" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір: 2 сторінок</text><rect x="30" y="278" width="920" height="66" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="302" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Між t₁ і t₂ процес перейшов з однієї локальності в іншу: закінчив працювати з одним набором даних і взявся</text><text x="52" y="322" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">за інший. Робоча множина стрибнула з п'яти сторінок до двох — і саме за цим стрибком система й стежить.</text><text x="52" y="340" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"></text><rect x="30" y="356" width="920" height="78" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="52" y="382" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Правило, на якому все тримається: якщо процесові дати щонайменше стільки фреймів, скільки в його робочій множині,</text><text x="52" y="402" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">промахи будуть рідкісні — лише на переходах між локальностями. Якщо дати менше, він почне промахуватися безперервно.</text><text x="52" y="424" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Звідси й політика: сума робочих множин усіх процесів не має перевищувати кількості фреймів у системі.</text></svg>