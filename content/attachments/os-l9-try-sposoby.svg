<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500"><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три способи дочекатися пристрою — і скільки процесора вони з'їдають</text><rect x="20" y="60" width="300" height="356" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="60" width="300" height="46" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="98" width="300" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="170.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Опитування</text><text x="170.0" y="100" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">polling</text><text x="170.0" y="132" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор у циклі перечитує</text><text x="170.0" y="150" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">регістр стану, доки там</text><text x="170.0" y="168" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не з'явиться «готовий».</text><text x="170.0" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">завантаження процесора</text><rect x="46" y="214" width="248" height="22" rx="3" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/><rect x="46" y="214" width="248.0" height="22" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.3"/><text x="170.0" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">100 % — увесь час чекання</text><rect x="40" y="262" width="260" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="52" y="280" text-anchor="start" font-size="10" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Просто, без жодної</text><text x="52" y="296" text-anchor="start" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    апаратної підтримки.</text><rect x="40" y="312" width="260" height="60" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="52" y="330" text-anchor="start" font-size="10" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Квант згорає намарно.</text><text x="52" y="346" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    Для диска це мільйони</text><text x="52" y="362" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    марних перевірок.</text><line x1="40" y1="382" x2="300" y2="382" stroke="#e0e0e0" stroke-width="1"/><text x="170.0" y="400" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Доречно лише там, де відповідь</text><text x="170.0" y="414" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">приходить за наносекунди.</text><rect x="340" y="60" width="300" height="356" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="60" width="300" height="46" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="98" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="490.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Переривання</text><text x="490.0" y="100" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">interrupt</text><text x="490.0" y="132" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор дає команду й іде</text><text x="490.0" y="150" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">робити інше. Контролер сам</text><text x="490.0" y="168" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">смикне його, коли буде готовий.</text><text x="490.0" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">завантаження процесора</text><rect x="366" y="214" width="248" height="22" rx="3" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/><rect x="366" y="214" width="44.6" height="22" rx="3" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.3"/><text x="490.0" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">мало — тільки на обробник</text><rect x="360" y="262" width="260" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="372" y="280" text-anchor="start" font-size="10" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Процесор не простоює,</text><text x="372" y="296" text-anchor="start" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    черга готових не порожня.</text><rect x="360" y="312" width="260" height="60" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="372" y="330" text-anchor="start" font-size="10" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Кожен байт коштує</text><text x="372" y="346" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    одного переривання —</text><text x="372" y="362" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    для швидких пристроїв забагато.</text><line x1="360" y1="382" x2="620" y2="382" stroke="#e0e0e0" stroke-width="1"/><text x="490.0" y="400" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Основний спосіб для</text><text x="490.0" y="414" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">більшості пристроїв.</text><rect x="660" y="60" width="300" height="356" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="60" width="300" height="46" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="98" width="300" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="810.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Прямий доступ</text><text x="810.0" y="100" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">DMA</text><text x="810.0" y="132" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Окремий контролер сам</text><text x="810.0" y="150" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переносить блок між пристроєм</text><text x="810.0" y="168" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і пам'яттю, без процесора.</text><text x="810.0" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">завантаження процесора</text><rect x="686" y="214" width="248" height="22" rx="3" fill="#f5f5f5" stroke="#dddddd" stroke-width="1"/><rect x="686" y="214" width="9.9" height="22" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="810.0" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">майже нуль — одне переривання на весь блок</text><rect x="680" y="262" width="260" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="692" y="280" text-anchor="start" font-size="10" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+  Мегабайти переносяться</text><text x="692" y="296" text-anchor="start" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    без участі процесора.</text><rect x="680" y="312" width="260" height="60" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="692" y="330" text-anchor="start" font-size="10" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">−  Потрібен окремий вузол;</text><text x="692" y="346" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    кеш процесора може</text><text x="692" y="362" text-anchor="start" font-size="10" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">    розійтися з пам'яттю.</text><line x1="680" y1="382" x2="940" y2="382" stroke="#e0e0e0" stroke-width="1"/><text x="810.0" y="400" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Стандарт для диска, мережі, відео —</text><text x="810.0" y="414" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">усього, де багато даних.</text><rect x="20" y="430" width="940" height="56" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="42" y="454" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три способи не заміняють один одного, а співіснують: клавіатуру обслуговують перериваннями, диск — прямим доступом,</text><text x="42" y="476" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">а всередині обробника переривання драйвер може кілька разів опитати регістр стану, бо там чекати треба наносекунди.</text></svg>