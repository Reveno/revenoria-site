erif" font-size="11" fill="#a83232" text-anchor="middle" font-weight="normal">sem_wait() ЧЕКАЄ</text><line x1="750" y1="210" x2="750" y2="150" stroke="#a83232" stroke-width="1.4" stroke-dasharray="4,3"/><text x="450" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Коли потік 1 викличе sem_post() і поверне зʼєднання, лічильник стане 1,</text><text x="450" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">і один із потоків 4 чи 5 (хто прокинеться першим) отримає доступ.</text></svg>