<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510"><rect width="980" height="510" fill="#ffffff"/><text x="490.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Критична секція: вхідний протокол, критична секція, вихідний протокол</text><text x="165.0" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік А</text><rect x="40" y="72" width="250" height="46" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/><text x="165.0" y="90.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">решта коду</text><text x="165.0" y="107.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(спільних даних не торкається)</text><rect x="40" y="132" width="250" height="50" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="165.0" y="152.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВХІДНИЙ ПРОТОКОЛ</text><text x="165.0" y="169.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запит на вхід — lock()</text><rect x="40" y="196" width="250" height="84" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><text x="165.0" y="225.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">КРИТИЧНА СЕКЦІЯ</text><text x="165.0" y="242.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">читання й запис</text><text x="165.0" y="259.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">спільних даних</text><rect x="40" y="294" width="250" height="50" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="165.0" y="314.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВИХІДНИЙ ПРОТОКОЛ</text><text x="165.0" y="331.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звільнення — unlock()</text><text x="815.0" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><rect x="690" y="72" width="250" height="46" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1"/><text x="815.0" y="90.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">решта коду</text><text x="815.0" y="107.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(спільних даних не торкається)</text><rect x="690" y="132" width="250" height="50" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="815.0" y="152.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВХІДНИЙ ПРОТОКОЛ</text><text x="815.0" y="169.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запит на вхід — lock()</text><rect x="690" y="196" width="250" height="84" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><text x="815.0" y="225.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">КРИТИЧНА СЕКЦІЯ</text><text x="815.0" y="242.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">читання й запис</text><text x="815.0" y="259.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">спільних даних</text><rect x="690" y="294" width="250" height="50" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="815.0" y="314.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ВИХІДНИЙ ПРОТОКОЛ</text><text x="815.0" y="331.7" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звільнення — unlock()</text><rect x="370" y="196" width="240" height="84" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><text x="490.0" y="233.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Спільні дані</text><text x="490.0" y="251.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">counter, буфер, файл</text><line x1="298" y1="238" x2="353.0" y2="238.0" stroke="#96302f" stroke-width="2.2"/><path d="M362.0 238.0 L353.0 243.0 L353.0 233.0 Z" fill="#96302f"/><text x="330.0" y="228" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">працює</text><line x1="682" y1="238" x2="627.0" y2="238.0" stroke="#888888" stroke-width="2.2" stroke-dasharray="5 4"/><path d="M618.0 238.0 L627.0 233.0 L627.0 243.0 Z" fill="#888888"/><text x="650.0" y="228" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#888888" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">чекає</text><text x="490.0" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">одночасно всередині — рівно один потік</text><rect x="40" y="350" width="900" height="132" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="64" y="378" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чотири вимоги до будь-якого розв'язку задачі критичної секції:</text><text x="64" y="406" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1.  Взаємне виключення — усередині секції не більше одного потоку.</text><text x="64" y="428" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2.  Прогрес — якщо секція вільна, вибір наступного не можна відкладати нескінченно.</text><text x="64" y="450" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3.  Обмежене очікування — черга скінченна, ніхто не чекає вічно.</text><text x="64" y="472" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4.  Жодних припущень про швидкість процесорів і про кількість ядер.</text></svg>