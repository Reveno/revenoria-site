<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540"><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Зразок проєкту: три поверхи, сім комутаторів доступу, одне ядро</text><rect x="20" y="60" width="860" height="125" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/><text x="36" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#232120" text-anchor="start" font-weight="bold" xml:space="preserve">3 поверх</text><rect x="150" y="102" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="200" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 3.1</text><line x1="200" y1="102" x2="200" y2="90" stroke="#b9631b" stroke-width="2"/><line x1="200" y1="90" x2="620" y2="90" stroke="#b9631b" stroke-width="2"/><rect x="270" y="102" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="320" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 3.2</text><line x1="320" y1="102" x2="320" y2="90" stroke="#b9631b" stroke-width="2"/><line x1="320" y1="90" x2="620" y2="90" stroke="#b9631b" stroke-width="2"/><text x="150" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="start" font-weight="bold" xml:space="preserve">Найдальше робоче місце: 96 м</text><text x="150" y="177" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="start" font-weight="bold" xml:space="preserve">понад 90 м – шафу переносимо до центру поверху</text><rect x="20" y="200" width="860" height="125" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/><text x="36" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#232120" text-anchor="start" font-weight="bold" xml:space="preserve">2 поверх</text><rect x="150" y="242" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="200" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2.1</text><line x1="200" y1="242" x2="200" y2="230" stroke="#b9631b" stroke-width="2"/><line x1="200" y1="230" x2="620" y2="230" stroke="#b9631b" stroke-width="2"/><rect x="270" y="242" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="320" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2.2</text><line x1="320" y1="242" x2="320" y2="230" stroke="#b9631b" stroke-width="2"/><line x1="320" y1="230" x2="620" y2="230" stroke="#b9631b" stroke-width="2"/><rect x="390" y="242" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="440" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2.3</text><line x1="440" y1="242" x2="440" y2="230" stroke="#b9631b" stroke-width="2"/><line x1="440" y1="230" x2="620" y2="230" stroke="#b9631b" stroke-width="2"/><text x="150" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">Найдальше робоче місце: 78 м</text><text x="150" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">у межах 90 м</text><rect x="20" y="340" width="860" height="125" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="8" stroke-dasharray="6 4"/><text x="36" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#232120" text-anchor="start" font-weight="bold" xml:space="preserve">1 поверх</text><rect x="150" y="382" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="200" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 1.1</text><line x1="200" y1="382" x2="200" y2="370" stroke="#b9631b" stroke-width="2"/><line x1="200" y1="370" x2="620" y2="370" stroke="#b9631b" stroke-width="2"/><rect x="270" y="382" width="100" height="38" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="320" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 1.2</text><line x1="320" y1="382" x2="320" y2="370" stroke="#b9631b" stroke-width="2"/><line x1="320" y1="370" x2="620" y2="370" stroke="#b9631b" stroke-width="2"/><text x="150" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">Найдальше робоче місце: 62 м</text><text x="150" y="457" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">у межах 90 м</text><line x1="620" y1="90" x2="620" y2="410" stroke="#7a4f9a" stroke-width="4"/><text x="634" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#7a4f9a" text-anchor="start" font-weight="bold" xml:space="preserve">вертикальний стояк:</text><text x="634" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="start" font-weight="normal" xml:space="preserve">кожен комутатор має основну</text><text x="634" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="start" font-weight="normal" xml:space="preserve">й резервну лінію 10 Гбіт/с</text><line x1="620" y1="410" x2="660" y2="410" stroke="#7a4f9a" stroke-width="4"/><rect x="660" y="380" width="110" height="60" fill="#dbe6f4" stroke="#204a80" stroke-width="2.5" rx="8"/><text x="715" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Ядро</text><text x="715" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="normal" xml:space="preserve">48 портів</text><line x1="770" y1="410" x2="790" y2="410" stroke="#6b6763" stroke-width="2"/><rect x="790" y="380" width="80" height="60" fill="#ffffff" stroke="#a83232" stroke-width="2" rx="8"/><text x="830" y="406" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a83232" text-anchor="middle" font-weight="bold" xml:space="preserve">Сервери</text><text x="830" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="middle" font-weight="normal" xml:space="preserve">× 8</text><text x="450" y="525" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">Кожен комутатор доступу має 24 порти; потрібно портів із запасом 30%: 42, 62 і 30 на поверхах</text></svg>