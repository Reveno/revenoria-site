<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 474" width="1000" height="474"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="32" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#232120" text-anchor="middle" font-weight="bold">Кабельний тестер: правильний кабель проти типових несправностей</text><text x="60" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold">Справний кабель – лампи 1-8 загоряються по черзі, синхронно на обох блоках тестера</text><circle cx="90" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="90" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="138" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="138" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="186" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="186" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="234" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="234" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle cx="282" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="282" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="330" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="330" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><circle cx="378" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="378" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><circle cx="426" cy="104" r="15" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2"/><text x="426" y="109" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><text x="500" y="138" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Приймач повторює точно ту саму послідовність, що подає передавач.</text><text x="60" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold">Розрив (обрив)</text><circle cx="90" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="90" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="138" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="138" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="186" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="186" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="234" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="234" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle cx="282" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="282" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="330" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="330" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><circle cx="378" cy="200" r="15" fill="#a83232" stroke="#a83232" stroke-width="2"/><text x="378" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><circle cx="426" cy="200" r="15" fill="#f5f4f2" stroke="#b0aca8" stroke-width="2"/><text x="426" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold">8</text><text x="500" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Жила 8 не контактує в роз'ємі – лампа 8 не загоряється зовсім.</text><text x="60" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold">Коротке замикання пари</text><circle cx="90" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="90" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="138" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="138" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">2</text><circle cx="186" cy="296" r="15" fill="#f5f4f2" stroke="#b0aca8" stroke-width="2"/><text x="186" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold">3</text><circle cx="234" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="234" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">4</text><circle cx="282" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="282" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="330" cy="296" r="15" fill="#f5f4f2" stroke="#b0aca8" stroke-width="2"/><text x="330" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold">6</text><circle cx="378" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="378" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><circle cx="426" cy="296" r="15" fill="#b9631b" stroke="#b9631b" stroke-width="2"/><text x="426" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><text x="500" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Жили 3 і 6 торкаються одна одної – їхні лампи загоряються одночасно, а не по черзі.</text><text x="60" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="bold">Переплутана пара (split pair)</text><circle cx="90" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="90" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">1</text><circle cx="138" cy="392" r="15" fill="#f5f4f2" stroke="#b0aca8" stroke-width="2"/><text x="138" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold">2</text><circle cx="186" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="186" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text><circle cx="234" cy="392" r="15" fill="#f5f4f2" stroke="#b0aca8" stroke-width="2"/><text x="234" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="bold">4</text><circle cx="282" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="282" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><circle cx="330" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="330" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text><circle cx="378" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="378" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">7</text><circle cx="426" cy="392" r="15" fill="#7a4f9a" stroke="#7a4f9a" stroke-width="2"/><text x="426" y="397" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text><text x="500" y="426" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Жили 2 і 4 підключені не на свої контакти – лампи 2 і 4 світяться не у своєму порядку.</text></svg>