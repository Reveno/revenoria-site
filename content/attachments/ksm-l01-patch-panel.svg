<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#232120" text-anchor="middle" font-weight="bold">Телекомунікаційна шафа: від розетки робочого місця до порту комутатора</text><rect x="50" y="100" width="150" height="60" fill="#f7f5f3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="125" y="125" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="bold">Робоче місце</text><text x="125" y="145" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="middle" font-weight="normal">розетка RJ-45</text><text x="375" y="92" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="normal">горизонтальний кабель, ≤ 100 м</text><line x1="200" y1="130" x2="550" y2="130" stroke="#2e7d4f" stroke-width="2"/><rect x="550" y="100" width="280" height="60" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="6"/><text x="690" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#204a80" text-anchor="middle" font-weight="bold">Патч-панель – тил</text><text x="690" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6b6763" text-anchor="middle" font-weight="normal">постійна термінація (punch-down)</text><rect x="550" y="185" width="280" height="55" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="6"/><text x="690" y="208" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold">Патч-панель – лицьова сторона</text><rect x="570" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="602" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="634" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="666" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="698" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="730" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="762" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><rect x="794" y="220" width="22" height="14" fill="#ffffff" stroke="#204a80" stroke-width="1" rx="2"/><line x1="690" y1="160" x2="690" y2="185" stroke="#b0aca8" stroke-width="1.2"/><line x1="690" y1="240" x2="690" y2="275" stroke="#b9631b" stroke-width="2.5"/><text x="760" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#b9631b" text-anchor="start" font-weight="normal">патч-корд</text><text x="760" y="269" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#b9631b" text-anchor="start" font-weight="normal">(легко переставити)</text><rect x="550" y="275" width="280" height="60" fill="#dcefe3" stroke="#2e7d4f" stroke-width="2" rx="6"/><text x="690" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Комутатор поверху</text><rect x="570" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="602" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="634" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="666" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="698" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="730" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="762" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><rect x="794" y="310" width="22" height="14" fill="#ffffff" stroke="#2e7d4f" stroke-width="1" rx="2"/><line x1="830" y1="305" x2="900" y2="305" stroke="#6b6763" stroke-width="2"/><rect x="900" y="275" width="170" height="60" fill="#f0e6f4" stroke="#7a4f9a" stroke-width="2" rx="6"/><text x="985" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#7a4f9a" text-anchor="middle" font-weight="bold">До апаратної</text><text x="985" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6b6763" text-anchor="middle" font-weight="normal">магістраль (оптика)</text><text x="560" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Порваний чи неправильно обтиснутий кабель шукають саме тут: спершу перевіряють патч-корд тестером,</text><text x="560" y="393" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">і лише якщо він справний – переходять до перевірки постійного горизонтального кабелю за розеткою.</text></svg>