<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="28" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Три рішення для одного комутатора доступу: що переживе відмову</text><rect x="20" y="48" width="315" height="370" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="10"/><text x="177" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">1. Одна лінія вгору</text><rect x="142.0" y="113.0" width="70" height="24" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="5"/><text x="177" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Ядро</text><rect x="77.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="107" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 1</text><rect x="217.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="247" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2</text><line x1="147" y1="137" x2="107" y2="238" stroke="#2e7d4f" stroke-width="2.5"/><line x1="207" y1="137" x2="247" y2="238" stroke="#a83232" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="218" y1="179" x2="236" y2="197" stroke="#a83232" stroke-width="3.5"/><line x1="218" y1="197" x2="236" y2="179" stroke="#a83232" stroke-width="3.5"/><rect x="187" y="280" width="120" height="36" fill="#f6dede" stroke="#a83232" stroke-width="1.5" rx="6"/><text x="247" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#a83232" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2 без зв'язку</text><text x="177" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">Обрив однієї лінії відрізає</text><text x="177" y="363" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">весь комутатор і його користувачів</text><text x="177" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#a83232" text-anchor="middle" font-weight="bold" xml:space="preserve">Дешево, але без запасу</text><rect x="342" y="48" width="315" height="370" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="10"/><text x="499" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">2. Дві лінії вгору</text><rect x="464.0" y="113.0" width="70" height="24" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="5"/><text x="499" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Ядро</text><rect x="399.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="429" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 1</text><rect x="539.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="569" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2</text><line x1="469" y1="137" x2="429" y2="238" stroke="#2e7d4f" stroke-width="2.5"/><line x1="521" y1="137" x2="557" y2="238" stroke="#a83232" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="530" y1="179" x2="548" y2="197" stroke="#a83232" stroke-width="3.5"/><line x1="530" y1="197" x2="548" y2="179" stroke="#a83232" stroke-width="3.5"/><line x1="537" y1="137" x2="581" y2="238" stroke="#2e7d4f" stroke-width="2.5"/><rect x="509" y="280" width="120" height="36" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="1.5" rx="6"/><text x="569" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2 працює</text><text x="499" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">Друга лінія бере трафік на себе;</text><text x="499" y="363" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">STP тримає одну в запасі</text><text x="499" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">Переживає відмову лінії</text><rect x="664" y="48" width="315" height="370" fill="#ffffff" stroke="#6b6763" stroke-width="1.5" rx="10"/><text x="821" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">3. Два ядра</text><rect x="716.0" y="113.0" width="70" height="24" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="5"/><text x="751" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Ядро A</text><rect x="856.0" y="113.0" width="70" height="24" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="5"/><text x="891" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Ядро B</text><line x1="693" y1="115" x2="713" y2="135" stroke="#a83232" stroke-width="3.5"/><line x1="693" y1="135" x2="713" y2="115" stroke="#a83232" stroke-width="3.5"/><rect x="721.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="751" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 1</text><rect x="861.0" y="238.0" width="60" height="24" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="2" rx="5"/><text x="891" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">SW 2</text><line x1="751" y1="137" x2="751" y2="238" stroke="#a83232" stroke-width="2" stroke-dasharray="6 4"/><line x1="891" y1="137" x2="751" y2="238" stroke="#2e7d4f" stroke-width="2"/><line x1="751" y1="137" x2="891" y2="238" stroke="#a83232" stroke-width="2" stroke-dasharray="6 4"/><line x1="891" y1="137" x2="891" y2="238" stroke="#2e7d4f" stroke-width="2"/><rect x="761" y="280" width="120" height="36" fill="#e3f1e8" stroke="#2e7d4f" stroke-width="1.5" rx="6"/><text x="821" y="303" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">всі працюють</text><text x="821" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">Кожен комутатор підключений</text><text x="821" y="363" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal" xml:space="preserve">до обох ядер</text><text x="821" y="395" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold" xml:space="preserve">Переживає відмову ядра</text><text x="500" y="448" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">Червоний пунктир – відмовивший елемент; чим вище рівень резерву, тим більше портів і грошей</text></svg>