<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" width="900" height="395"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232120"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Стани TCP, які показує netstat</text><rect x="245" y="60" width="170" height="74" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="330.0" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">LISTENING</text><text x="330.0" y="104" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">порт відкрито,</text><text x="330.0" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">програма чекає клієнтів</text><line x1="330" y1="136" x2="330" y2="186" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><text x="345" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold">приходить SYN</text><rect x="25" y="190" width="170" height="80" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="110.0" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">SYN_SENT</text><text x="110.0" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">клієнт надіслав SYN</text><text x="110.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">і чекає відповіді</text><rect x="245" y="190" width="170" height="80" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="330.0" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">ESTABLISHED</text><text x="330.0" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">рукостискання є,</text><text x="330.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">йдуть дані</text><rect x="475" y="190" width="170" height="80" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="560.0" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold">TIME_WAIT</text><text x="560.0" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">з'єднання закрито,</text><text x="560.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">ОС ще пам'ятає його</text><rect x="705" y="190" width="170" height="80" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="790.0" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold">(запису немає)</text><text x="790.0" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">порт знову вільний,</text><text x="790.0" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">рядок зник з netstat</text><line x1="197" y1="230" x2="243" y2="230" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><line x1="417" y1="230" x2="473" y2="230" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><line x1="647" y1="230" x2="703" y2="230" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><text x="595" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">після обміну FIN</text><text x="450" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">LISTENING лишається у списку весь час: нове з'єднання не «забирає» порт у слухача</text><text x="450" y="372" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">У netstat кожне з'єднання окремий рядок, і в кожного свій PID власника</text></svg>