<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#232120"/></marker></defs><text x="500" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#232120" text-anchor="middle" font-weight="bold">Гонка даних і як мʼютекс її усуває: два потоки виконують total += 1</text><text x="500" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#a83232" text-anchor="middle" font-weight="bold">Без синхронізації – кроки переплітаються</text><rect x="170" y="75" width="270" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="90" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: read total (0)</text><rect x="470" y="101" width="270" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="480" y="116" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: read total (0)</text><rect x="170" y="127" width="270" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="142" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: total = 0+1 = 1</text><rect x="470" y="153" width="270" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="480" y="168" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: total = 0+1 = 1</text><rect x="170" y="179" width="270" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="194" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: write total = 1</text><rect x="470" y="205" width="270" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="480" y="220" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: write total = 1</text><text x="500" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a83232" text-anchor="middle" font-weight="bold">Результат: total = 1 замість очікуваних 2 – одне оновлення загублено</text><text x="500" y="286" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">З мʼютексом – друга спроба чекає, поки перша не завершить критичну секцію</text><rect x="170" y="293" width="570" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="308" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: lock() – захопив</text><rect x="170" y="317" width="570" height="22" fill="#f0efed" stroke="#b0aca8" stroke-width="1" rx="4"/><text x="180" y="332" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">t2: lock() – ЧЕКАЄ</text><rect x="170" y="341" width="570" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="356" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: read total (0)</text><rect x="170" y="365" width="570" height="22" fill="#f0efed" stroke="#b0aca8" stroke-width="1" rx="4"/><text x="180" y="380" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">t2: …чекає…</text><rect x="170" y="389" width="570" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="404" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: total = 0+1 = 1</text><rect x="170" y="413" width="570" height="22" fill="#f0efed" stroke="#b0aca8" stroke-width="1" rx="4"/><text x="180" y="428" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">t2: …чекає…</text><rect x="170" y="437" width="570" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="452" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: write total = 1</text><rect x="170" y="461" width="570" height="22" fill="#f0efed" stroke="#b0aca8" stroke-width="1" rx="4"/><text x="180" y="476" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">t2: …чекає…</text><rect x="170" y="485" width="570" height="22" fill="#dbe6f4" stroke="#204a80" stroke-width="1" rx="4"/><text x="180" y="500" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="start" font-weight="normal">t1: unlock()</text><rect x="170" y="509" width="570" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="180" y="524" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: lock() – захопив</text><rect x="170" y="533" width="570" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="180" y="548" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: read total (1)</text><rect x="170" y="557" width="570" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="180" y="572" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: total = 1+1 = 2</text><rect x="170" y="581" width="570" height="22" fill="#fbe9d7" stroke="#b9631b" stroke-width="1" rx="4"/><text x="180" y="596" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="start" font-weight="normal">t2: write total = 2 ; unlock()</text><text x="500" y="630" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Результат: total = 2 – обидва оновлення враховано, жодне не загублено</text></svg>