<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500"><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Трирівнева ієрархічна модель: доступ, розподіл, ядро</text><rect x="20" y="55" width="860" height="115" fill="#ffffff" stroke="#204a80" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="40" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#204a80" text-anchor="start" font-weight="bold" xml:space="preserve">Ядро</text><rect x="20" y="190" width="860" height="115" fill="#ffffff" stroke="#2e7d4f" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="40" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">Розподіл</text><rect x="20" y="325" width="860" height="115" fill="#ffffff" stroke="#b9631b" stroke-width="1.5" rx="10" stroke-dasharray="6 4"/><text x="40" y="350" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#b9631b" text-anchor="start" font-weight="bold" xml:space="preserve">Доступ</text><line x1="350" y1="213" x2="450" y2="122" stroke="#2e7d4f" stroke-width="2"/><line x1="650" y1="213" x2="450" y2="122" stroke="#2e7d4f" stroke-width="2"/><line x1="270" y1="348" x2="350" y2="257" stroke="#b9631b" stroke-width="2"/><line x1="430" y1="348" x2="350" y2="257" stroke="#b9631b" stroke-width="2"/><line x1="570" y1="348" x2="650" y2="257" stroke="#b9631b" stroke-width="2"/><line x1="730" y1="348" x2="650" y2="257" stroke="#b9631b" stroke-width="2"/><rect x="380" y="78" width="140" height="44" fill="#dbe6f4" stroke="#204a80" stroke-width="2" rx="8"/><text x="450" y="105" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold" xml:space="preserve">Комутатор ядра</text><rect x="280"