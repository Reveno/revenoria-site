4" height="44" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="570" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">Доступ 3</text><line x1="570" y1="392" x2="570" y2="408" stroke="#6b6763" stroke-width="1.5"/><text x="570" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">ПК, точки доступу,</text><text x="570" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">принтери</text><rect x="668" y="348" width="124" height="44" fill="#fbeadb" stroke="#b9631b" stroke-width="2" rx="8"/><text x="730" y="375" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold" xml:space="preserve">Доступ 4</text><line x1="730" y1="392" x2="730" y2="408" stroke="#6b6763" stroke-width="1.5"/><text x="730" y="422" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">ПК, точки доступу,</text><text x="730" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">принтери</text><text x="870" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="end" font-weight="normal" xml:space="preserve">швидкий транзит і</text><text x="870" y="97" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="end" font-weight="normal" xml:space="preserve">вихід у зовнішні мережі</text><text x="870" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="end" font-weight="normal" xml:space="preserve">об'єднує комутатори</text><text x="870" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="end" font-weight="normal" xml:space="preserve">поверхів чи корпусів</text><text x="385" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="end" font-weight="bold" xml:space="preserve">перепідписка до 4:1</text><text x="300" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b9631b" text-anchor="end" font-weight="bold" xml:space="preserve">перепідписка до 20:1</text><text x="450" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal" xml:space="preserve">Орієнтири перепідписки – класичні рекомендації Cisco; у малій будівлі ядро й розподіл зазвичай поєднують в одному комутаторі</text></svg>