<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490"><rect width="980" height="490" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Підкачка на вимогу: у пам'яті лежить лише те, до чого вже зверталися</text><text x="115.0" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Простір процесу</text><rect x="40" y="88" width="150" height="36" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="115.0" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 0</text><rect x="40" y="130" width="150" height="36" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="115.0" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 1</text><rect x="40" y="172" width="150" height="36" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="115.0" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 2</text><rect x="40" y="214" width="150" height="36" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="115.0" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 3</text><rect x="40" y="256" width="150" height="36" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="115.0" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 4</text><rect x="40" y="298" width="150" height="36" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="115.0" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 5</text><text x="385.0" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиця сторінок</text><rect x="240" y="88" width="290" height="30" rx="0" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.3"/><text x="288" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінка</text><text x="386" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">біт присутності</text><text x="484" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">де лежить</text><rect x="240" y="118" width="290" height="36" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="143" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="386" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="484" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 1</text><rect x="240" y="154" width="290" height="36" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="386" y="179" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="484" y="179" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 5</text><rect x="240" y="190" width="290" height="36" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="386" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="484" y="215" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на диску</text><rect x="240" y="226" width="290" height="36" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="251" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="386" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="484" y="251" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 3</text><rect x="240" y="262" width="290" height="36" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="287" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><text x="386" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="484" y="287" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на диску</text><rect x="240" y="298" width="290" height="36" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/><text x="288" y="323" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><text x="386" y="323" text-anchor="middle" font-size="14" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="484" y="323" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на диску</text><text x="655.0" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фізична пам'ять</text><rect x="570" y="88" width="170" height="32" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="562" y="109" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф0</text><text x="655.0" y="109" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інше</text><rect x="570" y="122" width="170" height="32" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="562" y="143" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф1</text><text x="655.0" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стор. 0</text><rect x="570" y="156" width="170" height="32" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="562" y="177" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф2</text><text x="655.0" y="177" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інше</text><rect x="570" y="190" width="170" height="32" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="562" y="211" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф3</text><text x="655.0" y="211" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стор. 3</text><rect x="570" y="224" width="170" height="32" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="562" y="245" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф4</text><text x="655.0" y="245" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інше</text><rect x="570" y="258" width="170" height="32" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="562" y="279" text-anchor="end" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ф5</text><text x="655.0" y="279" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Стор. 1</text><text x="870.0" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Область підкачки</text><rect x="790" y="88" width="160" height="178" rx="5" fill="#fbecec" stroke="#96302f" stroke-width="1.5"/><rect x="804" y="108" width="132" height="38" rx="3" fill="#ffffff" stroke="#96302f" stroke-width="1.2"/><text x="870.0" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 2</text><rect x="804" y="158" width="132" height="38" rx="3" fill="#ffffff" stroke="#96302f" stroke-width="1.2"/><text x="870.0" y="182" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 4</text><rect x="804" y="208" width="132" height="38" rx="3" fill="#ffffff" stroke="#96302f" stroke-width="1.2"/><text x="870.0" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка 5</text><text x="870.0" y="290" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на диску, поки не знадобляться</text><rect x="30" y="356" width="920" height="106" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="52" y="382" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ключова зміна проти минулої лекції:</text><text x="52" y="406" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінку завантажують не при запуску програми, а при першому зверненні до неї. Тому програма починає працювати</text><text x="52" y="426" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тоді, коли в пам'яті лежить лише кілька її сторінок, а решта підтягується поступово — і тільки та, яка справді потрібна.</text><text x="52" y="450" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Звідси й наслідок: сумарний обсяг усіх процесів може набагато перевищувати обсяг фізичної пам'яті.</text></svg>