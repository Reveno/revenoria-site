<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дві фрагментації: одна ховається всередині, друга — між</text><rect x="30" y="62" width="456" height="300" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="30" y="62" width="456" height="38" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="30" y="92" width="456" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="258" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Внутрішня — розділи фіксовані</text><rect x="90" y="116" width="200" height="62" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.4"/><rect x="90" y="116" width="200" height="38.8" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><rect x="90" y="154.8" width="200" height="23.2" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="190" y="139.4" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес A — 5 МБ</text><text x="304" y="140" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розділ 8 МБ</text><text x="304" y="158" text-anchor="start" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">марно: 3 МБ</text><rect x="90" y="190" width="200" height="62" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.4"/><rect x="90" y="190" width="200" height="15.5" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><rect x="90" y="205.5" width="200" height="46.5" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="190" y="201.75" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес Б — 2 МБ</text><text x="304" y="214" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розділ 8 МБ</text><text x="304" y="232" text-anchor="start" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">марно: 6 МБ</text><rect x="90" y="264" width="200" height="62" rx="3" fill="#ffffff" stroke="#999999" stroke-width="1.4"/><rect x="90" y="264" width="200" height="54.2" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><rect x="90" y="318.2" width="200" height="7.8" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1"/><text x="190" y="295.1" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес В — 7 МБ</text><text x="304" y="288" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розділ 8 МБ</text><text x="304" y="306" text-anchor="start" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">марно: 1 МБ</text><text x="258" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Разом змарновано 10 МБ — і всі всередині чужих розділів</text><rect x="494" y="62" width="456" height="300" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="494" y="62" width="456" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="494" y="92" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="722" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Зовнішня — розділи змінні</text><rect x="594" y="116" width="200" height="34" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="694" y="137.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес A</text><rect x="594" y="150" width="200" height="22" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="694" y="165.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно 3 МБ</text><rect x="594" y="172" width="200" height="44" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="694" y="198.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес Б</text><rect x="594" y="216" width="200" height="16" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="694" y="228.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно 2 МБ</text><rect x="594" y="232" width="200" height="40" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="694" y="256.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес В</text><rect x="594" y="272" width="200" height="28" rx="0" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.3"/><text x="694" y="290.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільно 4 МБ</text><rect x="814" y="200" width="120" height="60" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="874" y="222" text-anchor="middle" font-size="11" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потрібно</text><text x="874" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8 МБ</text><line x1="810" y1="230" x2="809.0" y2="230.0" stroke="#96302f" stroke-width="2"/><path d="M800.0 230.0 L809.0 225.0 L809.0 235.0 Z" fill="#96302f"/><text x="722" y="340" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Вільно 9 МБ, а суцільного шматка на 8 МБ немає</text><rect x="30" y="380" width="920" height="76" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="406" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Внутрішня фрагментація лікується дрібнішими розділами, зовнішня — ущільненням: посунути всі процеси</text><text x="52" y="426" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">докупи й зібрати вільне місце в один шматок. Ущільнення працює, але коштує дорого: треба зупинити роботу</text><text x="52" y="446" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й перемістити мегабайти. Справжній розв'язок з'явиться далі — і він полягає в тому, щоб відмовитися від суцільності.</text></svg>