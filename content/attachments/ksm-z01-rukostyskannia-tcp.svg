<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Триетапне рукостискання TCP та закриття з'єднання</text><rect x="120" y="54" width="160" height="34" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="200" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">Клієнт (ваш ПК)</text><rect x="620" y="54" width="160" height="34" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="700" y="76" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Сервер, порт 80</text><line x1="200" y1="88" x2="200" y2="470" stroke="#b0aca8" stroke-width="2" stroke-dasharray="6 4"/><line x1="700" y1="88" x2="700" y2="470" stroke="#b0aca8" stroke-width="2" stroke-dasharray="6 4"/><line x1="204" y1="130" x2="692" y2="130" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="450" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">SYN</text><text x="450" y="150" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Seq=0</text><line x1="696" y1="190" x2="208" y2="190" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><text x="450" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">SYN, ACK</text><text x="450" y="210" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Seq=0  Ack=1</text><line x1="204" y1="250" x2="692" y2="250" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="450" y="234" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">ACK</text><text x="450" y="270" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Seq=1  Ack=1</text><line x1="204" y1="320" x2="692" y2="320" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="450" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">PSH, ACK</text><text x="450" y="340" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Seq=1  Ack=1  Len=75</text><line x1="696" y1="380" x2="208" y2="380" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><text x="450" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">FIN, ACK</text><text x="450" y="400" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">сервер закриває</text><line x1="204" y1="440" x2="692" y2="440" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="450" y="424" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">FIN, ACK</text><text x="450" y="460" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">клієнт закриває</text><text x="24" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#204a80" text-anchor="start" font-weight="bold">1</text><text x="24" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#2e7d4f" text-anchor="start" font-weight="bold">2</text><text x="24" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#204a80" text-anchor="start" font-weight="bold">3</text><text x="24" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#204a80" text-anchor="start" font-weight="bold">4</text><text x="24" y="380" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#2e7d4f" text-anchor="start" font-weight="bold">5</text><text x="24" y="440" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#204a80" text-anchor="start" font-weight="bold">6</text><text x="450" y="494" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Seq і Ack у Wireshark за замовчуванням показано відносними числами (від 0)</text></svg>