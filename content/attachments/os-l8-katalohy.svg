<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490"><rect width="980" height="490" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Як каталоги виросли з простого списку в дерево</text><rect x="20" y="60" width="300" height="306" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="60" width="300" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="90" width="300" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="170" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Плоский</text><text x="170" y="328" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Імена мусять бути унікальні</text><text x="170" y="345" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на весь диск. Два користувачі</text><text x="170" y="362" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не можуть мати «звіт.txt».</text><rect x="110" y="116" width="120" height="30" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="170.0" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">каталог</text><rect x="80" y="168" width="180" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="170.0" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><line x1="170" y1="146" x2="170" y2="168" stroke="#cccccc" stroke-width="1.2"/><rect x="80" y="206" width="180" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="170.0" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lab1.c</text><line x1="170" y1="146" x2="170" y2="206" stroke="#cccccc" stroke-width="1.2"/><rect x="80" y="244" width="180" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="170.0" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">notes.md</text><line x1="170" y1="146" x2="170" y2="244" stroke="#cccccc" stroke-width="1.2"/><rect x="80" y="282" width="180" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="170.0" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit2.txt</text><line x1="170" y1="146" x2="170" y2="282" stroke="#cccccc" stroke-width="1.2"/><rect x="340" y="60" width="300" height="306" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="60" width="300" height="38" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="90" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="490" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дворівневий</text><text x="490" y="328" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">У кожного користувача свій</text><text x="490" y="345" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">каталог. Колізій між людьми</text><text x="490" y="362" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">немає, всередині — знову є.</text><rect x="440" y="116" width="100" height="30" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><text x="490.0" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">корінь</text><rect x="370" y="176" width="110" height="30" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><text x="425.0" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">olena</text><line x1="490" y1="146" x2="425" y2="176" stroke="#cccccc" stroke-width="1.2"/><rect x="370" y="232" width="110" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="425.0" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><line x1="425" y1="206" x2="425" y2="232" stroke="#cccccc" stroke-width="1.2"/><rect x="370" y="270" width="110" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="425.0" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lab1.c</text><line x1="425" y1="206" x2="425" y2="270" stroke="#cccccc" stroke-width="1.2"/><rect x="510" y="176" width="110" height="30" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><text x="565.0" y="196" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">petro</text><line x1="490" y1="146" x2="565" y2="176" stroke="#cccccc" stroke-width="1.2"/><rect x="510" y="232" width="110" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="565.0" y="252" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><line x1="565" y1="206" x2="565" y2="232" stroke="#cccccc" stroke-width="1.2"/><rect x="510" y="270" width="110" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="565.0" y="290" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lab1.c</text><line x1="565" y1="206" x2="565" y2="270" stroke="#cccccc" stroke-width="1.2"/><rect x="660" y="60" width="300" height="306" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="60" width="300" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="660" y="90" width="300" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="810" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дерево</text><text x="810" y="328" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Каталог може містити каталоги</text><text x="810" y="345" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">без обмеження глибини.</text><text x="810" y="362" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Так влаштовані всі сучасні ФС.</text><rect x="770" y="116" width="80" height="30" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="810.0" y="136" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">/</text><rect x="684" y="172" width="72" height="30" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="720.0" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">home</text><line x1="810" y1="146" x2="720" y2="172" stroke="#cccccc" stroke-width="1.2"/><rect x="784" y="172" width="72" height="30" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="820.0" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">etc</text><line x1="810" y1="146" x2="820" y2="172" stroke="#cccccc" stroke-width="1.2"/><rect x="876" y="172" width="72" height="30" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="912.0" y="192" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">usr</text><line x1="810" y1="146" x2="912" y2="172" stroke="#cccccc" stroke-width="1.2"/><rect x="684" y="228" width="72" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="720.0" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">olena</text><line x1="720" y1="202" x2="720" y2="228" stroke="#cccccc" stroke-width="1.2"/><rect x="684" y="280" width="72" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="720.0" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">proj</text><line x1="720" y1="258" x2="720" y2="280" stroke="#cccccc" stroke-width="1.2"/><rect x="776" y="280" width="92" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="822.0" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><line x1="756" y1="295" x2="776" y2="295" stroke="#cccccc" stroke-width="1.2"/><rect x="876" y="228" width="72" height="30" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><text x="912.0" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">bin</text><line x1="912" y1="202" x2="912" y2="228" stroke="#cccccc" stroke-width="1.2"/><rect x="20" y="396" width="940" height="82" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="42" y="422" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Каталог — це не особлива сутність, а звичайний файл, вміст якого система вміє читати: список пар «ім'я — номер i-node».</text><text x="42" y="442" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тому каталог має власний i-node, власні права доступу й власний розмір — усе те саме, що й у будь-якого файлу.</text><text x="42" y="466" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Право «виконання» для каталогу означає не запуск, а дозвіл заходити всередину й розв'язувати шляхи крізь нього.</text></svg>