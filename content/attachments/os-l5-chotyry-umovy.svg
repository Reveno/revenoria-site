<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520"><rect width="980" height="520" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чотири умови Коффмана: глухий кут можливий лише коли є всі разом</text><rect x="30" y="66" width="456" height="176" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.4"/><rect x="30" y="66" width="456" height="34" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.4"/><rect x="30" y="92" width="456" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="48" y="89" text-anchor="start" font-size="14.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1.  Взаємне виключення</text><text x="48" y="128" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ресурс не можна розділити: у кожен момент</text><text x="48" y="148" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ним володіє рівно один процес.</text><rect x="48" y="182" width="420" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="60" y="209" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ламається: зробити ресурс спільним — спулер друку.</text><rect x="494" y="66" width="456" height="176" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.4"/><rect x="494" y="66" width="456" height="34" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.4"/><rect x="494" y="92" width="456" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="512" y="89" text-anchor="start" font-size="14.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2.  Утримання та очікування</text><text x="512" y="128" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес тримає один ресурс і водночас</text><text x="512" y="148" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">чекає на другий, не віддаючи першого.</text><rect x="512" y="182" width="420" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="524" y="209" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ламається: брати все одразу або не брати нічого.</text><rect x="30" y="256" width="456" height="176" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.4"/><rect x="30" y="256" width="456" height="34" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.4"/><rect x="30" y="282" width="456" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="48" y="279" text-anchor="start" font-size="14.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3.  Відсутність витіснення</text><text x="48" y="318" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Відібрати ресурс силою не можна —</text><text x="48" y="338" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тільки власник має право віддати.</text><rect x="48" y="372" width="420" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="60" y="399" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ламається: дозволити відкат і примусове відбирання.</text><rect x="494" y="256" width="456" height="176" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.4"/><rect x="494" y="256" width="456" height="34" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.4"/><rect x="494" y="282" width="456" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="512" y="279" text-anchor="start" font-size="14.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4.  Кільцеве очікування</text><text x="512" y="318" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ланцюг очікувань замикається в коло:</text><text x="512" y="338" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кожен чекає на наступного, останній — на першого.</text><rect x="512" y="372" width="420" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="524" y="399" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ламається: єдиний глобальний порядок захоплення.</text><rect x="30" y="452" width="920" height="46" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.3"/><text x="490.0" y="480" text-anchor="middle" font-size="13" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Достатньо усунути будь-яку одну з чотирьох — і глухий кут стає неможливим. На цьому стоять усі методи запобігання.</text></svg>