<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 283' width='820' height='283'><rect width='820' height='283' fill='#ffffff'/><rect x='0' y='0' width='820' height='283' rx='8' fill='#0c0c0c' stroke='#444' stroke-width='1'/><rect x='0' y='0' width='820' height='30' rx='8' fill='#2b2b2b' stroke='#444' stroke-width='1'/><circle cx='18' cy='15' r='6' fill='#ff5f56' stroke='#ff5f56' stroke-width='0'/><circle cx='38' cy='15' r='6' fill='#ffbd2e' stroke='#ffbd2e' stroke-width='0'/><circle cx='58' cy='15' r='6' fill='#27c93f' stroke='#27c93f' stroke-width='0'/><text x='410.0' y='20' font-size='12' text-anchor='middle' fill='#ddd' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>R1 - CLI</text><text x='14' y='52' font-size='13' fill='#7ee787' font-family='Consolas, Menlo, monospace' xml:space='preserve'>R1#show ip nat translations</text><text x='14' y='69' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Pro  Inside global      Inside local       Outside local      Outside global</text><text x='14' y='86' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>icmp 198.51.100.2:1     10.20.10.20:1      198.51.100.1:1     198.51.100.1:1</text><text x='14' y='103' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>tcp  198.51.100.2:1025  10.20.50.21:49200  198.51.100.1:80    198.51.100.1:80</text><text x='14' y='120' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'></text><text x='14' y='137' font-size='13' fill='#7ee787' font-family='Consolas, Menlo, monospace' xml:space='preserve'>R1#show access-lists STUDENTS-IN</text><text x='14' y='154' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Extended IP access list STUDENTS-IN</text><text x='14' y='171' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    10 permit udp 10.20.20.0 0.0.0.255 host 10.20.30.11 eq domain (6 match(es))</text><text x='14' y='188' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    20 permit tcp 10.20.20.0 0.0.0.255 host 10.20.30.10 eq www (14 match(es))</text><text x='14' y='205' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    30 permit tcp 10.20.20.0 0.0.0.255 host 10.20.30.10 eq 443</text><text x='14' y='222' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    40 permit udp any eq bootpc any eq bootps (8 match(es))</text><text x='14' y='239' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    50 deny ip 10.20.20.0 0.0.0.255 10.20.0.0 0.0.255.255 (5 match(es))</text><text x='14' y='256' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    60 permit ip 10.20.20.0 0.0.0.255 any (22 match(es))</text></svg>