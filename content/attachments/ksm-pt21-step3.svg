<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 249' width='820' height='249'><rect width='820' height='249' fill='#ffffff'/><rect x='0' y='0' width='820' height='249' rx='8' fill='#0c0c0c' stroke='#444' stroke-width='1'/><rect x='0' y='0' width='820' height='30' rx='8' fill='#2b2b2b' stroke='#444' stroke-width='1'/><circle cx='18' cy='15' r='6' fill='#ff5f56' stroke='#ff5f56' stroke-width='0'/><circle cx='38' cy='15' r='6' fill='#ffbd2e' stroke='#ffbd2e' stroke-width='0'/><circle cx='58' cy='15' r='6' fill='#27c93f' stroke='#27c93f' stroke-width='0'/><text x='410.0' y='20' font-size='12' text-anchor='middle' fill='#ddd' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>L3SW - CLI</text><text x='14' y='52' font-size='13' fill='#7ee787' font-family='Consolas, Menlo, monospace' xml:space='preserve'>L3SW#show ip route</text><text x='14' y='69' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Codes: C - connected, S - static, I - IGRP, R - RIP, M - mobile, B - BGP</text><text x='14' y='86' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Gateway of last resort is not set</text><text x='14' y='103' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'></text><text x='14' y='120' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>     10.0.0.0/24 is subnetted, 2 subnets</text><text x='14' y='137' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>C       10.10.10.0 is directly connected, Vlan10</text><text x='14' y='154' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>C       10.10.20.0 is directly connected, Vlan20</text><text x='14' y='171' font-size='13' fill='#7ee787' font-family='Consolas, Menlo, monospace' xml:space='preserve'>L3SW#show ip interface brief | include Vlan</text><text x='14' y='188' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Vlan1      unassigned      YES unset  administratively down down</text><text x='14' y='205' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Vlan10     10.10.10.1      YES manual up                    up</text><text x='14' y='222' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Vlan20     10.10.20.1      YES manual up                    up</text></svg>