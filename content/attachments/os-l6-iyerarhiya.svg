<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500"><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ієрархія пам'яті: сім порядків різниці між найшвидшим і найповільнішим</text><text x="190" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">рівень</text><text x="430" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">типовий обсяг</text><text x="620" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">час доступу</text><text x="830" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">якщо регістр — це 1 секунда</text><line x1="30" y1="80" x2="950" y2="80" stroke="#cfcfcf" stroke-width="1"/><rect x="140.0" y="92" width="100" height="36" rx="4" fill="#1b3a63" stroke="#1b3a63" stroke-width="1"/><text x="190" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Регістри</text><text x="430" y="116" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кілька сотень байтів</text><text x="620" y="116" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">менш ніж 1 нс</text><text x="830" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b3a63" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1 секунда</text><rect x="122.0" y="136" width="136" height="36" rx="4" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="190" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кеш L1</text><text x="430" y="160" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">32–64 КБ на ядро</text><text x="620" y="160" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 1 нс</text><text x="830" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1 секунда</text><rect x="104.0" y="180" width="172" height="36" rx="4" fill="#2b5c99" stroke="#2b5c99" stroke-width="1"/><text x="190" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кеш L2</text><text x="430" y="204" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0,5–2 МБ на ядро</text><text x="620" y="204" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 4 нс</text><text x="830" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b5c99" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4 секунди</text><rect x="86.0" y="224" width="208" height="36" rx="4" fill="#3d70ad" stroke="#3d70ad" stroke-width="1"/><text x="190" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кеш L3</text><text x="430" y="248" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8–64 МБ спільний</text><text x="620" y="248" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 15 нс</text><text x="830" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d70ad" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">15 секунд</text><rect x="66.0" y="268" width="248" height="36" rx="4" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="190" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Оперативна пам'ять</text><text x="430" y="292" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8–64 ГБ</text><text x="620" y="292" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 80 нс</text><text x="830" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1,3 хвилини</text><rect x="46.0" y="312" width="288" height="36" rx="4" fill="#96302f" stroke="#96302f" stroke-width="1"/><text x="190" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">SSD (NVMe)</text><text x="430" y="336" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0,5–4 ТБ</text><text x="620" y="336" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 50 мкс</text><text x="830" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">14 годин</text><rect x="26.0" y="356" width="328" height="36" rx="4" fill="#6e2423" stroke="#6e2423" stroke-width="1"/><text x="190" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Жорсткий диск</text><text x="430" y="380" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2–20 ТБ</text><text x="620" y="380" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">близько 5 мс</text><text x="830" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6e2423" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">58 діб</text><rect x="30" y="406" width="920" height="84" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="432" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Звідси й уся наука про керування пам'яттю:</text><text x="52" y="454" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">жоден рівень поодинці не влаштовує — швидке замале, велике заповільне. Тому система постійно вирішує, що саме</text><text x="52" y="474" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">має лежати вище, а що можна відсунути нижче. Решта лекції — про механізми, якими вона це робить.</text></svg>