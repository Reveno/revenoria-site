<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Глухий кут у базі даних: як він виглядає й що робить СУБД</text><text x="136" y="104.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Транзакція A</text><text x="136" y="120.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переказ 1 → 2</text><text x="136" y="194.0" text-anchor="end" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Транзакція Б</text><text x="136" y="210.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переказ 2 → 1</text><rect x="150" y="86" width="180" height="40" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="240.0" y="110.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">UPDATE рахунок 1</text><rect x="330" y="86" width="140" height="40" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="400.0" y="110.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">рядок 1 замкнено</text><rect x="470" y="86" width="140" height="40" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="540.0" y="110.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">UPDATE рахунок 2</text><rect x="610" y="86" width="320" height="40" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="770" y="110.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">чекає на рядок 2</text><rect x="150" y="176" width="180" height="40" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="240.0" y="200.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">UPDATE рахунок 2</text><rect x="330" y="176" width="140" height="40" rx="3" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="400.0" y="200.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">рядок 2 замкнено</text><rect x="470" y="176" width="140" height="40" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="540.0" y="200.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">UPDATE рахунок 1</text><rect x="610" y="176" width="190" height="40" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="705" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">чекає на рядок 1</text><rect x="800" y="176" width="130" height="40" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="865.0" y="200.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ROLLBACK</text><line x1="610" y1="76" x2="610" y2="226" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="610" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кільце замкнулося</text><line x1="800" y1="76" x2="800" y2="226" stroke="#96302f" stroke-width="1.2" stroke-dasharray="4 4"/><text x="930" y="244" text-anchor="end" font-size="11.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">детектор СУБД знайшов цикл і обрав жертву</text><line x1="150" y1="292" x2="921.0" y2="292.0" stroke="#999999" stroke-width="1.6"/><path d="M930.0 292.0 L921.0 297.0 L921.0 287.0 Z" fill="#999999"/><text x="930" y="310" text-anchor="end" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">час</text><rect x="30" y="328" width="920" height="126" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="352" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що з цього випливає для того, хто пише запити:</text><text x="64" y="376" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  СУБД не запобігає глухим кутам — вона їх виявляє, і одну транзакцію відкочує. Це нормальна, очікувана поведінка.</text><text x="64" y="396" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  Отже, застосунок мусить уміти повторити транзакцію: спіймати помилку (у PostgreSQL це SQLSTATE 40P01) і спробувати ще раз.</text><text x="64" y="416" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  Найпростіша профілактика — оновлювати рядки в стабільному порядку, наприклад за зростанням первинного ключа.</text><text x="64" y="436" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  Короткі транзакції стикаються рідше: чим менше замків тримається і чим коротше — тим менший шанс перетнутися.</text></svg>