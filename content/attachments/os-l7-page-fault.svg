<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що відбувається при промаху сторінки: вісім кроків</text><rect x="30" y="76" width="206" height="112" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.6"/><circle cx="50" cy="96" r="13" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="50" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="70" y="101" text-anchor="start" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Звернення</text><text x="44" y="128" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес читає адресу.</text><text x="44" y="146" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">MMU дивиться в таблицю</text><text x="44" y="164" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й бачить біт присутності 0.</text><line x1="240" y1="132.0" x2="255.0" y2="132.0" stroke="#aaaaaa" stroke-width="2"/><path d="M264.0 132.0 L255.0 137.0 L255.0 127.0 Z" fill="#aaaaaa"/><rect x="268" y="76" width="206" height="112" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><circle cx="288" cy="96" r="13" fill="#96302f" stroke="#96302f" stroke-width="1"/><text x="288" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="308" y="101" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Пастка в ядро</text><text x="282" y="128" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Апаратура збуджує</text><text x="282" y="146" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переривання. Це і є</text><text x="282" y="164" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">промах сторінки.</text><line x1="478" y1="132.0" x2="493.0" y2="132.0" stroke="#aaaaaa" stroke-width="2"/><path d="M502.0 132.0 L493.0 137.0 L493.0 127.0 Z" fill="#aaaaaa"/><rect x="506" y="76" width="206" height="112" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><circle cx="526" cy="96" r="13" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="526" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="546" y="101" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Перевірка</text><text x="520" y="128" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ядро питає: адреса взагалі</text><text x="520" y="146" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">законна? Якщо ні —</text><text x="520" y="164" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процесу летить SIGSEGV.</text><line x1="716" y1="132.0" x2="731.0" y2="132.0" stroke="#aaaaaa" stroke-width="2"/><path d="M740.0 132.0 L731.0 137.0 L731.0 127.0 Z" fill="#aaaaaa"/><rect x="744" y="76" width="206" height="112" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><circle cx="764" cy="96" r="13" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="764" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><text x="784" y="101" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Пошук фрейма</text><text x="758" y="128" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Береться вільний фрейм.</text><text x="758" y="146" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Якщо вільних немає —</text><text x="758" y="164" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">когось доведеться виселити.</text><line x1="847.0" y1="192" x2="847.0" y2="231.0" stroke="#aaaaaa" stroke-width="2"/><path d="M847.0 240.0 L842.0 231.0 L852.0 231.0 Z" fill="#aaaaaa"/><rect x="744" y="244" width="206" height="112" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><circle cx="764" cy="264" r="13" fill="#96302f" stroke="#96302f" stroke-width="1"/><text x="764" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><text x="784" y="269" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читання з диска</text><text x="758" y="296" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Замовлено введення-виведення.</text><text x="758" y="314" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес засинає, процесор</text><text x="758" y="332" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">віддано іншим — на мілісекунди.</text><line x1="740" y1="300.0" x2="725.0" y2="300.0" stroke="#aaaaaa" stroke-width="2"/><path d="M716.0 300.0 L725.0 295.0 L725.0 305.0 Z" fill="#aaaaaa"/><rect x="506" y="244" width="206" height="112" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><circle cx="526" cy="264" r="13" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="526" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6</text><text x="546" y="269" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дані прийшли</text><text x="520" y="296" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Контролер диска повідомляє</text><text x="520" y="314" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">перериванням, що сторінка</text><text x="520" y="332" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лежить у фреймі.</text><line x1="502" y1="300.0" x2="487.0" y2="300.0" stroke="#aaaaaa" stroke-width="2"/><path d="M478.0 300.0 L487.0 295.0 L487.0 305.0 Z" fill="#aaaaaa"/><rect x="268" y="244" width="206" height="112" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><circle cx="288" cy="264" r="13" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="288" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><text x="308" y="269" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Оновлення таблиці</text><text x="282" y="296" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ядро записує номер фрейма</text><text x="282" y="314" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й ставить біт присутності</text><text x="282" y="332" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">в одиницю.</text><line x1="264" y1="300.0" x2="249.0" y2="300.0" stroke="#aaaaaa" stroke-width="2"/><path d="M240.0 300.0 L249.0 295.0 L249.0 305.0 Z" fill="#aaaaaa"/><rect x="30" y="244" width="206" height="112" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.6"/><circle cx="50" cy="264" r="13" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="50" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8</text><text x="70" y="269" text-anchor="start" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Повтор інструкції</text><text x="44" y="296" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процес — у чергу готових.</text><text x="44" y="314" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Та сама інструкція</text><text x="44" y="332" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виконується заново, вже успішно.</text><rect x="30" y="388" width="920" height="70" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="414" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найважливіше — восьмий крок: інструкція виконується заново, з самого початку. Процесор не «продовжує з місця», бо</text><text x="52" y="438" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переривання сталося посеред неї. Саме тому апаратура мусить уміти скасувати частково виконану інструкцію без наслідків.</text></svg>