<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500"><rect width="980" height="500" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Як процесор перетворює логічну адресу на фізичну</text><text x="490.0" y="56" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір сторінки 4 КБ, отже 12 молодших бітів — це зсув, а решта — номер сторінки</text><text x="60" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Логічна адреса 8196, у двійковому вигляді:</text><rect x="60" y="90" width="380" height="48" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="250" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0000 0000 0000 0000 0010</text><text x="250" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">номер сторінки = 2</text><rect x="448" y="90" width="240" height="48" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="568" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0000 0000 0100</text><text x="568" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зсув = 4</text><text x="700" y="120" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8196 = 2 × 4096 + 4</text><text x="60" y="198" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиця сторінок цього процесу</text><rect x="60" y="206" width="260" height="30" rx="0" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.3"/><text x="130" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторінка</text><text x="250" y="226" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм</text><rect x="60" y="236" width="260" height="30" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="130" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><text x="250" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">5</text><rect x="60" y="266" width="260" height="30" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="130" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="250" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">9</text><rect x="60" y="296" width="260" height="30" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="130" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="250" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">7</text><rect x="60" y="326" width="260" height="30" rx="0" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/><text x="130" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="250" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="190" y="372" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">рядок для сторінки 2 каже: фрейм 7</text><line x1="330" y1="268" x2="361.0" y2="268.0" stroke="#999999" stroke-width="2"/><path d="M370.0 268.0 L361.0 273.0 L361.0 263.0 Z" fill="#999999"/><rect x="380" y="206" width="300" height="124" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><text x="530" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Складання фізичної адреси</text><text x="530" y="262" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 7 × 4096 = 28672</text><text x="530" y="284" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+ зсув 4</text><line x1="440" y1="294" x2="620" y2="294" stroke="#cccccc" stroke-width="1"/><text x="530" y="316" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фізична адреса 28676</text><text x="830" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фізична пам'ять</text><rect x="720" y="206" width="220" height="40" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="830" y="231" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 5</text><rect x="720" y="246" width="220" height="40" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="830" y="271" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 6</text><rect x="720" y="286" width="220" height="40" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="830" y="311" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 7</text><rect x="720" y="326" width="220" height="40" rx="0" fill="#f4f4f4" stroke="#d5d5d5" stroke-width="1"/><text x="830" y="351" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#aaaaaa" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 8</text><line x1="690" y1="286" x2="705.0" y2="286.0" stroke="#2f6b40" stroke-width="2"/><path d="M714.0 286.0 L705.0 291.0 L705.0 281.0 Z" fill="#2f6b40"/><rect x="30" y="388" width="920" height="96" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="414" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чому зсув переносять без змін:</text><text x="52" y="436" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір сторінки — завжди степінь двійки, тому номер сторінки й зсув — це просто старші та молодші біти адреси.</text><text x="52" y="456" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Жодного ділення робити не треба: апаратура бере одні дроти для одного, інші — для другого. Саме тому трансляція</text><text x="52" y="476" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">коштує один такт і відбувається при кожному зверненні до пам'яті, непомітно для програми.</text></svg>