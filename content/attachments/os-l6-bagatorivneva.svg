<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530"><rect width="980" height="530" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Чому таблиця сторінок не може бути одна: багаторівнева схема</text><rect x="30" y="56" width="920" height="100" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="52" y="82" text-anchor="start" font-size="13.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Проблема плоскої таблиці</text><text x="52" y="106" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">32-бітна адреса, сторінка 4 КБ  →  2²⁰ = 1 048 576 сторінок  →  по 4 байти на запис  →  4 МБ таблиці на кожен процес.</text><text x="52" y="128" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сто процесів — 400 МБ самих лише таблиць. А для 64-бітної адресації плоска таблиця не вміщується в пам'ять узагалі.</text><text x="52" y="172" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ту саму адресу ділять не на дві частини, а на три:</text><rect x="52" y="184" width="260" height="46" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="182.0" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зовнішній індекс</text><text x="182.0" y="223" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">10 бітів</text><rect x="320" y="184" width="260" height="46" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.5"/><text x="450.0" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">внутрішній індекс</text><text x="450.0" y="223" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">10 бітів</text><rect x="588" y="184" width="300" height="46" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="738.0" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зсув</text><text x="738.0" y="223" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">12 бітів</text><rect x="52" y="268" width="190" height="132" rx="5" fill="#ffffff" stroke="#204a80" stroke-width="1.5"/><rect x="52" y="268" width="190" height="28" rx="5" fill="#f2f4f7" stroke="#204a80" stroke-width="1.5"/><rect x="52" y="288" width="190" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="147" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Зовнішня таблиця</text><rect x="62" y="302" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="147" y="318" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">…</text><rect x="62" y="326" width="170" height="22" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><text x="147" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запис 3 → таблиця Б</text><rect x="62" y="350" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="147" y="366" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">…</text><rect x="62" y="374" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="147" y="390" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запис 1023 — немає</text><line x1="246" y1="334" x2="287.0" y2="334.0" stroke="#999999" stroke-width="2"/><path d="M296.0 334.0 L287.0 339.0 L287.0 329.0 Z" fill="#999999"/><rect x="302" y="268" width="190" height="132" rx="5" fill="#ffffff" stroke="#2f6b40" stroke-width="1.5"/><rect x="302" y="268" width="190" height="28" rx="5" fill="#f2f4f7" stroke="#2f6b40" stroke-width="1.5"/><rect x="302" y="288" width="190" height="8" rx="0" fill="#f2f4f7" stroke="none" stroke-width="0"/><text x="397" y="287" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Внутрішня таблиця Б</text><rect x="312" y="302" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="397" y="318" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">…</text><rect x="312" y="326" width="170" height="22" rx="3" fill="#eaf0f8" stroke="#2f6b40" stroke-width="1.2"/><text x="397" y="342" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запис 17 → фрейм 240</text><rect x="312" y="350" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="397" y="366" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">…</text><rect x="312" y="374" width="170" height="22" rx="3" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/><text x="397" y="390" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">решта — немає</text><line x1="496" y1="334" x2="537.0" y2="334.0" stroke="#999999" stroke-width="2"/><path d="M546.0 334.0 L537.0 339.0 L537.0 329.0 Z" fill="#999999"/><rect x="552" y="308" width="180" height="56" rx="5" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><text x="642" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">фрейм 240</text><text x="642" y="352" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">+ зсув</text><rect x="752" y="268" width="198" height="132" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="851" y="294" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Головний виграш</text><text x="851" y="318" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">внутрішні таблиці</text><text x="851" y="336" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">створюють лише для тих</text><text x="851" y="354" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">частин простору, які</text><text x="851" y="372" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процес справді вживає</text><rect x="30" y="424" width="920" height="88" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="450" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Адресний простір процесу майже завжди майже порожній: код унизу, стек угорі, а між ними — гігабайти нічого.</text><text x="52" y="472" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тому замість 4 МБ таблиці реально витрачається кілька десятків кілобайтів. Плата — зайві звернення до пам'яті</text><text x="52" y="494" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на кожному рівні, і саме тому TLB із попереднього розділу є не оптимізацією, а необхідністю.</text></svg>