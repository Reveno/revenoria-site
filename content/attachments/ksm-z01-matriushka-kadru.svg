<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Один кадр у Wireshark: заголовки вкладені один в один</text><rect x="150" y="60" width="730" height="330" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><rect x="250" y="120" width="610" height="250" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="4"/><rect x="350" y="180" width="490" height="170" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="4"/><rect x="450" y="240" width="370" height="90" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="162" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="start" font-weight="bold">Ethernet II</text><text x="162" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">14 байтів</text><text x="262" y="144" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="start" font-weight="bold">IPv4</text><text x="262" y="162" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">від 20 байтів</text><text x="362" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="start" font-weight="bold">TCP</text><text x="362" y="222" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">від 20 байтів</text><text x="462" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="start" font-weight="bold">Дані</text><text x="462" y="282" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">наприклад HTTP</text><text x="462" y="306" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#232120" text-anchor="start" font-weight="normal">GET / HTTP/1.1</text><text x="868" y="84" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#232120" text-anchor="end" font-weight="normal">MAC призначення, MAC джерела, тип 0x0800</text><text x="848" y="144" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#232120" text-anchor="end" font-weight="normal">TTL, протокол = 6, IP джерела, IP призначення</text><text x="828" y="204" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#232120" text-anchor="end" font-weight="normal">порти, Seq, Ack, прапорці, вікно</text><text x="20" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#6b6763" text-anchor="start" font-weight="bold">2</text><text x="20" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#6b6763" text-anchor="start" font-weight="bold">3</text><text x="20" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#6b6763" text-anchor="start" font-weight="bold">4</text><text x="20" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#6b6763" text-anchor="start" font-weight="bold">7</text><text x="40" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">канальний</text><text x="40" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">мережевий</text><text x="40" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">транспортний</text><text x="40" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="normal">прикладний</text><text x="450" y="418" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Wireshark показує кадр згори донизу: від зовнішнього заголовка до внутрішнього</text></svg>