<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 240' width='820' height='240'><rect width='820' height='240' fill='#ffffff'/><text x='410' y='28' font-size='16' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Шлях образу Docker: від коду до працюючого контейнера</text><rect x='30' y='80' width='150' height='70' rx='8' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='105' y='110' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Dockerfile</text><text x='105' y='128' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>+ код</text><line x1='180' y1='115' x2='230' y2='115' stroke='#555' stroke-width='2.5' stroke-linecap='round'/><rect x='230' y='80' width='150' height='70' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='305' y='110' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>docker build</text><line x1='380' y1='115' x2='430' y2='115' stroke='#555' stroke-width='2.5' stroke-linecap='round'/><rect x='430' y='80' width='150' height='70' rx='8' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/><text x='505' y='110' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Образ</text><text x='505' y='128' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>(image)</text><line x1='580' y1='115' x2='630' y2='115' stroke='#555' stroke-width='2.5' stroke-linecap='round'/><rect x='630' y='80' width='150' height='70' rx='8' fill='#f3e5f5' stroke='#6a1b9a' stroke-width='2'/><text x='705' y='110' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>docker run</text><text x='705' y='128' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>→ контейнер</text><text x='410' y='200' font-size='13' text-anchor='middle' fill='#444' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Образ незмінний, з одного образу можна запустити багато однакових контейнерів</text></svg>