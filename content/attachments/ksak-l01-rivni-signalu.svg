<text x="545.0" y="382" text-anchor="middle" font-size="13" fill="#555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Логічний рівень — це діапазон напруг, а не одне значення. Саме тому цифрова схема стійка до шуму.</text>
