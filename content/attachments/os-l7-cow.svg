<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Копіювання при записі: чому fork() коштує майже нічого</text><rect x="30" y="60" width="456" height="300" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="60" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="90" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="258" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Одразу після fork()</text><rect x="56" y="116" width="150" height="44" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="131.0" y="142.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Батько</text><rect x="310" y="116" width="150" height="44" rx="4" fill="#eaf0f8" stroke="#2f6b40" stroke-width="1.5"/><text x="385.0" y="142.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Нащадок</text><rect x="100" y="250" width="120" height="46" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="160" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка A</text><text x="160" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тільки читання</text><rect x="296" y="250" width="120" height="46" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="356" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка B</text><text x="356" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тільки читання</text><line x1="131" y1="164" x2="157.0" y2="237.5" stroke="#204a80" stroke-width="1.8"/><path d="M160.0 246.0 L152.3 239.2 L161.7 235.8 Z" fill="#204a80"/><line x1="131" y1="164" x2="347.5" y2="242.9" stroke="#204a80" stroke-width="1.8"/><path d="M356.0 246.0 L345.8 247.6 L349.3 238.2 Z" fill="#204a80"/><line x1="385" y1="164" x2="168.5" y2="242.9" stroke="#2f6b40" stroke-width="1.8"/><path d="M160.0 246.0 L166.7 238.2 L170.2 247.6 Z" fill="#2f6b40"/><line x1="385" y1="164" x2="359.0" y2="237.5" stroke="#2f6b40" stroke-width="1.8"/><path d="M356.0 246.0 L354.3 235.8 L363.7 239.2 Z" fill="#2f6b40"/><text x="258" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">обидва бачать ті самі фізичні сторінки</text><text x="258" y="348" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">скопійовано лише таблицю сторінок</text><rect x="494" y="60" width="456" height="300" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="494" y="60" width="456" height="38" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="494" y="90" width="456" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="722" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Нащадок записав у сторінку B</text><rect x="520" y="116" width="150" height="44" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="595.0" y="142.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Батько</text><rect x="774" y="116" width="150" height="44" rx="4" fill="#eaf0f8" stroke="#2f6b40" stroke-width="1.5"/><text x="849.0" y="142.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Нащадок</text><rect x="510" y="250" width="120" height="46" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.5"/><text x="570" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка A</text><text x="570" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">далі спільна</text><rect x="662" y="250" width="120" height="46" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.5"/><text x="722" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Сторінка B</text><text x="722" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лишилась батькові</text><rect x="814" y="250" width="120" height="46" rx="4" fill="#f0f6f1" stroke="#2f6b40" stroke-width="1.5"/><text x="874" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Копія B</text><text x="874" y="288" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">створена при записі</text><line x1="595" y1="164" x2="572.6" y2="237.4" stroke="#204a80" stroke-width="1.8"/><path d="M570.0 246.0 L567.8 235.9 L577.4 238.8 Z" fill="#204a80"/><line x1="595" y1="164" x2="714.4" y2="241.1" stroke="#204a80" stroke-width="1.8"/><path d="M722.0 246.0 L711.7 245.3 L717.2 236.9 Z" fill="#204a80"/><line x1="849" y1="164" x2="622.5" y2="243.0" stroke="#2f6b40" stroke-width="1.8"/><path d="M614.0 246.0 L620.9 238.3 L624.1 247.8 Z" fill="#2f6b40"/><line x1="849" y1="164" x2="871.4" y2="237.4" stroke="#2f6b40" stroke-width="1.8"/><path d="M874.0 246.0 L866.6 238.8 L876.2 235.9 Z" fill="#2f6b40"/><text x="722" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">скопійовано рівно одну сторінку — ту, у яку писали</text><text x="722" y="348" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">решта лишається спільною доти, доки її не змінять</text><rect x="30" y="378" width="920" height="78" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="404" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Механізм: усі спільні сторінки позначають «тільки читання». Перший же запис спричиняє апаратний промах захисту,</text><text x="52" y="424" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ядро мовчки робить копію саме цієї сторінки, дозволяє в неї писати й повторює інструкцію. Програма нічого не помічає.</text><text x="52" y="446" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Саме тому візерунок Unix «fork, а потім exec» дешевий: копіювати гігабайти батьківської пам'яті ніхто й не збирався.</text></svg>