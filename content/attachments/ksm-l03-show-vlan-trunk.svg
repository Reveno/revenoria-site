<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560"><rect width="100%" height="100%" fill="#ffffff"/><text x="500" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold" xml:space="preserve">Як читати show vlan brief і show interfaces trunk</text><rect x="30" y="55" width="700" height="175" fill="#1f1d1c" stroke="#1f1d1c" stroke-width="1" rx="8"/><text x="48" y="80" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">SW1# show vlan brief</text><text x="48" y="100" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve"></text><text x="48" y="120" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#ffffff" text-anchor="start" font-weight="normal" xml:space="preserve">VLAN Name                  Status    Ports</text><text x="48" y="140" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">---- ---------------------- --------- ---------------------</text><text x="48" y="160" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">1    default                active    Fa0/3, Fa0/4, Fa0/5 ...</text><text x="48" y="180" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">10   BUKH                   active    Fa0/1</text><text x="48" y="200" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">20   DEV                    active    Fa0/2</text><text x="48" y="220" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">99   NATIVE                 active</text><line x1="735" y1="160" x2="752" y2="160" stroke="#2e7d4f" stroke-width="1.5"/><text x="758" y="164" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">Fa0/1 у VLAN 10</text><line x1="735" y1="200" x2="752" y2="200" stroke="#6b6763" stroke-width="1.5"/><text x="758" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="start" font-weight="bold" xml:space="preserve">Fa0/24 немає: це транк</text><rect x="30" y="255" width="700" height="215" fill="#1f1d1c" stroke="#1f1d1c" stroke-width="1" rx="8"/><text x="48" y="280" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">SW1# show interfaces trunk</text><text x="48" y="300" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve"></text><text x="48" y="320" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Port   Mode  Encapsulation  Status    Native vlan</text><text x="48" y="340" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Fa0/24 on    802.1q         trunking  99</text><text x="48" y="360" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve"></text><text x="48" y="380" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Port   Vlans allowed on trunk</text><text x="48" y="400" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Fa0/24 10,20</text><text x="48" y="420" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve"></text><text x="48" y="440" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Port   Vlans allowed and active in management domain</text><text x="48" y="460" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#e8e4df" text-anchor="start" font-weight="normal" xml:space="preserve">Fa0/24 10,20</text><line x1="735" y1="321" x2="752" y2="321" stroke="#2e7d4f" stroke-width="1.5"/><text x="758" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">trunking: транк піднято</text><line x1="735" y1="381" x2="752" y2="381" stroke="#b9631b" stroke-width="1.5"/><text x="758" y="385" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b9631b" text-anchor="start" font-weight="bold" xml:space="preserve">дозволено лише 10 і 20</text><line x1="735" y1="441" x2="752" y2="441" stroke="#2e7d4f" stroke-width="1.5"/><text x="758" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="start" font-weight="bold" xml:space="preserve">VLAN є на цьому комутаторі</text><text x="40" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="start" font-weight="normal" xml:space="preserve">Тут Native vlan 99 має збігатися на обох кінцях транка, інакше з'являється попередження CDP про розбіжність.</text><text x="40" y="524" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#a83232" text-anchor="start" font-weight="bold" xml:space="preserve">Якщо VLAN немає в Vlans allowed, її кадри через цей транк не пройдуть, навіть коли сам транк піднято.</text></svg>