<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 522" width="980" height="522"><rect width="980" height="522" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Два види посилань: одне ім'я більше не означає один файл</text><rect x="30" y="60" width="456" height="346" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="60" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="90" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="258" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Жорстке посилання</text><text x="148" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Каталог</text><rect x="54" y="134" width="190" height="44" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.3"/><text x="149" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><text x="149" y="169" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ i-node 1247</text><rect x="54" y="194" width="190" height="44" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.3"/><text x="149" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">kopiya.txt</text><text x="149" y="229" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ i-node 1247</text><rect x="298" y="152" width="160" height="84" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><text x="378" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">i-node 1247</text><text x="378" y="198" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лічильник посилань: 2</text><text x="378" y="215" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">розмір, права, блоки</text><line x1="248" y1="156" x2="284.4" y2="179.2" stroke="#2f6b40" stroke-width="1.8"/><path d="M292.0 184.0 L281.7 183.4 L287.1 174.9 Z" fill="#2f6b40"/><line x1="248" y1="216" x2="283.4" y2="204.7" stroke="#2f6b40" stroke-width="1.8"/><path d="M292.0 202.0 L284.9 209.5 L281.9 200.0 Z" fill="#2f6b40"/><rect x="54" y="262" width="404" height="108" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="74" y="286" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обидва імені рівноправні — «оригіналу» не існує.</text><text x="74" y="308" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Видалили одне — лічильник став 1, дані живі.</text><text x="74" y="330" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Видалили обидва — лічильник 0, блоки звільнено.</text><text x="74" y="356" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обмеження: лише в межах однієї файлової системи.</text><rect x="494" y="60" width="456" height="346" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="494" y="60" width="456" height="38" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="494" y="90" width="456" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="722" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Символьне посилання</text><text x="612" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Каталог</text><rect x="518" y="134" width="190" height="44" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.3"/><text x="613" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">zvit.txt</text><text x="613" y="169" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ i-node 1247</text><rect x="518" y="194" width="190" height="44" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.3"/><text x="613" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">link.txt</text><text x="613" y="229" text-anchor="middle" font-size="10" font-weight="normal" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ i-node 5501</text><rect x="762" y="128" width="160" height="84" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><text x="842" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">i-node 1247</text><text x="842" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лічильник: 1</text><text x="842" y="191" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">справжні дані</text><rect x="762" y="230" width="160" height="84" rx="5" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><text x="842" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">i-node 5501</text><text x="842" y="276" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тип: symlink</text><text x="842" y="293" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вміст — текст шляху</text><line x1="712" y1="156" x2="747.0" y2="159.2" stroke="#2f6b40" stroke-width="1.8"/><path d="M756.0 160.0 L746.6 164.2 L747.5 154.2 Z" fill="#2f6b40"/><line x1="712" y1="216" x2="749.5" y2="251.8" stroke="#9a6a12" stroke-width="1.8"/><path d="M756.0 258.0 L746.0 255.4 L752.9 248.2 Z" fill="#9a6a12"/><rect x="518" y="326" width="404" height="72" rx="5" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.3"/><text x="538" y="350" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Це окремий файл, у якому лежить просто текст шляху.</text><text x="538" y="370" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Видалили ціль — посилання лишається й «висить».</text><text x="538" y="390" text-anchor="start" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Зате може вести куди завгодно, навіть на інший диск.</text><rect x="30" y="424" width="920" height="84" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="450" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тепер зрозуміло, чому в Unix немає системного виклику «видалити файл». Є виклик unlink — «прибрати ім'я з каталогу».</text><text x="52" y="470" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Файл зникає лише як побічний наслідок: коли зникло останнє ім'я і його не тримає жоден відкритий дескриптор.</text><text x="52" y="494" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Звідси й відомий фокус: видалений файл, який хтось досі тримає відкритим, продовжує займати місце на диску.</text></svg>