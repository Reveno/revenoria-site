<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430"><rect width="980" height="430" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читачі й письменники: коли «один за раз» — надто сувора вимога</text><rect x="30" y="60" width="440" height="254" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="60" width="440" height="40" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="30" y="92" width="440" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="250" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кілька читачів — можна одночасно</text><rect x="270" y="138" width="160" height="110" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><text x="350.0" y="187.5" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">СПІЛЬНІ</text><text x="350.0" y="207.5" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ДАНІ</text><rect x="56" y="122" width="130" height="38" rx="4" fill="#eaf3ec" stroke="#2f6b40" stroke-width="1.4"/><text x="121.0" y="145.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читач 1</text><line x1="190" y1="141" x2="255.1" y2="151.6" stroke="#2f6b40" stroke-width="1.8"/><path d="M264.0 153.0 L254.3 156.5 L255.9 146.6 Z" fill="#2f6b40"/><rect x="56" y="172" width="130" height="38" rx="4" fill="#eaf3ec" stroke="#2f6b40" stroke-width="1.4"/><text x="121.0" y="195.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читач 2</text><line x1="190" y1="191" x2="255.2" y2="176.9" stroke="#2f6b40" stroke-width="1.8"/><path d="M264.0 175.0 L256.3 181.8 L254.1 172.0 Z" fill="#2f6b40"/><rect x="56" y="222" width="130" height="38" rx="4" fill="#eaf3ec" stroke="#2f6b40" stroke-width="1.4"/><text x="121.0" y="245.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читач 3</text><line x1="190" y1="241" x2="256.3" y2="201.6" stroke="#2f6b40" stroke-width="1.8"/><path d="M264.0 197.0 L258.8 205.9 L253.7 197.3 Z" fill="#2f6b40"/><text x="250" y="300" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дані ніхто не змінює — конфлікту немає</text><rect x="510" y="60" width="440" height="254" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="510" y="60" width="440" height="40" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="510" y="92" width="440" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="730" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Письменник — тільки на самоті</text><rect x="750" y="138" width="160" height="110" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><text x="830.0" y="187.5" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">СПІЛЬНІ</text><text x="830.0" y="207.5" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ДАНІ</text><rect x="536" y="122" width="130" height="38" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="601.0" y="145.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Письменник</text><line x1="670" y1="141" x2="735.4" y2="162.2" stroke="#96302f" stroke-width="2.2"/><path d="M744.0 165.0 L733.9 167.0 L737.0 157.5 Z" fill="#96302f"/><rect x="536" y="178" width="130" height="38" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.2"/><text x="601.0" y="201.2" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читач 1</text><line x1="670" y1="197" x2="735.0" y2="195.2" stroke="#bbbbbb" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M744.0 195.0 L735.1 200.2 L734.9 190.2 Z" fill="#bbbbbb"/><rect x="536" y="228" width="130" height="38" rx="4" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.2"/><text x="601.0" y="251.2" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#999999" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Читач 2</text><line x1="670" y1="247" x2="735.7" y2="218.6" stroke="#bbbbbb" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M744.0 215.0 L737.7 223.2 L733.8 214.0 Z" fill="#bbbbbb"/><text x="710" y="300" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">усі решта — і читачі, і письменники — чекають</text><rect x="30" y="336" width="920" height="76" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="362" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Пастка: якщо читачів пускати завжди, коли є хоч один усередині, письменник може не дочекатися ніколи —</text><text x="52" y="382" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">поки один читач виходить, заходить наступний, і лічильник не падає до нуля. Це голодування письменника.</text><text x="52" y="402" text-anchor="start" font-size="12.5" font-weight="normal" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Лікується варіантом «з перевагою письменника»: щойно письменник став у чергу, нових читачів більше не впускають.</text></svg>