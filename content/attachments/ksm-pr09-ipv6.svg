<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 275' width='900' height='275'><rect width='900' height='275' fill='#ffffff'/><text x='450' y='28' font-size='18' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Структура адреси IPv6 і ієрархія підмереж організації</text><rect x='40' y='60' width='307.5' height='70' rx='4' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='193.75' y='90' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Глобальний префікс</text><text x='193.75' y='108' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>від провайдера</text><rect x='347.5' y='60' width='102.5' height='70' rx='4' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='398.75' y='90' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>ID підмережі</text><text x='398.75' y='108' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>16 бітів</text><rect x='450.0' y='60' width='410.0' height='70' rx='4' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/><text x='655.0' y='90' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Ідентифікатор інтерфейсу</text><text x='655.0' y='108' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>64 біти</text><text x='193.75' y='150' font-size='15' text-anchor='middle' fill='#1565c0' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>/48</text><text x='398.75' y='150' font-size='15' text-anchor='middle' fill='#2e7d32' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>/64 (підмережа)</text><text x='450' y='200' font-size='13' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Приклад: 2001:db8:10::/48 → 2001:db8:10:0001::/64 (філія 1), 2001:db8:10:0002::/64 (філія 2) ...</text><text x='450' y='225' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Кожна підмережа має рівно 2^64 адрес, тому підмережі всередині організації завжди /64, а економити адреси не потрібно.</text><text x='450' y='255' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Шістнадцятковий запис: 8 груп по 16 бітів; нулі зліва в групі опускають, одну найдовшу послідовність нульових груп замінюють «::».</text></svg>