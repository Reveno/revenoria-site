<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">tracert: як зростаючий TTL розкриває маршрут</text><rect x="20" y="70" width="140" height="40" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="90" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#204a80" text-anchor="middle" font-weight="bold">Ваш ПК</text><rect x="200" y="70" width="140" height="40" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="270" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="bold">Шлюз</text><rect x="380" y="70" width="140" height="40" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="450" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="bold">Вузол 2</text><rect x="560" y="70" width="140" height="40" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="630" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#232120" text-anchor="middle" font-weight="bold">Вузол 3</text><rect x="740" y="70" width="140" height="40" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="810" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Ціль</text><line x1="160" y1="90" x2="200" y2="90" stroke="#b0aca8" stroke-width="2"/><line x1="340" y1="90" x2="380" y2="90" stroke="#b0aca8" stroke-width="2"/><line x1="520" y1="90" x2="560" y2="90" stroke="#b0aca8" stroke-width="2"/><line x1="700" y1="90" x2="740" y2="90" stroke="#b0aca8" stroke-width="2"/><line x1="90" y1="110" x2="90" y2="500" stroke="#b0aca8" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="270" y1="110" x2="270" y2="500" stroke="#b0aca8" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="450" y1="110" x2="450" y2="500" stroke="#b0aca8" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="630" y1="110" x2="630" y2="500" stroke="#b0aca8" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="810" y1="110" x2="810" y2="500" stroke="#b0aca8" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="90" y1="180" x2="262" y2="180" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="180.0" y="170" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="middle" font-weight="normal">Echo request, TTL=1</text><line x1="262" y1="206" x2="98" y2="206" stroke="#b9631b" stroke-width="2.5" marker-end="url(#ao)"/><text x="180.0" y="226" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="normal">ICMP Time Exceeded (тип 11)</text><text x="450" y="250" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Пакет 1: TTL=1 – шлюз зменшує TTL до 0 і відкидає пакет</text><line x1="90" y1="300" x2="442" y2="300" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="270.0" y="290" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="middle" font-weight="normal">Echo request, TTL=2</text><line x1="442" y1="326" x2="98" y2="326" stroke="#b9631b" stroke-width="2.5" marker-end="url(#ao)"/><text x="270.0" y="346" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="normal">ICMP Time Exceeded (тип 11)</text><text x="450" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Пакет 2: TTL=2 – вмирає на вузлі 2</text><line x1="90" y1="420" x2="622" y2="420" stroke="#204a80" stroke-width="2.5" marker-end="url(#ab)"/><text x="360.0" y="410" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#204a80" text-anchor="middle" font-weight="normal">Echo request, TTL=3</text><line x1="622" y1="446" x2="98" y2="446" stroke="#b9631b" stroke-width="2.5" marker-end="url(#ao)"/><text x="360.0" y="466" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="normal">ICMP Time Exceeded (тип 11)</text><text x="450" y="490" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">Пакет 3: TTL=3 – вмирає на вузлі 3</text><text x="450" y="538" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Адреса відправника «Time Exceeded» і є адресою чергового вузла на маршруті</text></svg>