<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232120"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Що означає «процесові виділено пам'ять»</text><text x="130" y="68" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">Адресний простір процесу</text><rect x="30" y="84" width="200" height="36" fill="#ffffff" stroke="#b0aca8" stroke-width="1.5" rx="4" stroke-dasharray="5 4"/><text x="130" y="107" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal">зарезервовано</text><rect x="30" y="130" width="200" height="36" fill="#ffffff" stroke="#b0aca8" stroke-width="1.5" rx="4" stroke-dasharray="5 4"/><rect x="30" y="176" width="200" height="36" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="130" y="199" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal">зафіксовано</text><rect x="30" y="222" width="200" height="36" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="4"/><rect x="30" y="268" width="200" height="36" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="130" y="291" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal">торкнулись: у RAM</text><rect x="30" y="314" width="200" height="36" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><rect x="30" y="360" width="200" height="36" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="130" y="383" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#232120" text-anchor="middle" font-weight="normal">витіснено на диск</text><rect x="560" y="100" width="300" height="130" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="710" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Оперативна пам'ять (RAM)</text><text x="710" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">лише торкнуті сторінки</text><text x="710" y="170" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">тут вони і складають</text><text x="710" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">«робочий набір»</text><rect x="560" y="270" width="300" height="90" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="4"/><text x="710" y="296" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold">Файл підкачки на диску</text><text x="710" y="320" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">сюди витісняються сторінки,</text><text x="710" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">яких не вистачило місця в RAM</text><line x1="232" y1="286" x2="556" y2="165" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><line x1="232" y1="332" x2="556" y2="180" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><line x1="232" y1="378" x2="556" y2="315" stroke="#b9631b" stroke-width="2.5" marker-end="url(#ao)"/><text x="395" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold">є фрейм у RAM</text><text x="395" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="bold">сторінка лежить на диску</text><text x="395" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">резерв: лише рядок в обліку,</text><text x="395" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">пам'яті ще немає ніде</text><text x="450" y="438" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Фіксація (commit) обіцяє пам'ять, а робочий набір – це те, що справді лежить у RAM</text></svg>