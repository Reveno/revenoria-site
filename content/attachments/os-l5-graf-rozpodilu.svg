<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570"><rect width="980" height="570" fill="#ffffff"/><text x="490.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Граф розподілу ресурсів: коли цикл означає глухий кут, а коли ні</text><line x1="300" y1="52" x2="331.0" y2="52.0" stroke="#2f6b40" stroke-width="2"/><path d="M340.0 52.0 L331.0 57.0 L331.0 47.0 Z" fill="#2f6b40"/><text x="346" y="56" text-anchor="start" font-size="12" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ресурс видано процесу</text><line x1="548" y1="52" x2="579.0" y2="52.0" stroke="#9a6a12" stroke-width="2" stroke-dasharray="5 4"/><path d="M588.0 52.0 L579.0 57.0 L579.0 47.0 Z" fill="#9a6a12"/><text x="594" y="56" text-anchor="start" font-size="12" font-weight="normal" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процес запитує ресурс</text><rect x="30" y="68" width="456" height="428" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="68" width="456" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="98" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="258" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Один екземпляр кожного ресурсу — глухий кут</text><text x="258" y="424" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P1 чекає на R2, який тримає P2;</text><text x="258" y="444" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P2 чекає на R1, який тримає P1. Ніхто не зрушить.</text><line x1="178.0" y1="180.0" x2="319.0" y2="180.0" stroke="#9a6a12" stroke-width="2" stroke-dasharray="5 4"/><path d="M328.0 180.0 L319.0 185.0 L319.0 175.0 Z" fill="#9a6a12"/><line x1="366.0" y1="218.0" x2="366.0" y2="293.0" stroke="#2f6b40" stroke-width="2"/><path d="M366.0 302.0 L361.0 293.0 L371.0 293.0 Z" fill="#2f6b40"/><line x1="338.0" y1="330.0" x2="197.0" y2="330.0" stroke="#9a6a12" stroke-width="2" stroke-dasharray="5 4"/><path d="M188.0 330.0 L197.0 325.0 L197.0 335.0 Z" fill="#9a6a12"/><line x1="150.0" y1="292.0" x2="150.0" y2="217.0" stroke="#2f6b40" stroke-width="2"/><path d="M150.0 208.0 L155.0 217.0 L145.0 217.0 Z" fill="#2f6b40"/><circle cx="150" cy="180" r="26" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="150" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P1</text><circle cx="366" cy="330" r="26" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="366" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P2</text><rect x="332" y="158" width="68" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><text x="366" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">R2</text><circle cx="366.0" cy="180" r="6" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><rect x="116" y="308" width="68" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><text x="150" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">R1</text><circle cx="150.0" cy="330" r="6" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="258" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кільце замкнулося</text><rect x="494" y="68" width="456" height="428" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="68" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="98" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="722" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">R1 має два екземпляри — глухого кута немає</text><text x="722" y="424" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P3 нічого не просить: він завершиться й віддасть</text><text x="722" y="444" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">свій екземпляр R1 — і P2 піде далі.</text><line x1="642.0" y1="150.0" x2="783.0" y2="150.0" stroke="#9a6a12" stroke-width="2" stroke-dasharray="5 4"/><path d="M792.0 150.0 L783.0 155.0 L783.0 145.0 Z" fill="#9a6a12"/><line x1="830.0" y1="188.0" x2="830.0" y2="243.0" stroke="#2f6b40" stroke-width="2"/><path d="M830.0 252.0 L825.0 243.0 L835.0 243.0 Z" fill="#2f6b40"/><line x1="802.0" y1="280.0" x2="661.0" y2="280.0" stroke="#9a6a12" stroke-width="2" stroke-dasharray="5 4"/><path d="M652.0 280.0 L661.0 275.0 L661.0 285.0 Z" fill="#9a6a12"/><line x1="614.0" y1="242.0" x2="614.0" y2="187.0" stroke="#2f6b40" stroke-width="2"/><path d="M614.0 178.0 L619.0 187.0 L609.0 187.0 Z" fill="#2f6b40"/><line x1="614.0" y1="318.0" x2="614.0" y2="331.0" stroke="#2f6b40" stroke-width="2"/><path d="M614.0 340.0 L609.0 331.0 L619.0 331.0 Z" fill="#2f6b40"/><circle cx="614" cy="150" r="26" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="614" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P1</text><circle cx="830" cy="280" r="26" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="830" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P2</text><circle cx="614" cy="368" r="26" fill="#eaf0f8" stroke="#2f6b40" stroke-width="1.8"/><text x="614" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P3</text><rect x="796" y="128" width="68" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><text x="830" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">R2</text><circle cx="830.0" cy="150" r="6" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><rect x="580" y="258" width="68" height="44" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><text x="614" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">R1</text><circle cx="604.0" cy="280" r="6" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><circle cx="624.0" cy="280" r="6" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><rect x="30" y="512" width="920" height="44" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="490.0" y="539" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Правило: цикл у графі — необхідна умова глухого кута, але достатня лише тоді, коли кожен ресурс має рівно один екземпляр.</text></svg>