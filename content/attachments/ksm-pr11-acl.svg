<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 340' width='900' height='340'><rect width='900' height='340' fill='#ffffff'/><text x='450' y='28' font-size='18' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Перевірка пакета списком доступу: правила згори вниз</text><rect x='40' y='80' width='140' height='60' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='110.0' y='99.2' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Пакет</text><text x='110.0' y='114.2' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>джерело, призначення,</text><text x='110.0' y='129.2' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>протокол, порт</text><rect x='260' y='60' width='470' height='44' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='495.0' y='86.2' font-size='12' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>1: permit tcp 192.168.10.0/24 host 192.168.30.10 eq 22</text><text x='745' y='87' font-size='12' text-anchor='start' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>збіг → дія</text><line x1='495' y1='104' x2='495' y2='120' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='495,120 491.10581657691347,110.78939005997115 498.89418342308653,110.78939005997115' fill='#111'/><rect x='260' y='120' width='470' height='44' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='495.0' y='146.2' font-size='12' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>2: permit icmp any any echo-reply</text><text x='745' y='147' font-size='12' text-anchor='start' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>збіг → дія</text><line x1='495' y1='164' x2='495' y2='180' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='495,180 491.10581657691347,170.78939005997114 498.89418342308653,170.78939005997114' fill='#111'/><rect x='260' y='180' width='470' height='44' rx='6' fill='#ffebee' stroke='#c62828' stroke-width='2'/><text x='495.0' y='206.2' font-size='12' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>3: deny ip any any (явна заборона)</text><text x='745' y='207' font-size='12' text-anchor='start' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>збіг → дія</text><line x1='495' y1='224' x2='495' y2='240' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='495,240 491.10581657691347,230.78939005997114 498.89418342308653,230.78939005997114' fill='#111'/><rect x='260' y='240' width='470' height='44' rx='6' fill='#f5f5f5' stroke='#666' stroke-width='2'/><text x='495.0' y='266.2' font-size='12' text-anchor='middle' fill='#111' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>неявне deny ip any any</text><text x='745' y='267' font-size='12' text-anchor='start' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>збіг → дія</text><line x1='180' y1='110' x2='260' y2='82' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='260,82 252.59293398866166,88.71828647079566 250.0200436930901,81.36717134059123' fill='#111'/><text x='450' y='320' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Першим застосовується правило, що збіглося; решта не перевіряється. Тому вузькі правила ставлять вище широких.</text></svg>