<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540"><rect width="980" height="540" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Журналювання: збій не стає неможливим, але стає передбачуваним</text><text x="490.0" y="56" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">створення одного файлу — це три окремі записи на диск, і між ними може вимкнутися світло</text><rect x="20" y="76" width="456" height="372" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="76" width="456" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="106" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="248" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Без журналу</text><rect x="44" y="128" width="408" height="34" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><circle cx="64" cy="145.0" r="11" fill="#555555" stroke="#555555" stroke-width="1"/><text x="64" y="149.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="84" y="149.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">позначити блок 4711 зайнятим у бітовій карті</text><rect x="44" y="172" width="408" height="34" rx="4" fill="#fafafa" stroke="#555555" stroke-width="1.4"/><circle cx="64" cy="189.0" r="11" fill="#555555" stroke="#555555" stroke-width="1"/><text x="64" y="193.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="84" y="193.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">записати новий i-node 1247</text><line x1="44" y1="224" x2="452" y2="224" stroke="#96302f" stroke-width="2" stroke-dasharray="7 5"/><rect x="170" y="211" width="156" height="26" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="248" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тут вимкнулося світло</text><rect x="44" y="244" width="408" height="34" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.4"/><circle cx="64" cy="261.0" r="11" fill="#cccccc" stroke="#cccccc" stroke-width="1"/><text x="64" y="265.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="84" y="265.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#cccccc" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">додати «zvit.txt → 1247» у каталог</text><rect x="44" y="296" width="408" height="140" rx="5" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="64" y="320" text-anchor="start" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що маємо після ввімкнення:</text><text x="64" y="344" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">блок зайнятий, i-node створений — а імені немає.</text><text x="64" y="364" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Файл існує, але дістатися до нього неможливо;</text><text x="64" y="384" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">місце на диску втрачено назавжди.</text><text x="64" y="408" text-anchor="start" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Лікується лише повною перевіркою всього диска —</text><text x="64" y="426" text-anchor="start" font-size="11.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тим самим fsck, який колись тривав годинами.</text><rect x="504" y="76" width="456" height="372" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="504" y="76" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="504" y="106" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="732" y="101" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">З журналом</text><rect x="528" y="128" width="408" height="34" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><circle cx="548" cy="145.0" r="11" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="548" y="149.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="568" y="149.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">записати в журнал намір: «зроблю 1, 2, 3»</text><rect x="528" y="172" width="408" height="34" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.4"/><circle cx="548" cy="189.0" r="11" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="548" y="193.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="568" y="193.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">поставити позначку «намір повний»</text><rect x="528" y="216" width="408" height="34" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><circle cx="548" cy="233.0" r="11" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="548" y="237.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="568" y="237.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виконати всі три дії на своїх місцях</text><rect x="528" y="260" width="408" height="34" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><circle cx="548" cy="277.0" r="11" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="548" y="281.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><text x="568" y="281.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">викреслити запис із журналу</text><rect x="528" y="306" width="408" height="122" rx="5" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="548" y="330" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що буде, якщо світло зникне:</text><text x="548" y="354" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">до позначки — намір неповний, його відкидають,</text><text x="548" y="374" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">наче операції не було зовсім;</text><text x="548" y="398" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">після позначки — при завантаженні журнал</text><text x="548" y="418" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">програють заново, і операція доводиться до кінця.</text><rect x="20" y="462" width="940" height="62" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="42" y="486" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ціна очевидна: усе, що потрапляє в журнал, записується на диск двічі. Тому за замовчуванням журналюють лише</text><text x="42" y="508" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">метадані, а самі дані пишуть напряму — це компроміс між швидкістю й тим, наскільки цілими будуть файли.</text></svg>