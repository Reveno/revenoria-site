<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 340' width='900' height='340'><rect width='900' height='340' fill='#ffffff'/><text x='450' y='28' font-size='18' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>STP: три комутатори з надлишковими каналами</text><rect x='380' y='60' width='140' height='50' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='450.0' y='81.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>S1 (корінь)</text><text x='450.0' y='96.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>пріоритет 4096</text><rect x='120' y='230' width='140' height='50' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='190.0' y='251.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>S2</text><text x='190.0' y='266.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>пріоритет 8192</text><rect x='640' y='230' width='140' height='50' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='710.0' y='251.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>S3</text><text x='710.0' y='266.7' font-size='12' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>пріоритет 32768</text><line x1='400' y1='110' x2='210' y2='230' stroke='#111' stroke-width='3' stroke-linecap='round'/><line x1='500' y1='110' x2='710' y2='230' stroke='#111' stroke-width='3' stroke-linecap='round'/><line x1='260' y1='255' x2='640' y2='255' stroke='#c62828' stroke-width='3' stroke-dasharray='8 5' stroke-linecap='round'/><text x='450' y='245' font-size='12' text-anchor='middle' fill='#c62828' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>заблокований порт (BLK) на S3</text><text x='285' y='160' font-size='11' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>root port / designated</text><text x='630' y='160' font-size='11' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>root port / designated</text><text x='450' y='320' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Кореневим стає комутатор із найменшим пріоритетом (і меншою MAC-адресою за рівності). Зайвий канал блокується, щоб не було петлі.</text></svg>