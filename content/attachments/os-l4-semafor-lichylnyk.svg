<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440"><rect width="980" height="440" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Семафор-лічильник: пул із трьох однакових ресурсів</text><text x="490.0" y="56" text-anchor="middle" font-size="13" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">наприклад, три з'єднання з базою даних — четвертий охочий мусить зачекати</text><rect x="32" y="78" width="172" height="244" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="118.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на початку</text><circle cx="73" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><circle cx="118" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><circle cx="163" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><text x="118.0" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">S = 3</text><text x="118.0" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">пул вільний,</text><text x="118.0" y="253" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">усі три з'єднання є</text><rect x="224" y="78" width="172" height="244" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="310.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">wait() — П1</text><circle cx="265" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="265" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П1</text><circle cx="310" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><circle cx="355" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><text x="310.0" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">S = 2</text><text x="310.0" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П1 узяв з'єднання,</text><text x="310.0" y="253" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лічильник зменшено</text><rect x="416" y="78" width="172" height="244" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="502.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">wait() — П2</text><circle cx="457" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="457" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П1</text><circle cx="502" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="502" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П2</text><circle cx="547" cy="152" r="17" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6"/><text x="502.0" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">S = 1</text><text x="502.0" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П2 узяв друге</text><rect x="608" y="78" width="172" height="244" rx="6" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="694.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">wait() — П3</text><circle cx="649" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="649" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П1</text><circle cx="694" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="694" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П2</text><circle cx="739" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="739" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П3</text><text x="694.0" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">S = 0</text><text x="694.0" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П3 узяв третє,</text><text x="694.0" y="253" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">вільних більше немає</text><rect x="800" y="78" width="172" height="244" rx="6" fill="#fdf4f3" stroke="#96302f" stroke-width="1.6"/><text x="886.0" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">wait() — П4</text><circle cx="841" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="841" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П1</text><circle cx="886" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="886" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П2</text><circle cx="931" cy="152" r="17" fill="#dbe6f4" stroke="#204a80" stroke-width="1.6"/><text x="931" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П3</text><text x="886.0" y="206" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">S = 0</text><text x="886.0" y="236" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">лічильник уже 0 —</text><text x="886.0" y="253" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">П4 засинає в черзі</text><rect x="836" y="274" width="100" height="32" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="886" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">черга: П4</text><line x1="206" y1="152" x2="213.0" y2="152.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M222.0 152.0 L213.0 157.0 L213.0 147.0 Z" fill="#aaaaaa"/><line x1="398" y1="152" x2="405.0" y2="152.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M414.0 152.0 L405.0 157.0 L405.0 147.0 Z" fill="#aaaaaa"/><line x1="590" y1="152" x2="597.0" y2="152.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M606.0 152.0 L597.0 157.0 L597.0 147.0 Z" fill="#aaaaaa"/><line x1="782" y1="152" x2="789.0" y2="152.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M798.0 152.0 L789.0 157.0 L789.0 147.0 Z" fill="#aaaaaa"/><rect x="32" y="348" width="916" height="66" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="52" y="374" text-anchor="start" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">signal() від будь-якого з трьох потоків  →  S стає 1  →  ядро будить П4, і той відразу зменшує лічильник назад до 0.</text><text x="52" y="398" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">М'ютекс — це той самий механізм із єдиним дозволом (S = 1) плюс правило: віддати може лише той, хто взяв.</text></svg>