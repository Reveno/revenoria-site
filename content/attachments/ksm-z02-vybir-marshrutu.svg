<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232120"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#204a80"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b9631b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="450" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#232120" text-anchor="middle" font-weight="bold">Як комп'ютер обирає, куди відправити пакет</text><rect x="300" y="60" width="300" height="50" fill="#dbe6f4" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="450.0" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#204a80" text-anchor="middle" font-weight="bold">IP-адреса призначення пакета</text><text x="450.0" y="104" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">будь-яка: сусід, сайт, ваш власний ПК</text><line x1="450" y1="112" x2="450" y2="148" stroke="#232120" stroke-width="2.5" marker-end="url(#a)"/><rect x="250" y="150" width="400" height="78" fill="#f3f1ef" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="450.0" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#232120" text-anchor="middle" font-weight="bold">Пошук у таблиці маршрутизації</text><text x="450.0" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">беруться записи, що охоплюють адресу;</text><text x="450.0" y="214" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">перемагає найдовша маска, далі менша метрика</text><line x1="380" y1="230" x2="230" y2="292" stroke="#2e7d4f" stroke-width="2.5" marker-end="url(#ag)"/><line x1="520" y1="230" x2="670" y2="292" stroke="#b9631b" stroke-width="2.5" marker-end="url(#ao)"/><text x="120" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Gateway: On-link</text><text x="770" y="266" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="bold">Gateway: адреса маршрутизатора</text><rect x="40" y="294" width="380" height="92" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="230.0" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">Адресат у цій самій підмережі</text><text x="230.0" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">ARP питає про MAC самого адресата</text><text x="230.0" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">кадр іде прямо йому</text><rect x="480" y="294" width="380" height="92" fill="#fbe9d7" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="670.0" y="318" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold">Адресат деінде</text><text x="670.0" y="338" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">ARP питає про MAC шлюзу</text><text x="670.0" y="358" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">кадр іде шлюзу, а IP призначення не змінюється</text><text x="230" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">наприклад: ПК сусіда по парті</text><text x="670" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">наприклад: зовнішній сайт через запис 0.0.0.0/0</text><text x="450" y="452" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Адреси 127.x.x.x у таблиці теж є, але такі пакети назовні не виходять</text></svg>