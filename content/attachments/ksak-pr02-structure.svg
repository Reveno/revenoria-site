<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 310' width='880' height='310'><rect width='880' height='310' fill='#ffffff'/><text x='420' y='28' font-size='18' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Структура опису на VHDL і тестове середовище</text><rect x='40' y='60' width='320' height='200' rx='10' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='200' y='82' font-size='14' text-anchor='middle' fill='#1565c0' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Проєктований модуль cmp2</text><rect x='70' y='100' width='260' height='50' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='200.0' y='121.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>entity: інтерфейс</text><text x='200.0' y='137.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>(входи a, b; виходи gt, eq, lt)</text><rect x='70' y='170' width='260' height='70' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='200.0' y='193.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>architecture: поведінка</text><text x='200.0' y='209.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>process (a, b) ... if / case</text><text x='200.0' y='225.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>що робить схема</text><rect x='480' y='60' width='360' height='200' rx='10' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/><text x='660' y='82' font-size='14' text-anchor='middle' fill='#ef6c00' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Тестове середовище tb (testbench)</text><rect x='500' y='100' width='150' height='70' rx='6' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/><text x='575.0' y='123.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>генератор</text><text x='575.0' y='139.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>впливів</text><text x='575.0' y='155.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>a, b: 0..3</text><rect x='680' y='100' width='140' height='70' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='750.0' y='131.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>екземпляр</text><text x='750.0' y='147.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>cmp2 (DUT)</text><rect x='500' y='190' width='320' height='50' rx='6' fill='#f3e5f5' stroke='#6a1b9a' stroke-width='2'/><text x='660.0' y='219.55' font-size='13' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>часова діаграма: a, b, gt, eq, lt</text><line x1='650' y1='135' x2='680' y2='135' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='680,135 670.7893900599712,138.8941834230865 670.7893900599712,131.1058165769135' fill='#111'/><line x1='750' y1='170' x2='750' y2='190' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='750,190 746.1058165769135,180.78939005997114 753.8941834230865,180.78939005997114' fill='#111'/><text x='420' y='290' font-size='13' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Модуль не знає про тест, а тест не знає, як усередині влаштований модуль: перевіряється лише інтерфейс.</text></svg>