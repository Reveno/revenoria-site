<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 405" width="900" height="405"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#232120"/></marker></defs><text x="450" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#232120" text-anchor="middle" font-weight="bold">Виробник-споживач: кільцевий буфер на 5 клітинок</text><rect x="275.0" y="110" width="64" height="60" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="307.0" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold">дані</text><text x="307.0" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">[0]</text><rect x="345.0" y="110" width="64" height="60" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="377.0" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold">дані</text><text x="377.0" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">[1]</text><rect x="415.0" y="110" width="64" height="60" fill="#dcefe3" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="447.0" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#2e7d4f" text-anchor="middle" font-weight="bold">дані</text><text x="447.0" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">[2]</text><rect x="485.0" y="110" width="64" height="60" fill="#f0efed" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="517.0" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">[3]</text><rect x="555.0" y="110" width="64" height="60" fill="#f0efed" stroke="#b0aca8" stroke-width="1.5" rx="6"/><text x="587.0" y="102" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">[4]</text><line x1="517.0" y1="65" x2="517.0" y2="98" stroke="#b9631b" stroke-width="2" marker-end="url(#ah)"/><text x="517.0" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#b9631b" text-anchor="middle" font-weight="bold">Виробник пише сюди</text><line x1="307.0" y1="205" x2="307.0" y2="172" stroke="#204a80" stroke-width="2" marker-end="url(#ah)"/><text x="307.0" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#204a80" text-anchor="middle" font-weight="bold">Споживач читає звідси</text><rect x="120" y="260" width="280" height="70" fill="#f7f5f3" stroke="#b0aca8" stroke-width="1" rx="8"/><text x="260" y="286" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#2e7d4f" text-anchor="middle" font-weight="bold">sem_full = 3</text><text x="260" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">"скільки клітинок зайнято"</text><rect x="500" y="260" width="280" height="70" fill="#f7f5f3" stroke="#b0aca8" stroke-width="1" rx="8"/><text x="640" y="286" font-family="DejaVu Sans Mono, monospace" font-size="14" fill="#b9631b" text-anchor="middle" font-weight="bold">sem_empty = 2</text><text x="640" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#6b6763" text-anchor="middle" font-weight="normal">"скільки клітинок вільно"</text><text x="450" y="360" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">Виробник чекає на sem_empty перед записом, споживач – на sem_full перед читанням.</text><text x="450" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#6b6763" text-anchor="middle" font-weight="normal">М'ютекс усередині захищає самі індекси wpos/rpos 