<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400"><rect width="980" height="400" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Три сусідні біди, які легко переплутати</text><rect x="20" y="62" width="300" height="246" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="62" width="300" height="44" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="20" y="98" width="300" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="170.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Глухий кут</text><text x="170.0" y="100" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">deadlock</text><text x="170.0" y="134" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кожен чекає на іншого,</text><text x="170.0" y="153" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і жоден не рухається.</text><text x="170.0" y="172" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кільце очікувань замкнене.</text><rect x="38" y="200" width="264" height="30" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="170.0" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор вільний</text><text x="170.0" y="250" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процеси у стані очікування,</text><text x="170.0" y="265" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">завантаження нульове.</text><line x1="38" y1="276" x2="302" y2="276" stroke="#e0e0e0" stroke-width="1"/><text x="170.0" y="296" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Два потоки взяли замки в різному порядку.</text><rect x="340" y="62" width="300" height="246" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="62" width="300" height="44" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="340" y="98" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="490.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Живий кут</text><text x="490.0" y="100" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">livelock</text><text x="490.0" y="134" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процеси не заблоковані</text><text x="490.0" y="153" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">й активно працюють,</text><text x="490.0" y="172" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">але просування немає.</text><rect x="358" y="200" width="264" height="30" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="490.0" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор завантажений</text><text x="490.0" y="250" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Ззовні виглядає як робота,</text><text x="490.0" y="265" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">насправді — біг на місці.</text><line x1="358" y1="276" x2="622" y2="276" stroke="#e0e0e0" stroke-width="1"/><text x="490.0" y="296" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Двоє в коридорі синхронно ступають убік.</text><rect x="660" y="62" width="300" height="246" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.6"/><rect x="660" y="62" width="300" height="44" rx="6" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><rect x="660" y="98" width="300" height="8" rx="0" fill="#eaf0f8" stroke="none" stroke-width="0"/><text x="810.0" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Голодування</text><text x="810.0" y="100" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">starvation</text><text x="810.0" y="134" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Система працює й рухається,</text><text x="810.0" y="153" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">але конкретний процес</text><text x="810.0" y="172" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ніколи не отримує ресурсу.</text><rect x="678" y="200" width="264" height="30" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><text x="810.0" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор завантажений</text><text x="810.0" y="250" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Страждає один, решті добре —</text><text x="810.0" y="265" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">тому важко помітити.</text><line x1="678" y1="276" x2="942" y2="276" stroke="#e0e0e0" stroke-width="1"/><text x="810.0" y="296" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">Письменник під безперервним потоком читачів.</text><rect x="20" y="326" width="940" height="56" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="490.0" y="350" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Спільне в усіх трьох: корисна робота не робиться. Різне: хто саме застряг і чи видно це по завантаженню процесора.</text><text x="490.0" y="371" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Глухий кут видно одразу, живий кут маскується під роботу, а голодування помічають лише за скаргами користувача.</text></svg>