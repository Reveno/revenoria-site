<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420"><rect width="980" height="420" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">М'ютекс у часі: поки А всередині, Б не крутиться намарно, а спить</text><text x="116" y="124.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік А</text><text x="116" y="234.0" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><rect x="130" y="96" width="150" height="46" rx="3" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.4"/><text x="205.0" y="123.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звичайний код</text><rect x="280" y="96" width="50" height="46" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="305.0" y="123.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock()</text><rect x="330" y="96" width="250" height="46" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="455.0" y="123.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">критична секція</text><rect x="580" y="96" width="80" height="46" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="620.0" y="123.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">unlock()</text><rect x="660" y="96" width="270" height="46" rx="3" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.4"/><text x="795.0" y="123.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звичайний код</text><rect x="130" y="206" width="250" height="46" rx="3" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.4"/><text x="255.0" y="233.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">звичайний код</text><rect x="380" y="206" width="50" height="46" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="405.0" y="233.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock()</text><rect x="430" y="206" width="230" height="46" rx="3" fill="url(#hatch)" stroke="#bbbbbb" stroke-width="1.4"/><text x="545" y="233.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">заблокований — спить</text><rect x="660" y="206" width="80" height="46" rx="3" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="700.0" y="233.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">прокинувся</text><rect x="740" y="206" width="190" height="46" rx="3" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="835.0" y="233.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">критична секція</text><line x1="330" y1="72" x2="330" y2="288" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="330" y="306" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">А захопив</text><text x="330" y="322" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">м'ютекс</text><line x1="430" y1="72" x2="430" y2="288" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="430" y="306" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Б просить —</text><text x="430" y="322" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайнято</text><line x1="660" y1="72" x2="660" y2="288" stroke="#aaaaaa" stroke-width="1" stroke-dasharray="4 4"/><text x="660" y="306" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">А віддав —</text><text x="660" y="322" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Б розбуджено</text><line x1="130" y1="348" x2="921.0" y2="348.0" stroke="#999999" stroke-width="1.6"/><path d="M930.0 348.0 L921.0 353.0 L921.0 343.0 Z" fill="#999999"/><text x="930" y="366" text-anchor="end" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-style="italic">час</text><rect x="130" y="378" width="800" height="30" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1"/><text x="490.0" y="398" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Заблокований потік не займає процесор: планувальник віддає його комусь іншому й повертає лише після unlock()</text></svg>