<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440"><rect width="980" height="440" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Два способи почекати: крутитися чи заснути</text><rect x="30" y="60" width="430" height="296" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="60" width="430" height="40" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="92" width="430" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="245" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Активне очікування (спінлок)</text><rect x="56" y="120" width="168" height="60" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/><text x="140.0" y="145.7" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><text x="140.0" y="162.7" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не спить, працює</text><rect x="256" y="120" width="178" height="60" rx="4" fill="#f7f7f7" stroke="#dddddd" stroke-width="1"/><text x="345" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">while (зайнято) ;</text><text x="345" y="165" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">перевіряє знову і знову</text><line x1="230" y1="150" x2="241.0" y2="150.0" stroke="#aaaaaa" stroke-width="1.8"/><path d="M250.0 150.0 L241.0 155.0 L241.0 145.0 Z" fill="#aaaaaa"/><text x="56" y="216" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що робить ядро процесора в цей час:</text><rect x="56" y="228" width="378" height="34" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.4"/><text x="245" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ядро зайняте на 100 %, корисної роботи — нуль</text><text x="56" y="292" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Квант часу згорає намарно.</text><text x="56" y="311" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">На одному ядрі — глухий кут: той, хто тримає</text><text x="56" y="330" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">замок, узагалі не отримає процесора.</text><rect x="520" y="60" width="430" height="296" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="520" y="60" width="430" height="40" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="520" y="92" width="430" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="735" y="86" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Блокування (м'ютекс)</text><rect x="546" y="120" width="168" height="60" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1"/><text x="630.0" y="145.7" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><text x="630.0" y="162.7" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">спить у черзі</text><rect x="746" y="120" width="178" height="60" rx="4" fill="#f7f7f7" stroke="#dddddd" stroke-width="1"/><text x="835" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock() → черга</text><text x="835" y="165" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ядро зніме з процесора</text><line x1="720" y1="150" x2="731.0" y2="150.0" stroke="#aaaaaa" stroke-width="1.8"/><path d="M740.0 150.0 L731.0 155.0 L731.0 145.0 Z" fill="#aaaaaa"/><text x="546" y="216" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що робить ядро процесора в цей час:</text><rect x="546" y="228" width="378" height="34" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="735" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ядро віддано іншому потоку — робота триває</text><text x="546" y="292" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Плата — два перемикання контексту,</text><text x="546" y="311" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">приблизно 1–5 мкс.</text><text x="546" y="330" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Дешево, якщо чекати доводиться довше.</text><rect x="30" y="372" width="920" height="50" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="490.0" y="394" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Правило вибору: спінлок виправданий лише тоді, коли очікування свідомо коротше за перемикання контексту —</text><text x="490.0" y="412" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">усередині ядра, на багатоядерній машині, на кілька десятків інструкцій. У прикладній програмі майже завжди потрібен м'ютекс.</text></svg>