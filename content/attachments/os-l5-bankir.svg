<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420"><rect width="980" height="420" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Алгоритм банкіра: перевірка, чи стан безпечний</text><text x="490.0" y="56" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">шукаємо послідовність, у якій кожен процес по черзі можна повністю задовольнити наявними ресурсами</text><rect x="30" y="86" width="138" height="178" rx="6" fill="#fafafa" stroke="#cfcfcf" stroke-width="1.4"/><text x="99.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Наявно</text><text x="99.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">початковий стан</text><line x1="48" y1="152" x2="150" y2="152" stroke="#dddddd" stroke-width="1"/><text x="99.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="99.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(3, 3, 2)</text><text x="99.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на початку</text><line x1="170" y1="175.0" x2="171.0" y2="175.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M180.0 175.0 L171.0 180.0 L171.0 170.0 Z" fill="#aaaaaa"/><rect x="182" y="86" width="138" height="178" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="251.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P1</text><text x="251.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреба (1,2,2)</text><line x1="200" y1="152" x2="302" y2="152" stroke="#dddddd" stroke-width="1"/><text x="251.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="251.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(5, 3, 2)</text><text x="251.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернув (2,0,0)</text><line x1="322" y1="175.0" x2="323.0" y2="175.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M332.0 175.0 L323.0 180.0 L323.0 170.0 Z" fill="#aaaaaa"/><rect x="334" y="86" width="138" height="178" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="403.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P3</text><text x="403.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреба (0,1,1)</text><line x1="352" y1="152" x2="454" y2="152" stroke="#dddddd" stroke-width="1"/><text x="403.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="403.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(7, 4, 3)</text><text x="403.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернув (2,1,1)</text><line x1="474" y1="175.0" x2="475.0" y2="175.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M484.0 175.0 L475.0 180.0 L475.0 170.0 Z" fill="#aaaaaa"/><rect x="486" y="86" width="138" height="178" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="555.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P4</text><text x="555.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреба (4,3,1)</text><line x1="504" y1="152" x2="606" y2="152" stroke="#dddddd" stroke-width="1"/><text x="555.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="555.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(7, 4, 5)</text><text x="555.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернув (0,0,2)</text><line x1="626" y1="175.0" x2="627.0" y2="175.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M636.0 175.0 L627.0 180.0 L627.0 170.0 Z" fill="#aaaaaa"/><rect x="638" y="86" width="138" height="178" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="707.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P2</text><text x="707.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреба (6,0,0)</text><line x1="656" y1="152" x2="758" y2="152" stroke="#dddddd" stroke-width="1"/><text x="707.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="707.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(10, 4, 7)</text><text x="707.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернув (3,0,2)</text><line x1="778" y1="175.0" x2="779.0" y2="175.0" stroke="#aaaaaa" stroke-width="1.6"/><path d="M788.0 175.0 L779.0 180.0 L779.0 170.0 Z" fill="#aaaaaa"/><rect x="790" y="86" width="138" height="178" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="859.0" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">P0</text><text x="859.0" y="138" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">потреба (7,4,3)</text><line x1="808" y1="152" x2="910" y2="152" stroke="#dddddd" stroke-width="1"/><text x="859.0" y="174" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">стало вільно:</text><text x="859.0" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(10, 5, 7)</text><text x="859.0" y="228" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">повернув (0,1,0)</text><rect x="30" y="292" width="920" height="46" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="490.0" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Безпечна послідовність є:  P1 → P3 → P4 → P2 → P0.  Отже, стан безпечний і запит можна задовольнити.</text><rect x="30" y="350" width="920" height="52" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="374" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Якщо жодної такої послідовності немає, стан вважають небезпечним — і банкір відмовляє в запиті, навіть коли ресурси фізично вільні.</text><text x="52" y="394" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тому алгоритм і не прижився: він вимагає знати максимальні потреби наперед, а реальні програми їх не знають.</text></svg>