<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Базовий і граничний регістри: найпростіший захист і переміщення</text><rect x="30" y="96" width="150" height="92" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="105.0" y="128.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРОЦЕСОР</text><text x="105.0" y="146.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">видає логічну</text><text x="105.0" y="164.2" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">адресу</text><text x="105" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">адреса 346</text><text x="105" y="234" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">(усередині процесу)</text><rect x="250" y="78" width="300" height="250" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><rect x="250" y="78" width="300" height="34" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><rect x="250" y="104" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="400" y="101" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Блок керування пам'яттю (MMU)</text><rect x="272" y="126" width="120" height="42" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="332" y="143" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">граничний</text><text x="332" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2048</text><rect x="408" y="126" width="120" height="42" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="468" y="143" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">базовий</text><text x="468" y="160" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">14000</text><rect x="272" y="186" width="256" height="44" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.4"/><text x="400" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">346 &lt; 2048 ?  так</text><text x="400" y="224" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">адреса в межах процесу</text><rect x="272" y="244" width="256" height="44" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.4"/><text x="400" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">346 + 14000 = 14346</text><text x="400" y="282" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">додаємо базу — і це фізична адреса</text><rect x="272" y="298" width="256" height="20" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="400" y="312" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інакше — пастка: порушення доступу</text><line x1="182" y1="140" x2="235.0" y2="140.0" stroke="#999999" stroke-width="2"/><path d="M244.0 140.0 L235.0 145.0 L235.0 135.0 Z" fill="#999999"/><line x1="552" y1="200" x2="631.0" y2="200.0" stroke="#999999" stroke-width="2"/><path d="M640.0 200.0 L631.0 205.0 L631.0 195.0 Z" fill="#999999"/><text x="600" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">14346</text><text x="790" y="74" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фізична пам'ять</text><rect x="660" y="84" width="260" height="300" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><rect x="660" y="84" width="260" height="60" rx="0" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/><text x="790" y="118" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ядро та інші процеси</text><rect x="660" y="144" width="260" height="120" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><text x="790" y="186" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">НАШ ПРОЦЕС</text><text x="790" y="206" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">14000 … 16047</text><rect x="660" y="264" width="260" height="120" rx="0" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/><text x="790" y="328" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">інші процеси</text><line x1="652" y1="230" x2="928" y2="230" stroke="#96302f" stroke-width="1.4" stroke-dasharray="5 4"/><text x="928" y="246" text-anchor="end" font-size="10.5" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сюди потрапляє адреса 14346</text><rect x="30" y="400" width="920" height="56" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="424" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Два регістри розв'язують одразу дві задачі: захист (за межі свого шматка не вийдеш) і переміщення (програму можна</text><text x="52" y="444" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">покласти в будь-яке місце пам'яті, змінивши базовий регістр). Але шматок мусить бути суцільним — і це стане проблемою.</text></svg>