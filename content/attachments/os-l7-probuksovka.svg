<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Пробуксовка: чому додавання процесів раптом обвалює всю систему</text><rect x="362.0" y="94" width="308.0" height="250" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><line x1="110" y1="344" x2="681.0" y2="344.0" stroke="#999999" stroke-width="1.6"/><path d="M690.0 344.0 L681.0 349.0 L681.0 339.0 Z" fill="#999999"/><line x1="110" y1="344" x2="110.0" y2="83.0" stroke="#999999" stroke-width="1.6"/><path d="M110.0 74.0 L115.0 83.0 L105.0 83.0 Z" fill="#999999"/><text x="390.0" y="384" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ступінь мультипрограмування — скільки процесів у пам'яті</text><line x1="105" y1="344.0" x2="110" y2="344.0" stroke="#999999" stroke-width="1"/><text x="98" y="348.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">0</text><line x1="105" y1="281.5" x2="110" y2="281.5" stroke="#999999" stroke-width="1"/><text x="98" y="285.5" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">25</text><line x1="110" y1="281.5" x2="670" y2="281.5" stroke="#ececec" stroke-width="1"/><line x1="105" y1="219.0" x2="110" y2="219.0" stroke="#999999" stroke-width="1"/><text x="98" y="223.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">50</text><line x1="110" y1="219.0" x2="670" y2="219.0" stroke="#ececec" stroke-width="1"/><line x1="105" y1="156.5" x2="110" y2="156.5" stroke="#999999" stroke-width="1"/><text x="98" y="160.5" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">75</text><line x1="110" y1="156.5" x2="670" y2="156.5" stroke="#ececec" stroke-width="1"/><line x1="105" y1="94.0" x2="110" y2="94.0" stroke="#999999" stroke-width="1"/><text x="98" y="98.0" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">100 %</text><line x1="110" y1="94.0" x2="670" y2="94.0" stroke="#ececec" stroke-width="1"/><text x="98" y="76" text-anchor="end" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">завантаження</text><text x="98" y="90" text-anchor="end" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процесора</text><polyline points="110.0,344.0 114.7,330.5 119.3,317.8 124.0,305.9 128.7,294.6 133.3,283.9 138.0,273.9 142.7,264.4 147.3,255.4 152.0,247.0 156.7,239.0 161.3,231.5 166.0,224.4 170.7,217.8 175.3,211.5 180.0,205.5 184.7,199.9 189.3,194.6 194.0,189.6 198.7,184.9 203.3,180.5 208.0,176.3 212.7,172.3 217.3,168.6 222.0,165.1 226.7,161.7 231.3,158.6 236.0,155.7 240.7,152.9 245.3,150.3 250.0,147.8 254.7,145.4 259.3,143.2 264.0,141.1 268.7,139.2 273.3,137.3 278.0,135.6 282.7,133.9 287.3,132.4 292.0,130.9 296.7,129.5 301.3,128.2 306.0,127.0 310.7,125.8 315.3,124.7 320.0,123.7 324.7,122.7 329.3,121.8 334.0,120.9 338.7,120.1 343.3,119.4 348.0,118.6 352.7,117.9 357.3,117.3 362.0,116.7 366.7,127.8 371.3,138.3 376.0,148.3 380.7,157.9 385.3,167.0 390.0,175.6 394.7,183.8 399.3,191.6 404.0,199.1 408.7,206.1 413.3,212.8 418.0,219.2 422.7,225.3 427.3,231.1 432.0,236.6 436.7,241.9 441.3,246.8 446.0,251.6 450.7,256.1 455.3,260.4 460.0,264.5 464.7,268.3 469.3,272.0 474.0,275.5 478.7,278.9 483.3,282.0 488.0,285.1 492.7,287.9 497.3,290.7 502.0,293.3 506.7,295.8 511.3,298.1 516.0,300.3 520.7,302.5 525.3,304.5 530.0,306.4 534.7,308.3 539.3,310.0 544.0,311.7 548.7,313.2 553.3,314.7 558.0,316.2 562.7,317.5 567.3,318.8 572.0,320.0 576.7,321.2 581.3,322.3 586.0,323.4 590.7,324.4 595.3,325.3 600.0,326.3 604.7,327.1 609.3,327.9 614.0,328.7 618.7,329.5 623.3,330.2 628.0,330.9 632.7,331.5 637.3,332.1 642.0,332.7 646.7,333.2 651.3,333.8 656.0,334.3 660.7,334.7 665.3,335.2 670.0,335.6" fill="none" stroke="#204a80" stroke-width="3" stroke-linejoin="round"/><line x1="362.0" y1="116.67738013092205" x2="362.0" y2="344" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="362.0" cy="116.67738013092205" r="6" fill="#ffffff" stroke="#204a80" stroke-width="2.4"/><text x="352.0" y="102.67738013092205" text-anchor="end" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">оптимум</text><text x="513.2" y="189.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРОБУКСОВКА</text><text x="513.2" y="214.0" text-anchor="middle" font-size="11" font-weight="normal" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процесор простоює, диск розжарений</text><rect x="706" y="74" width="250" height="260" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><text x="831" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Порочне коло</text><text x="722" y="126" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесам бракує фреймів,</text><text x="722" y="143" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">промахи частішають.</text><text x="722" y="160" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"></text><text x="722" y="177" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процеси весь час чекають</text><text x="722" y="194" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на диск — завантаження</text><text x="722" y="211" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">процесора падає.</text><text x="722" y="228" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"></text><text x="722" y="245" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Планувальник бачить</text><text x="722" y="262" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">простій і запускає</text><text x="722" y="279" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ще один процес.</text><text x="722" y="296" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"></text><text x="722" y="313" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фреймів стає ще менше —</text><text x="722" y="330" text-anchor="start" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і все повторюється спочатку.</text><rect x="30" y="392" width="920" height="62" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.3"/><text x="52" y="416" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Розірвати коло можна лише одним способом — зменшити кількість процесів у пам'яті. Саме тому системи стежать за</text><text x="52" y="436" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">робочими множинами й за частотою промахів, а в крайньому разі знімають процес: у Linux цим займається OOM killer.</text></svg>