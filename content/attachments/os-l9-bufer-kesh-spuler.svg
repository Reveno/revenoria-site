<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440"><rect width="980" height="440" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Буфер, кеш і спулер — три різні речі, які постійно плутають</text><rect x="20" y="60" width="300" height="296" rx="6" fill="#ffffff" stroke="#204a80" stroke-width="1.6"/><rect x="20" y="60" width="300" height="48" rx="6" fill="#eaf0f8" stroke="#204a80" stroke-width="1.6"/><rect x="20" y="100" width="300" height="8" rx="0" fill="#eaf0f8" stroke="none" stroke-width="0"/><text x="170.0" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Буфер</text><text x="170.0" y="102" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">щоб узгодити швидкості</text><text x="170.0" y="134" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Тимчасове сховище між двома</text><text x="170.0" y="152" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">сторонами, які працюють</text><text x="170.0" y="170" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">із різною швидкістю або</text><text x="170.0" y="188" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">різними порціями даних.</text><line x1="40" y1="216" x2="300" y2="216" stroke="#e0e0e0" stroke-width="1"/><text x="40" y="238" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Приклад</text><text x="40" y="258" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Мережева карта складає пакети в буфер,</text><text x="40" y="275" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">бо програма читає повільніше, ніж вони</text><text x="40" y="292" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">приходять.</text><rect x="40" y="320" width="260" height="24" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.2"/><text x="170.0" y="336" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дані проходять крізь нього один раз</text><rect x="340" y="60" width="300" height="296" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="340" y="60" width="300" height="48" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="340" y="100" width="300" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="490.0" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кеш</text><text x="490.0" y="102" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">щоб не читати двічі</text><text x="490.0" y="134" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Копія даних, які вже читали,</text><text x="490.0" y="152" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">залишена на випадок,</text><text x="490.0" y="170" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">що їх попросять знову.</text><text x="490.0" y="188" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Оригінал лежить нижче.</text><line x1="360" y1="216" x2="620" y2="216" stroke="#e0e0e0" stroke-width="1"/><text x="360" y="238" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Приклад</text><text x="360" y="258" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кеш сторінок тримає вміст файлів у</text><text x="360" y="275" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">пам'яті: друге читання того самого файлу</text><text x="360" y="292" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">диск не турбує.</text><rect x="360" y="320" width="260" height="24" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="490.0" y="336" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дані лишаються про запас</text><rect x="660" y="60" width="300" height="296" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.6"/><rect x="660" y="60" width="300" height="48" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.6"/><rect x="660" y="100" width="300" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="810.0" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Спулер</text><text x="810.0" y="102" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">щоб поділити пристрій</text><text x="810.0" y="134" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Черга завдань до пристрою,</text><text x="810.0" y="152" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">який не можна ділити</text><text x="810.0" y="170" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">між процесами — інакше</text><text x="810.0" y="188" text-anchor="middle" font-size="11" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виводи перемішаються.</text><line x1="680" y1="216" x2="940" y2="216" stroke="#e0e0e0" stroke-width="1"/><text x="680" y="238" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Приклад</text><text x="680" y="258" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Служба друку приймає файли від десятків</text><text x="680" y="275" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">програм і віддає принтеру по одному.</text><rect x="680" y="320" width="260" height="24" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="810.0" y="336" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дані чекають своєї черги</text><rect x="20" y="370" width="940" height="56" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="42" y="394" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найкоротше розрізнення: крізь буфер дані проходять один раз, у кеші вони лишаються на потім, а спулер узагалі</text><text x="42" y="416" text-anchor="start" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не про швидкість — він про те, що принтер один, а охочих багато.</text></svg>