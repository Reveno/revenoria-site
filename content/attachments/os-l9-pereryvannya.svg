<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520"><rect width="980" height="520" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Обробник переривання: чому його ділять навпіл</text><text x="30" y="66" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Що відбувається, коли пристрій смикнув лінію переривання</text><rect x="30" y="80" width="216" height="92" rx="5" fill="#ffffff" stroke="#9a6a12" stroke-width="1.5"/><circle cx="48" cy="98" r="11" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="48" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="66" y="103" text-anchor="start" font-size="12" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Контролер</text><text x="44" y="128" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виставляє сигнал</text><text x="44" y="144" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">на лінії переривання</text><line x1="248" y1="126" x2="251.0" y2="126.0" stroke="#aaaaaa" stroke-width="1.8"/><path d="M260.0 126.0 L251.0 131.0 L251.0 121.0 Z" fill="#aaaaaa"/><rect x="262" y="80" width="216" height="92" rx="5" fill="#ffffff" stroke="#204a80" stroke-width="1.5"/><circle cx="280" cy="98" r="11" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="280" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="298" y="103" text-anchor="start" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор</text><text x="276" y="128" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">доробляє поточну інструкцію</text><text x="276" y="144" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">— не кидає її посередині</text><line x1="480" y1="126" x2="483.0" y2="126.0" stroke="#aaaaaa" stroke-width="1.8"/><path d="M492.0 126.0 L483.0 131.0 L483.0 121.0 Z" fill="#aaaaaa"/><rect x="494" y="80" width="216" height="92" rx="5" fill="#ffffff" stroke="#204a80" stroke-width="1.5"/><circle cx="512" cy="98" r="11" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="512" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="530" y="103" text-anchor="start" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Апаратура</text><text x="508" y="128" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зберігає лічильник команд</text><text x="508" y="144" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і перемикається в режим ядра</text><line x1="712" y1="126" x2="715.0" y2="126.0" stroke="#aaaaaa" stroke-width="1.8"/><path d="M724.0 126.0 L715.0 131.0 L715.0 121.0 Z" fill="#aaaaaa"/><rect x="726" y="80" width="216" height="92" rx="5" fill="#ffffff" stroke="#2f6b40" stroke-width="1.5"/><circle cx="744" cy="98" r="11" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="744" y="102" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><text x="762" y="103" text-anchor="start" font-size="12" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Таблиця векторів</text><text x="740" y="128" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">за номером переривання</text><text x="740" y="144" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">дає адресу потрібного обробника</text><line x1="490.0" y1="176" x2="490.0" y2="187.0" stroke="#aaaaaa" stroke-width="2"/><path d="M490.0 196.0 L485.0 187.0 L495.0 187.0 Z" fill="#aaaaaa"/><text x="30" y="214" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">І тут обробник розпадається на дві частини</text><rect x="30" y="226" width="456" height="194" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.7"/><rect x="30" y="226" width="456" height="46" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.7"/><rect x="30" y="264" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="258" y="250" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Верхня половина</text><text x="258" y="266" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виконується негайно, переривання заборонені</text><text x="56" y="298" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  підтвердити переривання контролеру;</text><text x="56" y="318" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  забрати дані з регістрів, поки їх не затерли;</text><text x="56" y="338" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  покласти роботу в чергу;</text><text x="56" y="358" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  вийти якомога швидше.</text><rect x="50" y="382" width="416" height="26" rx="4" fill="#fbecec" stroke="#96302f" stroke-width="1.2"/><text x="258" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">мусить бути якнайкоротшою: система в цей час глуха</text><rect x="494" y="226" width="456" height="194" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.7"/><rect x="494" y="226" width="456" height="46" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.7"/><rect x="494" y="264" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="722" y="250" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Нижня половина</text><text x="722" y="266" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">виконується згодом, переривання дозволені</text><text x="520" y="298" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  розібрати отримані дані;</text><text x="520" y="318" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  оновити структури ядра;</text><text x="520" y="338" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  розбудити процес, який чекав;</text><text x="520" y="358" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  за потреби замовити наступну операцію.</text><rect x="514" y="382" width="416" height="26" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.2"/><text x="722" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">може працювати скільки треба — нікому не заважає</text><rect x="30" y="434" width="920" height="72" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="458" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Причина поділу проста: поки виконується верхня половина, інші переривання заборонені, і система не чує ні мережі,</text><text x="52" y="478" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ні таймера, ні клавіатури. Кожна зайва мікросекунда там — це пропущені пакети й ривки в звуці.</text><text x="52" y="500" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">У Linux нижні половини звуть tasklet і workqueue; у драйвері саме там пишуть усе, що не потребує негайності.</text></svg>