<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Кільцеве очікування ламається одним правилом: єдиний порядок захоплення</text><rect x="30" y="62" width="456" height="316" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="62" width="456" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="92" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="258" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Різний порядок — кільце замикається</text><rect x="52" y="118" width="190" height="118" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1.2"/><text x="147" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік А</text><text x="147" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(A)</text><text x="147" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(B)</text><rect x="274" y="118" width="190" height="118" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1.2"/><text x="369" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><text x="369" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(B)</text><text x="369" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(A)</text><circle cx="258" cy="292" r="40" fill="#fbecec" stroke="#96302f" stroke-width="2"/><text x="258" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">кільце</text><line x1="180" y1="200" x2="220.6" y2="254.8" stroke="#96302f" stroke-width="2"/><path d="M226.0 262.0 L216.6 257.8 L224.7 251.8 Z" fill="#96302f"/><line x1="336" y1="262" x2="376.6" y2="207.2" stroke="#96302f" stroke-width="2"/><path d="M382.0 200.0 L380.7 210.2 L372.6 204.2 Z" fill="#96302f"/><text x="258" y="356" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">А тримає A і чекає на B, Б тримає B і чекає на A</text><rect x="494" y="62" width="456" height="316" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="62" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="92" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="722" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Єдиний порядок — кільця немає</text><rect x="516" y="118" width="190" height="118" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1.2"/><text x="611" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік А</text><text x="611" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(A)</text><text x="611" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(B)</text><rect x="738" y="118" width="190" height="118" rx="4" fill="#fafafa" stroke="#dddddd" stroke-width="1.2"/><text x="833" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Потік Б</text><text x="833" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(A)</text><text x="833" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">lock(B)</text><rect x="612" y="262" width="220" height="60" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><text x="722" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">обидва починають з A</text><text x="722" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">хтось один програє й чекає</text><line x1="611" y1="200" x2="657.8" y2="249.5" stroke="#2f6b40" stroke-width="2"/><path d="M664.0 256.0 L654.2 252.9 L661.4 246.0 Z" fill="#2f6b40"/><line x1="833" y1="200" x2="786.2" y2="249.5" stroke="#2f6b40" stroke-width="2"/><path d="M780.0 256.0 L782.6 246.0 L789.8 252.9 Z" fill="#2f6b40"/><text x="722" y="356" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">той, хто не отримав A, нічого не тримає — і нікому не заважає</text><rect x="30" y="396" width="920" height="60" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="420" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">На практиці порядок задають чимось стабільним: адресою об'єкта, номером рядка в таблиці, іменем ресурсу за абеткою.</text><text x="52" y="442" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найдешевший метод боротьби з глухими кутами: під час виконання не коштує нічого — лише дисципліни, коли пишеш код.</text></svg>