<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 820 334' width='820' height='334'><rect width='820' height='334' fill='#ffffff'/><rect x='0' y='0' width='820' height='334' rx='8' fill='#0c0c0c' stroke='#444' stroke-width='1'/><rect x='0' y='0' width='820' height='30' rx='8' fill='#2b2b2b' stroke='#444' stroke-width='1'/><circle cx='18' cy='15' r='6' fill='#ff5f56' stroke='#ff5f56' stroke-width='0'/><circle cx='38' cy='15' r='6' fill='#ffbd2e' stroke='#ffbd2e' stroke-width='0'/><circle cx='58' cy='15' r='6' fill='#27c93f' stroke='#27c93f' stroke-width='0'/><text x='410.0' y='20' font-size='12' text-anchor='middle' fill='#ddd' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>R1 - CLI</text><text x='14' y='52' font-size='13' fill='#7ee787' font-family='Consolas, Menlo, monospace' xml:space='preserve'>R1#show access-lists</text><text x='14' y='69' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Extended IP access list LAN-IN</text><text x='14' y='86' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    10 permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.10 eq www (12 match(es))</text><text x='14' y='103' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    20 permit tcp 192.168.10.0 0.0.0.255 host 192.168.20.10 eq 443</text><text x='14' y='120' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    30 deny ip 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 (4 match(es))</text><text x='14' y='137' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    40 permit ip 192.168.10.0 0.0.0.255 any (9 match(es))</text><text x='14' y='154' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Extended IP access list DMZ-IN</text><text x='14' y='171' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    10 permit tcp 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 established (10 match(es))</text><text x='14' y='188' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    20 deny ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255</text><text x='14' y='205' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    30 permit ip 192.168.20.0 0.0.0.255 any</text><text x='14' y='222' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>Extended IP access list OUT-IN</text><text x='14' y='239' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    10 permit tcp any host 192.168.20.10 eq www (8 match(es))</text><text x='14' y='256' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    20 permit tcp any host 192.168.20.10 eq 443</text><text x='14' y='273' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    30 permit tcp any 192.168.10.0 0.0.0.255 established</text><text x='14' y='290' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    40 permit icmp any any echo-reply</text><text x='14' y='307' font-size='13' fill='#e6e6e6' font-family='Consolas, Menlo, monospace' xml:space='preserve'>    50 deny ip any any log (3 match(es))</text></svg>