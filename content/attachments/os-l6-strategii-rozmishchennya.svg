<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430"><rect width="980" height="430" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f0f0f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="3"/></pattern></defs><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Куди покласти новий процес: три стратегії на одній і тій самій пам'яті</text><rect x="30" y="56" width="170" height="42" rx="5" fill="#fbecec" stroke="#96302f" stroke-width="1.5"/><text x="115" y="83" text-anchor="middle" font-size="14" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">запит: 5 МБ</text><rect x="50" y="116" width="60" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="80.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><rect x="110" y="116" width="80" height="62" rx="0" fill="url(#hatch)" stroke="#999999" stroke-width="1.3"/><text x="150.0" y="151.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">8 МБ</text><rect x="190" y="116" width="60" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="220.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><rect x="250" y="116" width="50" height="62" rx="0" fill="url(#hatch)" stroke="#999999" stroke-width="1.3"/><text x="275.0" y="151.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4 МБ</text><rect x="300" y="116" width="70" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="335.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><rect x="370" y="116" width="160" height="62" rx="0" fill="url(#hatch)" stroke="#999999" stroke-width="1.3"/><text x="450.0" y="151.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">20 МБ</text><rect x="530" y="116" width="60" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="560.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><rect x="590" y="116" width="70" height="62" rx="0" fill="url(#hatch)" stroke="#999999" stroke-width="1.3"/><text x="625.0" y="151.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">6 МБ</text><rect x="660" y="116" width="80" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="700.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><rect x="740" y="116" width="120" height="62" rx="0" fill="url(#hatch)" stroke="#999999" stroke-width="1.3"/><text x="800.0" y="151.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">12 МБ</text><rect x="860" y="116" width="70" height="62" rx="0" fill="#eaf0f8" stroke="#204a80" stroke-width="1.3"/><text x="895.0" y="151.0" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">зайн.</text><text x="50" y="106" text-anchor="start" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Фізична пам'ять: зайняті ділянки й вільні дірки</text><line x1="150.0" y1="178" x2="150.0" y2="224" stroke="#204a80" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="150.0" y1="224" x2="150.0" y2="191.0" stroke="#204a80" stroke-width="2"/><path d="M150.0 182.0 L155.0 191.0 L145.0 191.0 Z" fill="#204a80"/><text x="60" y="236" text-anchor="start" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Перший підхожий</text><text x="252" y="236" text-anchor="start" font-size="12.5" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ 8 МБ</text><text x="336" y="236" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">бере першу-ліпшу дірку, у яку влазить — і на цьому зупиняє пошук</text><line x1="625.0" y1="178" x2="625.0" y2="274" stroke="#2f6b40" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="625.0" y1="274" x2="625.0" y2="191.0" stroke="#2f6b40" stroke-width="2"/><path d="M625.0 182.0 L630.0 191.0 L620.0 191.0 Z" fill="#2f6b40"/><text x="60" y="286" text-anchor="start" font-size="13" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найкращий підхожий</text><text x="252" y="286" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ 6 МБ</text><text x="336" y="286" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переглядає всі й бере найменшу достатню — щоб «не псувати» великі</text><line x1="450.0" y1="178" x2="450.0" y2="324" stroke="#9a6a12" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="450.0" y1="324" x2="450.0" y2="191.0" stroke="#9a6a12" stroke-width="2"/><path d="M450.0 182.0 L455.0 191.0 L445.0 191.0 Z" fill="#9a6a12"/><text x="60" y="336" text-anchor="start" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Найгірший підхожий</text><text x="252" y="336" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">→ 20 МБ</text><text x="336" y="336" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">бере найбільшу — щоб залишок теж лишився придатним для когось</text><rect x="30" y="358" width="920" height="62" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="382" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Вимірювання показали несподіване: найкращий підхожий, попри назву, працює гірше за перший — він залишає розсип</text><text x="52" y="404" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">крихітних уламків, непридатних ні для кого. На практиці перемагає перший підхожий: він і швидший, і не гірший за якістю.</text></svg>