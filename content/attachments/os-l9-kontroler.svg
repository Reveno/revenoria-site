<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" width="980" height="440"><rect width="980" height="440" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор не спілкується з пристроєм — він спілкується з контролером</text><rect x="40" y="96" width="170" height="96" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="125.0" y="148.7" text-anchor="middle" font-size="14" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРОЦЕСОР</text><rect x="40" y="210" width="170" height="96" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="125.0" y="252.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ОПЕРАТИВНА</text><text x="125.0" y="272.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПАМ'ЯТЬ</text><rect x="240" y="96" width="56" height="210" rx="4" fill="#f2f4f7" stroke="#aaaaaa" stroke-width="1.6"/><text x="268" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ШИНА</text><line x1="214" y1="144" x2="227.0" y2="144.0" stroke="#999999" stroke-width="2"/><path d="M236.0 144.0 L227.0 149.0 L227.0 139.0 Z" fill="#999999"/><line x1="214" y1="258" x2="227.0" y2="258.0" stroke="#999999" stroke-width="2"/><path d="M236.0 258.0 L227.0 263.0 L227.0 253.0 Z" fill="#999999"/><rect x="320" y="84" width="330" height="234" rx="6" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><rect x="320" y="84" width="330" height="36" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><rect x="320" y="112" width="330" height="8" rx="0" fill="#fdf6e6" stroke="none" stroke-width="0"/><text x="485.0" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">КОНТРОЛЕР пристрою</text><rect x="336" y="132" width="298" height="38" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="348" y="148" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">регістр стану</text><text x="348" y="163" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">готовий? зайнятий? помилка?</text><rect x="336" y="176" width="298" height="38" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="348" y="192" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">регістр керування</text><text x="348" y="207" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">команда: читати, писати, скинути</text><rect x="336" y="220" width="298" height="38" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="348" y="236" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">регістр даних</text><text x="348" y="251" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">байти туди й назад</text><rect x="336" y="264" width="298" height="38" rx="4" fill="#fafafa" stroke="#cccccc" stroke-width="1.2"/><text x="348" y="280" text-anchor="start" font-size="11.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">регістр адреси</text><text x="348" y="295" text-anchor="start" font-size="10" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">з якого місця на пристрої</text><line x1="300" y1="200" x2="305.0" y2="200.0" stroke="#999999" stroke-width="2.2"/><path d="M314.0 200.0 L305.0 205.0 L305.0 195.0 Z" fill="#999999"/><rect x="700" y="130" width="240" height="140" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.8"/><text x="820.0" y="163.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРИСТРІЙ</text><text x="820.0" y="183.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif"></text><text x="820.0" y="203.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">диск, клавіатура,</text><text x="820.0" y="223.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">мережева карта, принтер,</text><text x="820.0" y="243.8" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">датчик — що завгодно</text><line x1="656" y1="200" x2="685.0" y2="200.0" stroke="#999999" stroke-width="2.2"/><path d="M694.0 200.0 L685.0 205.0 L685.0 195.0 Z" fill="#999999"/><rect x="40" y="342" width="900" height="82" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="62" y="366" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Уся робота з пристроєм зводиться до читання й запису кількох регістрів контролера. Дістатися до них можна двома</text><text x="62" y="386" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">способами: окремими інструкціями введення-виведення з власним простором портів, або відображенням регістрів</text><text x="62" y="410" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">у звичайні адреси пам'яті — тоді драйвер просто пише в покажчик, і жодних особливих інструкцій не потрібно.</text></svg>