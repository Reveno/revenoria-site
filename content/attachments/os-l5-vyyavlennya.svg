<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Виявлення й відновлення: знайти цикл у графі очікування та розірвати його</text><rect x="30" y="62" width="456" height="268" rx="6" fill="#ffffff" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="62" width="456" height="38" rx="6" fill="#fbecec" stroke="#96302f" stroke-width="1.6"/><rect x="30" y="92" width="456" height="8" rx="0" fill="#fbecec" stroke="none" stroke-width="0"/><text x="258" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#96302f" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Цикл знайдено — це глухий кут</text><line x1="281.8" y1="179.0" x2="330.3" y2="234.2" stroke="#96302f" stroke-width="2.2"/><path d="M336.2 241.0 L326.5 237.5 L334.0 230.9 Z" fill="#96302f"/><line x1="324.0" y1="268.0" x2="201.0" y2="268.0" stroke="#96302f" stroke-width="2.2"/><path d="M192.0 268.0 L201.0 263.0 L201.0 273.0 Z" fill="#96302f"/><line x1="179.8" y1="241.0" x2="228.3" y2="185.8" stroke="#96302f" stroke-width="2.2"/><path d="M234.2 179.0 L232.0 189.1 L224.5 182.5 Z" fill="#96302f"/><circle cx="258" cy="152" r="34" fill="#eaf0f8" stroke="#204a80" stroke-width="2"/><text x="258" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T1</text><circle cx="360" cy="268" r="34" fill="#eaf0f8" stroke="#204a80" stroke-width="2"/><text x="360" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T2</text><circle cx="156" cy="268" r="34" fill="#eaf0f8" stroke="#204a80" stroke-width="2"/><text x="156" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T3</text><text x="258" y="316" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T1 чекає на T2, T2 — на T3, T3 — на T1</text><rect x="494" y="62" width="456" height="268" rx="6" fill="#ffffff" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="62" width="456" height="38" rx="6" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.6"/><rect x="494" y="92" width="456" height="8" rx="0" fill="#f4f8f4" stroke="none" stroke-width="0"/><text x="722" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Жертву знято — кільце розірвано</text><line x1="745.8" y1="179.0" x2="794.3" y2="234.2" stroke="#cccccc" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M800.2 241.0 L790.5 237.5 L798.0 230.9 Z" fill="#cccccc"/><line x1="788.0" y1="268.0" x2="665.0" y2="268.0" stroke="#cccccc" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M656.0 268.0 L665.0 263.0 L665.0 273.0 Z" fill="#cccccc"/><line x1="643.8" y1="241.0" x2="692.3" y2="185.8" stroke="#2f6b40" stroke-width="2.2"/><path d="M698.2 179.0 L696.0 189.1 L688.5 182.5 Z" fill="#2f6b40"/><circle cx="722" cy="152" r="34" fill="#eaf0f8" stroke="#204a80" stroke-width="2"/><text x="722" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T1</text><circle cx="620" cy="268" r="34" fill="#eaf0f8" stroke="#204a80" stroke-width="2"/><text x="620" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T3</text><circle cx="824" cy="268" r="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="6 4"/><text x="824" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbbbbb" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T2</text><circle cx="854" cy="240" r="14" fill="#fbecec" stroke="#96302f" stroke-width="1.8"/><line x1="848" y1="234" x2="860" y2="246" stroke="#96302f" stroke-width="2.2"/><line x1="860" y1="234" x2="848" y2="246" stroke="#96302f" stroke-width="2.2"/><text x="722" y="316" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">T2 відкочено; T3 і T1 отримують ресурси й завершуються</text><rect x="30" y="348" width="920" height="104" rx="6" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.2"/><text x="52" y="374" text-anchor="start" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">За якими ознаками обирають жертву:</text><text x="64" y="398" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  хто встиг зробити найменше роботи — його відкат обійдеться найдешевше;</text><text x="64" y="418" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  хто тримає найменше ресурсів або зайняв їх останнім;</text><text x="64" y="438" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">•  хто вже був жертвою раніше — його намагаються більше не чіпати, інакше він голодуватиме.</text></svg>