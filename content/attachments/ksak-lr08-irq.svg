<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 265' width='900' height='265'><rect width='900' height='265' fill='#ffffff'/><text x='450' y='28' font-size='18' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Обробка переривання від пристрою</text><rect x='20' y='70' width='150' height='80' rx='6' fill='#e3f2fd' stroke='#1565c0' stroke-width='2'/><text x='95.0' y='106.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Пристрій</text><text x='95.0' y='123.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>(диск, мережа)</text><line x1='170' y1='110' x2='195' y2='110' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='195,110 185.78939005997114,113.8941834230865 185.78939005997114,106.1058165769135' fill='#111'/><rect x='195' y='70' width='150' height='80' rx='6' fill='#fff3e0' stroke='#ef6c00' stroke-width='2'/><text x='270.0' y='106.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Контролер</text><text x='270.0' y='123.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>переривань</text><line x1='345' y1='110' x2='370' y2='110' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='370,110 360.78939005997114,113.8941834230865 360.78939005997114,106.1058165769135' fill='#111'/><rect x='370' y='70' width='150' height='80' rx='6' fill='#e8f5e9' stroke='#2e7d32' stroke-width='2'/><text x='445.0' y='106.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Процесор</text><text x='445.0' y='123.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>зберігає стан</text><line x1='520' y1='110' x2='545' y2='110' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='545,110 535.7893900599712,113.8941834230865 535.7893900599712,106.1058165769135' fill='#111'/><rect x='545' y='70' width='150' height='80' rx='6' fill='#f3e5f5' stroke='#6a1b9a' stroke-width='2'/><text x='620.0' y='106.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Обробник</text><text x='620.0' y='123.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>(ISR)</text><line x1='695' y1='110' x2='720' y2='110' stroke='#111' stroke-width='2' stroke-linecap='round'/><polygon points='720,110 710.7893900599712,113.8941834230865 710.7893900599712,106.1058165769135' fill='#111'/><rect x='720' y='70' width='150' height='80' rx='6' fill='#f5f5f5' stroke='#666' stroke-width='2'/><text x='795.0' y='106.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>Повернення</text><text x='795.0' y='123.4' font-size='14' text-anchor='middle' fill='#111' font-weight='bold' font-family='Arial, Helvetica, sans-serif'>до програми</text><text x='95.0' y='175' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>подає сигнал IRQ</text><text x='270.0' y='175' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>вибирає найвищий</text><text x='270.0' y='191' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>пріоритет, маскує</text><text x='445.0' y='175' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>запам'ятовує PC</text><text x='445.0' y='191' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>і прапорці</text><text x='620.0' y='175' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>коротко обробляє</text><text x='620.0' y='191' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>подію</text><text x='795.0' y='175' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>відновлює PC,</text><text x='795.0' y='191' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>програма триває</text><text x='450' y='245' font-size='12' text-anchor='middle' fill='#666' font-weight='normal' font-family='Arial, Helvetica, sans-serif'>Таймер працює так само: апаратно генерує переривання через рівні проміжки (такт системи), і на кожному такті планувальник може змінити процес.</text></svg>