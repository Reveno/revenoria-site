<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470"><rect width="980" height="470" fill="#ffffff"/><text x="490.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Прямий доступ до пам'яті: процесор віддає роботу й іде</text><rect x="40" y="86" width="150" height="76" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="115.0" y="128.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПРОЦЕСОР</text><rect x="40" y="250" width="150" height="76" rx="4" fill="#eaf0f8" stroke="#204a80" stroke-width="1.8"/><text x="115.0" y="282.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ОПЕРАТИВНА</text><text x="115.0" y="301.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ПАМ'ЯТЬ</text><rect x="250" y="168" width="160" height="80" rx="4" fill="#fdf6e6" stroke="#9a6a12" stroke-width="1.8"/><text x="330.0" y="202.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">КОНТРОЛЕР</text><text x="330.0" y="221.8" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">DMA</text><rect x="460" y="168" width="130" height="80" rx="4" fill="#f4f8f4" stroke="#2f6b40" stroke-width="1.8"/><text x="525.0" y="212.5" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">ДИСК</text><line x1="194" y1="106" x2="240.6" y2="168.8" stroke="#204a80" stroke-width="2.2"/><path d="M246.0 176.0 L236.6 171.8 L244.6 165.8 Z" fill="#204a80"/><line x1="414" y1="208" x2="447.0" y2="208.0" stroke="#9a6a12" stroke-width="2.2"/><path d="M456.0 208.0 L447.0 213.0 L447.0 203.0 Z" fill="#9a6a12"/><line x1="246" y1="240" x2="201.4" y2="270.9" stroke="#9a6a12" stroke-width="2.2"/><path d="M194.0 276.0 L198.6 266.8 L204.2 275.0 Z" fill="#9a6a12"/><line x1="300" y1="172" x2="206.8" y2="150.1" stroke="#2f6b40" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M198.0 148.0 L207.9 145.2 L205.6 154.9 Z" fill="#2f6b40"/><circle cx="214" cy="128" r="11" fill="#ffffff" stroke="#204a80" stroke-width="1.8"/><text x="214" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><circle cx="435" cy="198" r="11" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><text x="435" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><circle cx="216" cy="268" r="11" fill="#ffffff" stroke="#9a6a12" stroke-width="1.8"/><text x="216" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><circle cx="250" cy="146" r="11" fill="#ffffff" stroke="#2f6b40" stroke-width="1.8"/><text x="250" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><rect x="620" y="86" width="330" height="240" rx="6" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.5"/><text x="785.0" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Порядок дій</text><circle cx="646" cy="146" r="11" fill="#204a80" stroke="#204a80" stroke-width="1"/><text x="646" y="150" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">1</text><text x="666" y="144" text-anchor="start" font-size="11" font-weight="bold" fill="#204a80" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Процесор дає команду:</text><text x="666" y="160" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">«перенеси 4096 байтів з диска</text><text x="666" y="174" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">за адресу 0x7f00» — і йде далі</text><circle cx="646" cy="194" r="11" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="646" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">2</text><text x="666" y="192" text-anchor="start" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Контролер читає блок</text><text x="666" y="208" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">з диска власними силами</text><circle cx="646" cy="242" r="11" fill="#9a6a12" stroke="#9a6a12" stroke-width="1"/><text x="646" y="246" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">3</text><text x="666" y="240" text-anchor="start" font-size="11" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">і пише його прямо в пам'ять,</text><text x="666" y="256" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">не турбуючи процесора зовсім</text><circle cx="646" cy="290" r="11" fill="#2f6b40" stroke="#2f6b40" stroke-width="1"/><text x="646" y="294" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#ffffff" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">4</text><text x="666" y="288" text-anchor="start" font-size="11" font-weight="bold" fill="#2f6b40" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Коли все готово — одне</text><text x="666" y="304" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">переривання на весь блок</text><rect x="30" y="356" width="920" height="96" rx="6" fill="#f2f4f7" stroke="#cfcfcf" stroke-width="1.2"/><text x="52" y="380" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Порахуймо виграш: без DMA блок у 4096 байтів — це 4096 переривань або 4096 обертів циклу опитування.</text><text x="52" y="400" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">З DMA — рівно одне переривання на весь блок. Різниця в тисячі разів, і саме тому інакше сучасні диски й мережеві</text><text x="52" y="420" text-anchor="start" font-size="12.5" font-weight="normal" fill="#555555" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">карти працювати не можуть: гігабіт на секунду перериваннями не обслужиш.</text><text x="52" y="444" text-anchor="start" font-size="12.5" font-weight="bold" fill="#9a6a12" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">Плата — контролер пише в пам'ять повз кеш процесора, тож ядро мусить стежити за узгодженістю кешів.</text></svg>